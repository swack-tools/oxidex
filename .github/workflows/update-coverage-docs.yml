name: Update Coverage Documentation

# This job measures extraction coverage rather than estimating it, so it needs
# an oxidex binary and the pinned ExifTool. The corpus and the comparison tool
# are inputs to the published number, so a change to either must re-run it --
# hence tests/fixtures, conformance.py and .exiftool-version in the filter.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'oxidex-tags-*/src/**'
      - 'tests/fixtures/**'
      - 'scripts/generate_tag_coverage.py'
      - 'scripts/exiftool_oracle.py'
      - 'tools/exiftool-tables/conformance.py'
      - '.exiftool-version'
      - '.github/workflows/update-coverage-docs.yml'
  # Backstop against push-cancellation, not a second schedule for its own sake.
  # See the concurrency note below: a starved run is invisible, and this is what
  # bounds how long the published number can stay stale -- one day, worst case.
  schedule:
    - cron: '0 5 * * *' # daily, 05:00 UTC (an hour before jpeg-tag-matrix)
  workflow_dispatch:

# cancel-in-progress is right for this job: it regenerates a report from HEAD,
# so a superseded run's output is worthless and there is no point paying for it.
#
# The hazard is that it is SILENT. A cancelled run is not a failed run -- no
# check goes red, nothing is reported -- so if main is pushed faster than this
# job completes, the coverage doc simply stops updating and looks fine. That
# margin used to be enormous (the job was ~22s of Python). It is now ~1.2min
# warm and ~3.4min cold, because the job builds oxidex and diffs 238 files
# against the pinned ExifTool. Main currently sees a push every ~6-10 minutes,
# so the margin holds -- but it is a margin now, where it used to be a rounding
# error, and the fix fleet can merge in bursts.
#
# Hence the daily cron above. It costs one extra run a day and guarantees the
# published number converges on reality regardless of push cadence. If the doc
# is ever observed to be days stale, look here first rather than at the script.
concurrency:
  group: update-coverage-docs
  cancel-in-progress: true

jobs:
  update-coverage:
    name: Generate Coverage Report
    # 4x. This used to be 2x because the whole job was ~13 seconds of Python:
    # it counted `.insert(`/`.push(` call sites in src/parsers and mapped the
    # count through hand-tuned thresholds to a "coverage %". That number was
    # never a measurement, so the job was cheap and wrong. It now builds
    # oxidex and diffs it against the pinned ExifTool over the fixture corpus,
    # which is dominated by the cargo build -- hence 4x, with rust-cache
    # carrying the build between runs. 8x is the repo's standing ceiling and
    # belongs to jpeg-tag-matrix; this job is far smaller and does not need it.
    #
    # Debug, not release: 44 files is nothing to parse, so the whole job is
    # compile time and `--release` would only add LTO for no measured gain.
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 30
    # Only contents:write is needed now that this pushes to main directly.
    # pull-requests:write and actions:write were for the PR/dispatch dance
    # this no longer does.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history: the push-retry below rebases onto origin/main, and a
          # shallow clone has no common ancestor to rebase against.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07)
        with:
          toolchain: stable

      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          cache-on-failure: true
          cache-provider: warpbuild
          shared-key: update-coverage-docs

      # No EXIFTOOL_VERSION literal. A pin in this file would be a second
      # source of truth, and when one drifted from .exiftool-version the JPEG
      # matrix graded 13.55 output against 13.59 tables and reported sixteen
      # correct Canon R6 Mark III tags as regressions. Resolved at run time.
      - name: Resolve pinned ExifTool version
        id: exiftool-version
        run: |
          set -euo pipefail
          V=$(tr -d '[:space:]' < .exiftool-version)
          case "$V" in
            *[!0-9.]* | "" | .* | *.)
              echo "::error::refusing non-numeric ExifTool pin '$V'"; exit 1 ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Same path and same key as jpeg-tag-matrix.yml, deliberately: both
      # shallow-clone the same tag to /tmp/exiftool, so sharing the entry is
      # correct and halves the download. The `exiftool-clone-` prefix is what
      # keeps it distinct from ci.yml's `exiftool-src-` tarball at
      # /tmp/exiftool-src -- caches are scoped to the repo, not the workflow,
      # so one shared key across two different paths would hand a cache hit to
      # a job whose path nothing had populated. No restore-keys: the key IS
      # the pinned version, so any prefix match would serve a different
      # release -- the exact skew that manufactures phantom regressions.
      - name: Restore pinned ExifTool source
        id: exiftool-cache
        uses: WarpBuilds/cache/restore@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: /tmp/exiftool
          key: exiftool-clone-${{ steps.exiftool-version.outputs.version }}-${{ runner.os }}

      - name: Clone pinned ExifTool
        if: steps.exiftool-cache.outputs.cache-hit != 'true'
        env:
          V: ${{ steps.exiftool-version.outputs.version }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$V" \
            https://github.com/exiftool/exiftool /tmp/exiftool

      # Archive::Zip gates every ZIP-container format; without it a .docx
      # reports FileType: ZIP while -ver still prints the right release, so a
      # matching version is not on its own a working oracle. Runs even on a
      # cache hit, as do the assertions: a corrupted or wrong-version entry
      # must fail the job, not sail through.
      - name: Install Archive::Zip and verify ExifTool
        env:
          V: ${{ steps.exiftool-version.outputs.version }}
        run: |
          set -euo pipefail
          sudo cpanm --notest Archive::Zip 2>/dev/null || sudo cpan -T Archive::Zip
          perl -MArchive::Zip -e 1
          echo "/tmp/exiftool" >> "$GITHUB_PATH"
          GOT=$(/tmp/exiftool/exiftool -ver)
          [ "$GOT" = "$V" ] || { echo "::error::installed ExifTool $GOT, expected $V"; exit 1; }
          echo "EXIFTOOL=/tmp/exiftool/exiftool" >> "$GITHUB_ENV"

      # Only on a miss, and only after the verify above passed -- default
      # `success()` semantics keep a bad tree from being persisted.
      - name: Save pinned ExifTool source
        if: steps.exiftool-cache.outputs.cache-hit != 'true'
        uses: WarpBuilds/cache/save@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: /tmp/exiftool
          key: ${{ steps.exiftool-cache.outputs.cache-primary-key }}

      - name: Build oxidex
        run: cargo build --bin oxidex

      # Two corpus roots, because neither covers what the other does:
      #
      #   t/images       ExifTool's own test corpus -- ~126 formats. Already on
      #                  disk from the clone above, pinned to the same release
      #                  the tables came from, so it costs nothing extra and
      #                  cannot drift from the oracle.
      #   tests/fixtures the OxiDex-specific samples (MakerNote-heavy JPEGs).
      #
      # Measuring only tests/fixtures reported 96.0%, which was true and
      # misleading: it covered 6 formats. Across both roots the honest number
      # is 77.5% over 126 formats, and the formats that drag it down (CRW 1.9%,
      # DICOM 3.0%, FIT 0%) are ones the narrow corpus never touched.
      #
      # --exclude-ext, not --ext: a deny-list of things that are never metadata
      # keeps scoring every real format including ones added later, whereas an
      # allow-list silently omits each new format until someone extends it.
      #
      # The floors are the degraded-oracle guard. A broken oracle does not
      # crash -- it reads a fraction of the corpus and reports a confident,
      # precisely-formatted, completely wrong percentage. The current run is
      # 238 files / ~12,700 ExifTool tags; the floors sit ~15% under, close
      # enough to catch a degradation and loose enough to survive a fixture
      # being retired. Raise them when the corpus grows.
      - name: Measure extraction coverage against pinned ExifTool
        run: |
          uv run tools/exiftool-tables/conformance.py \
            /tmp/exiftool/t/images tests/fixtures \
            --recursive \
            --exclude-ext sh,md,py,json \
            --oxidex ./target/debug/oxidex \
            --min-files 200 \
            --min-tags 10000 \
            --json-out "$RUNNER_TEMP/conformance.json"

      - name: Generate coverage report
        env:
          ET_VER: ${{ steps.exiftool-version.outputs.version }}
        run: |
          uv run scripts/generate_tag_coverage.py \
            --conformance "$RUNNER_TEMP/conformance.json" \
            --corpus-desc "ExifTool ${ET_VER} \`t/images\` + \`tests/fixtures\`" \
            --output docs/reference/tag-coverage-analysis.md
          echo "Coverage report generated"

      # The same numbers are quoted in prose in README, the guide, the
      # architecture pages and a Rust doc comment. Hand-maintained, they
      # drifted to 32,677 tags and "113% of ExifTool" and stayed there through
      # several releases. Deriving them is the only thing that actually fixes
      # that; #609 corrected them by hand, which fixed today and not tomorrow.
      - name: Sync quoted tag statistics
        run: |
          uv run scripts/sync_tag_stats.py \
            --conformance "$RUNNER_TEMP/conformance.json"

      - name: Upload conformance results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance.json
          retention-days: 90

      # Repo-wide, not a file list. The sync step rewrites whichever files
      # scripts/sync_tag_stats.py has rules for, and naming them here would be
      # a second copy of that list -- so adding a rule would silently fail to
      # commit its file, which is exactly the drift being fixed. Nothing else
      # in this job writes to the tree.
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet || echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --stat

      # Pushes straight to main. This used to open an auto-merging PR, because
      # main required the "Lint & Audit"/"Build & Test" checks and a bot push
      # could not satisfy them. That PR route then broke for a different
      # reason: an ENTERPRISE policy forbids GitHub Actions from creating pull
      # requests at all ("GitHub Actions is not permitted to create or approve
      # pull requests"), which no repo or org setting can override. The
      # required checks have since been removed from main, so the direct push
      # works and the whole PR dance is unnecessary.
      #
      # No "[skip ci]": ci.yml runs on push to main, so these commits are
      # still verified -- after landing rather than before, which is the
      # trade that comes with dropping the required checks.
      # The ref guard is load-bearing, not boilerplate. This step ends in
      # `git push origin HEAD:main`, and HEAD is whatever ref was checked out.
      # push and schedule are always main, but workflow_dispatch accepts ANY
      # ref -- so dispatching this workflow from a feature branch to test it
      # would push that entire unreviewed branch to main, as a fast-forward,
      # bypassing review completely. Matches jpeg-tag-matrix.yml, which guards
      # its equivalent step the same way.
      - name: Commit coverage update
        if: github.ref == 'refs/heads/main' && steps.changes.outputs.changed == 'true'
        env:
          SRC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -u, matching the repo-wide diff above: stages the report plus any
          # prose file the stats sync rewrote, without duplicating that list.
          git add -u
          git commit -m "docs: auto-update tag coverage analysis and quoted stats" \
                     -m "Generated from commit ${SRC_SHA}"

          # main moves fast here (the fix fleet merges frequently), so a plain
          # push loses a race often enough to matter. Rebase onto whatever
          # landed meanwhile and retry rather than failing the run.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (main moved); rebasing and retrying"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not push after 3 attempts"
          exit 1
