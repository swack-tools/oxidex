name: Update Coverage Documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'oxidex-tags-*/src/**'
      - 'scripts/generate_tag_coverage.py'
      - '.github/workflows/update-coverage-docs.yml'
  workflow_dispatch:

concurrency:
  group: update-coverage-docs
  cancel-in-progress: true

jobs:
  update-coverage:
    name: Generate Coverage Report
    # 2x: the whole job is ~13 seconds -- one Python script under uv, then a
    # git diff and possibly a PR. The smallest runner is the right one.
    runs-on: warp-ubuntu-latest-x64-2x
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Generate coverage report
        run: |
          uv run scripts/generate_tag_coverage.py --output docs/reference/tag-coverage-analysis.md
          echo "Coverage report generated"

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/reference/tag-coverage-analysis.md || echo "changed=true" >> $GITHUB_OUTPUT

      # Opens an auto-merging PR rather than pushing straight to main. main now
      # requires the "Lint & Audit"/"Build & Test" checks, which blocks direct
      # pushes — including this bot's. Going through a PR keeps the automation
      # working AND means these commits are verified; previously they carried
      # "[skip ci]" and landed on main entirely unchecked.
      - name: Open auto-merging PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch="bot/coverage-docs-${SRC_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/reference/tag-coverage-analysis.md
          # NOTE: no "[skip ci]" — a required status check that never runs
          # leaves the PR unmergeable forever.
          git commit -m "docs: auto-update tag coverage analysis" \
                     -m "Generated from commit ${SRC_SHA}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs: auto-update tag coverage analysis" \
            --body "Regenerated from ${SRC_SHA} by the Update Coverage Documentation workflow."
          # Events triggered by GITHUB_TOKEN do not start workflow runs, so
          # this PR gets no `pull_request` CI run and its required checks would
          # never report -- leaving it open forever. workflow_dispatch is the
          # documented exception to that rule, so ask for the run explicitly.
          gh workflow run ci.yml --ref "$branch"
          gh pr merge "$branch" --squash --auto --delete-branch
