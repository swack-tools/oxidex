name: CI

on:
  # Push is restricted to main: every other branch is covered by its pull
  # request, so running both produced two full duplicate runs per PR push.
  # Requiring "Lint & Audit"/"Build & Test" as status checks also means the
  # push run and the PR run would race to report the same check name on the
  # same SHA, and a cancelled push run could overwrite a green PR run.
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  # NOTE: no paths-ignore. These jobs are required status checks, and a
  # required check that is filtered out never reports at all — a docs-only PR
  # would sit "Expected — waiting for status" forever with no way to merge.
  # Skipping cheaply is not worth a class of permanently unmergeable PRs.

concurrency:
  # Pull request runs are keyed by branch, so pushing a new commit cancels the
  # superseded run (~13 CI minutes saved per force-push).
  #
  # Pushes to main are keyed by COMMIT SHA instead, which makes each merge its
  # own group. This is deliberate: with a shared `main` group, every merge
  # cancelled the previous merge's run, and at ~4 merges/hour no post-merge run
  # ever survived its own 13-minute duration. The only verification a merged
  # commit ever gets was being destroyed by the next merge (20 of the last 25
  # main runs were `cancelled`), which is how #211 and #256 shipped a stale
  # api/oxidex.h and turned main red. Keying by SHA also avoids serialising
  # runs behind one another, which a plain `cancel-in-progress: false` would do.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features -- -D warnings
      - uses: rustsec/audit-check@e9159ac5f7d7d873ce074ca134da2f445c0a4a61 # v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Accept the informational "bincode is unmaintained" advisory: it is a
          # transitive dependency with no security vulnerability, and the
          # advisory postdates the last green run. Reporting it also makes the
          # action fail on push events ("Resource not accessible by
          # integration") when it tries to file an issue without issues:write.
          ignore: RUSTSEC-2025-0141

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          # Pin cbindgen: the committed api/oxidex.h is generated with 0.29.2,
          # and newer cbindgen emits extra #define macros that would fail the
          # "Verify C header is up-to-date" check non-deterministically.
          tool: cargo-nextest,cbindgen@0.29.2
      - run: cargo build --release --all-features --features tag-comparison-binary
      # Tests run in the (unwind) test profile: the release profile sets
      # panic = "abort", which newer cargo refuses to mix with the unwind test
      # harness. The release artifacts themselves are covered by the build step
      # above and the multi-platform jobs.
      - run: cargo nextest run --all-features --features tag-comparison-binary
      - name: C FFI integration test
        run: cargo test --test ffi_c_integration -- --nocapture
      - name: Run doc tests
        run: cargo test --doc --all-features
      - name: Verify C header is up-to-date
        run: |
          cbindgen --config cbindgen.toml --crate oxidex --output api/oxidex.h.tmp
          diff -q api/oxidex.h api/oxidex.h.tmp || (echo "C header out of date" && exit 1)
          rm api/oxidex.h.tmp
      - name: Install ExifTool
        run: |
          # "files/latest/download" now resolves to the Windows/default zip
          # package rather than the Unix tarball, so find the newest
          # Image-ExifTool-*.tar.gz entry from the project's RSS feed instead.
          tarball_url=$(curl -sSL "https://sourceforge.net/projects/exiftool/rss?path=/" \
            | grep -oE '<link>[^<]*Image-ExifTool-[0-9.]+\.tar\.gz/download</link>' \
            | head -1 \
            | sed -E 's#<link>(.*)</link>#\1#')
          if [ -z "$tarball_url" ]; then
            echo "Could not find an Image-ExifTool tarball URL" >&2
            exit 1
          fi
          curl -sSL "$tarball_url" -o /tmp/exiftool.tar.gz
          mkdir -p /tmp/exiftool-src
          tar xzf /tmp/exiftool.tar.gz -C /tmp/exiftool-src --strip-components=1
          echo "/tmp/exiftool-src" >> "$GITHUB_PATH"
          /tmp/exiftool-src/exiftool -ver
      - name: Integration tests (ExifTool comparison)
        run: cargo test --features exiftool-comparison

  multi-platform:
    name: Multi-platform Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: warp-ubuntu-latest-arm64-2x
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools musl-dev
      - run: cargo build --release --target ${{ matrix.target }}
      - run: ls -lh target/${{ matrix.target }}/release/oxidex

  metrics:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Run benchmarks
        run: cargo bench --bench integration_benchmarks --bench parse_benchmarks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: target/criterion/
          retention-days: 90
