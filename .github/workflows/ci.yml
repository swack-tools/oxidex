name: CI

on:
  # Push runs on main and on refactor/tag-machinery. Every change reaches the
  # tip through a PR. A merge queue schedules a synthetic merge result using
  # merge_group, which is the check evidence needed before that candidate can
  # land on main. The push run remains separate evidence for the exact main
  # SHA after a merge; it must complete successfully before release work.
  # Other branches stay PR-only, since running both there duplicated every run.
  push:
    branches: [main, refactor/tag-machinery]
  pull_request:
    branches: ['**']
  merge_group:
    branches: [main]
  # Manual trigger. Now that "Lint & Audit"/"Build & Test" are required status
  # checks, a PR whose event GitHub failed to schedule has no required check to
  # report and cannot be merged at all. This is the escape hatch that re-runs
  # CI against a branch head without needing an empty commit.
  workflow_dispatch:
  # NOTE: no paths-ignore. These jobs are required status checks, and a
  # required check that is filtered out never reports at all — a docs-only PR
  # would sit "Expected — waiting for status" forever with no way to merge.
  # Skipping cheaply is not worth a class of permanently unmergeable PRs.

permissions:
  contents: read

concurrency:
  # Pull request runs are keyed by branch, so pushing a new commit cancels the
  # superseded run (~13 CI minutes saved per force-push).
  #
  # Push runs share the branch ref, so a newer tip commit cancels the obsolete
  # build rather than consuming runners for a commit that can no longer deploy.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Runners: every job runs on a standard GitHub-hosted runner, which is free
# for this public repository (ubuntu-latest = 4 vCPU / 16 GB). The per-job
# "2x/4x/8x" notes and the table below are the historical WarpBuild sizing
# measurements (2x=2vCPU/7GB, 4x=4/16, 8x=8/32, 16x=16/64), kept as evidence
# of what more cores buy each job. Larger GitHub runners are billed even for
# public repositories; measure before reaching for one.
#
# Sizes below were chosen from measured step timings, not job wall-clock --
# a slow job is not necessarily a CPU-bound one. See the per-job notes.
#
# The Build & Test workload was swept across every size on a throwaway
# benchmark workflow (removed once it had served its purpose; see PR #305 for
# the harness). Seconds, cold cache, mean of the runs taken:
#
#         build   nextest   clippy   total   gain vs prev   cost vs prev
#   2x      188      381       30      599        --             --
#   4x      118      202       20      339      1.77x           2x
#   8x       97      122       14      233      1.46x           2x
#  16x       91       94       16      200      1.16x           2x
#  32x       96       80       12      187      1.07x           2x
#
# 8x is both the knee and this repo's ceiling. Each doubling past it costs
# 2x and returns well under 1.2x, because `cargo build --release` saturates
# completely at 8 cores (97 -> 91 -> 96s is flat within noise) and it is the
# largest single component. Only nextest keeps scaling, and not enough to
# carry the total. The 16x/32x rows are kept as the evidence for stopping,
# not as options.
#
# Measure before changing these; do not adjust by intuition. Reproducing the
# harness is a few lines: a matrix over `runs-on:` labels running these same
# commands with each phase as its own step, then read per-step seconds from
# `gh api repos/{owner}/{repo}/actions/runs/{id}/jobs`.
#
# NOTE: "Lint & Audit" and "Build & Test" are required status checks. Changing
# `runs-on` is safe because it does not change the check name; renaming or
# splitting these jobs is NOT safe -- a required check that never reports
# leaves every PR permanently unmergeable (see the paths-ignore note above).
#
# "Release Build" was split OUT of Build & Test, which kept its name and so
# kept reporting. It is a new check name, so it is not required until someone
# with admin rights adds it to branch protection. Until that happens a
# release-profile break does not block a merge, even though the job goes red.
#
# A "Doc Tests" job was split out the same way and has since been folded back
# INTO Build & Test -- see the doc-test step there for why. Deleting it was
# safe precisely because it was never a required check; the reverse move, and
# the reason the doc tests now block merges again, is the point of the change.
jobs:
  lint:
    name: Lint & Audit
    # 4x, not 8x: of this job's ~4 minutes only ~51s is compile-bound
    # (clippy --all-features). The dominant step is rustsec/audit-check at
    # ~2m55s, which is network I/O against the advisory database and does not
    # get faster with more cores.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      # shared-key separates this job's cache from Build & Test's so a
      # clippy-only cache miss can't evict the other.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: lint
      - run: cargo fmt --all -- --check
      # Release recipe tests render the real justfile and execute the rendered
      # shell against controlled fake git/gh commands. Keep that behavioral
      # coverage active on Linux instead of silently depending on a developer's
      # locally installed `just` binary.
      - name: Install just for release recipe tests
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just
      # Pure-Python, no build: catches a test reading the pinned sample corpus
      # without gating on its presence. Such a test passes locally (the corpus
      # is a developer cache) and panics on NotFound in CI, and because nextest
      # is fail-fast one panic aborts the whole suite -- which is how main
      # stayed red for two days looking like a single broken test.
      - run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - run: python3 tools/ci/check-corpus-guards.py
      # The parity ratchet. The catalog-join job already refuses any drift
      # from the published measurements, but that check enforces "identical",
      # not "not worse": the moment someone regenerates the snapshot -- which
      # is exactly what a drift failure tells them to do -- a regression lands
      # as easily as an improvement and CI goes green again either way. This
      # reads the same committed measurements and fails when a tracked count
      # moved the wrong way, so lowering one stays a deliberate act
      # (`parity_ratchet.py raise`) rather than a side effect.
      # Committed JSON only: no ExifTool, no build, ~1 s.
      - run: python3 tools/ci/parity_ratchet.py report
      - run: python3 tools/ci/parity_ratchet.py check
      # Also pure-Python and buildless. update-coverage-docs rewrites these
      # numbers on every push to main, so this is not what keeps them correct
      # -- it is what catches a rule that has STOPPED MATCHING. Each rule
      # asserts exactly one match, so rewording "It defines N metadata tags"
      # makes the sync a silent no-op and the number quietly goes stale again,
      # which is the entire failure this automation replaced. Fix with
      # `just sync-tag-stats`, or update the rule if the prose changed on
      # purpose.
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - run: uv run scripts/sync_tag_stats.py --check
      # The docs status page (/status/) is rendered from committed measurements
      # (the published snapshots, parity_floors.json, the coverage reports, the
      # rehearsal record). This re-renders it and fails on any difference, so a
      # snapshot or floor change that does not refresh the page cannot land.
      # tools/ci/test_render_status.py (the unittest step above) checks the same
      # thing without PyYAML; this step also recounts the tag definitions.
      # Fix with `uv run tools/docs/render_status.py`. Buildless, ~2 s.
      - run: uv run tools/docs/render_status.py --check
      - run: cargo clippy --all-features -- -D warnings
      - uses: rustsec/audit-check@e9159ac5f7d7d873ce074ca134da2f445c0a4a61 # v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Accept the informational "bincode is unmaintained" advisory: it is a
          # transitive dependency with no security vulnerability, and the
          # advisory postdates the last green run. Reporting it also makes the
          # action fail on push events ("Resource not accessible by
          # integration") when it tries to file an issue without issues:write.
          ignore: RUSTSEC-2025-0141

  test:
    name: Build & Test
    # 8x: nextest parallelises across tests, and this is the long pole of
    # the two compile jobs -- Release Build is sized to finish inside it,
    # not to race it.
    #
    # History, because both steps mattered: this job once ran five cargo
    # invocations across three feature graphs, and cargo fingerprints per
    # feature set, so each graph forced a full nine-crate rebuild (406s).
    # Collapsing to ONE graph (--all-features, which already implies every
    # feature) took it to 267s. What remained was three compiles that share
    # nothing -- release-side profile, test profile, rustdoc are three
    # distinct fingerprints -- so they were split into three concurrent jobs
    # rather than summed on one runner.
    #
    # The rustdoc third has since come back, on purpose: doc tests only catch
    # what they are meant to catch when they run in the SAME cargo invocation
    # as the rest of the suite, which means a plain `cargo test` step here
    # rather than a `cargo test --doc` job of its own. The step below carries
    # the evidence and its measured cost.
    #
    # If you add a cargo step here, give it `--all-features` and nothing
    # else, or it will rebuild the workspace for its own feature graph.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Cargo profile overrides, CI-only on purpose -- they are env rather than
    # a [profile.test] edit so local dev and the OOM guards in Cargo.toml are
    # untouched.
    #
    # [profile.test] carries codegen-units = 4; that setting and the
    # per-package opt-level = 2 overrides exist to stop the generated tag
    # crates OOMing a small machine. 16 units matches [profile.dev]. This was
    # sized on a 32 GB WarpBuild runner; the standard runner has 16 GB.
    #
    # line-tables-only keeps file:line in backtraces (RUST_BACKTRACE=1 is set
    # workflow-wide) while skipping the full debuginfo this never reads.
    #
    # If this job starts failing on memory, this block is the first suspect.
    env:
      CARGO_PROFILE_TEST_CODEGEN_UNITS: 16
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # cache-all-crates: this job also builds cargo-nextest and cbindgen via
      # taiki-e/install-action, and default caching only covers workspace
      # dependencies, not CI tooling.
      #
      # Two cache ideas were measured here and REJECTED. Do not re-add either
      # without new evidence:
      #
      #  - cache-workspace-crates: true -- 408s to 406s, i.e. nothing. Cargo
      #    fingerprints path dependencies by mtime and git checkout rewrites
      #    every workspace source file with a fresh mtime, so restored
      #    workspace artifacts always look stale. Unfixable from target/.
      #
      #  - one shared cache entry across the three compile jobs
      #    (shared-key: workspace, save-if: false on the other two) -- 133s
      #    to 147s wall clock. A test-profile cache does not contain fixloop
      #    or rustdoc artifacts, so Release Build went 48s -> 92s and Doc
      #    Tests 66s -> 76s restoring a cache that could not help them. Each
      #    compile job needs its OWN key to stay warm for its own profile;
      #    the three copies of ~/.cargo are the price of that.
      #
      #  - sccache as RUSTC_WRAPPER -- 267s to 269s, i.e. slightly worse, and
      #    that was WITH a 100% hit rate. The rate is a trap here: only 27 of
      #    94 rustc calls were cacheable at all, the other 62 being refused
      #    for `crate-type`. sccache caches rlib/lib but not cdylib,
      #    staticlib or test harnesses -- which is precisely what this crate
      #    builds for its C FFI, and precisely where the time goes.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: test
          cache-all-crates: true
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          # Pin cbindgen: the committed api/oxidex.h is generated with 0.29.2,
          # and newer cbindgen emits extra #define macros that would fail the
          # "Verify C header is up-to-date" check non-deterministically.
          tool: cargo-nextest,cbindgen@0.29.2
      # Pinned, not "newest". This step used to scrape the newest
      # Image-ExifTool tarball off SourceForge's RSS feed, which meant the
      # release CI graded against changed whenever upstream published -- while
      # the transcriptions in this repo stayed put. Different releases select
      # different sub-tables for the same bytes (13.59 vs 13.55 disagree on
      # Canon::ColorData11's discriminator), so that drift manufactures
      # regressions and fixes that have nothing to do with the diff under test.
      # The version comes from .exiftool-version, the same file the Rust and
      # Python oracles compile/read it from, so there is one source of truth.
      - name: Resolve pinned ExifTool version
        id: exiftool-version
        run: |
          set -euo pipefail
          V=$(tr -d '[:space:]' < .exiftool-version)
          case "$V" in
            *[!0-9.]* | "" | .* | *.)
              echo "::error::refusing non-numeric ExifTool pin '$V'"; exit 1 ;;
          esac
          echo "Pinned ExifTool: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      # Caches only the extracted tarball, not the Archive::Zip install: that
      # one goes into system perl dirs via sudo, and restoring those from a
      # cache is exactly the kind of half-populated perl tree that produces a
      # confidently-wrong coverage number instead of a crash. The download is
      # the network cost worth skipping; the cpan install stays unconditional.
      #
      # The key carries the resolved version and nothing else fuzzy -- no
      # restore-keys -- so a `.exiftool-version` bump always misses and
      # re-downloads. A loosely-matched key here would serve a stale ExifTool.
      # restore + save as separate steps rather than the combined action: the
      # combined one saves from a post step declared `post-if: success()`, so
      # a later failure in this job (a flaky test, say) throws away a
      # perfectly good ExifTool download and the next run re-fetches it. The
      # explicit save below runs as soon as the tree is verified.
      #
      # The `-src-` in the key is load-bearing. Caches are scoped to the
      # REPOSITORY, not the workflow, and jpeg-tag-matrix.yml caches its own
      # ExifTool at a different path (/tmp/exiftool, a git clone, vs the
      # tarball extraction here). If both used the same key the first to save
      # would win it, and the other workflow would then get cache-hit: true,
      # skip its download, and fail its -ver assertion on a path that was
      # never populated. Keep these two key families distinct.
      - name: Restore pinned ExifTool source
        id: exiftool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/exiftool-src
          key: exiftool-src-${{ steps.exiftool-version.outputs.version }}-${{ runner.os }}
      - name: Download pinned ExifTool
        if: steps.exiftool-cache.outputs.cache-hit != 'true'
        env:
          V: ${{ steps.exiftool-version.outputs.version }}
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/exiftool/exiftool/archive/refs/tags/$V.tar.gz" \
            -o /tmp/exiftool.tar.gz
          mkdir -p /tmp/exiftool-src
          tar xzf /tmp/exiftool.tar.gz -C /tmp/exiftool-src --strip-components=1
      # Archive::Zip gates every ZIP-container format. Without it a .docx
      # reports FileType: ZIP and container coverage silently collapses,
      # while -ver still prints the right release -- so install it and
      # assert it, rather than trusting the version string alone.
      #
      # Both this and the assertions below run even on a cache hit: a
      # corrupted or wrong-version cache entry must fail the job, not sail
      # through into a graded comparison run.
      - name: Install Archive::Zip and verify ExifTool
        env:
          V: ${{ steps.exiftool-version.outputs.version }}
        run: |
          set -euo pipefail
          sudo cpanm --notest Archive::Zip 2>/dev/null || sudo cpan -T Archive::Zip
          perl -MArchive::Zip -e 1
          echo "/tmp/exiftool-src" >> "$GITHUB_PATH"
          GOT=$(/tmp/exiftool-src/exiftool -ver)
          [ "$GOT" = "$V" ] || { echo "::error::installed ExifTool $GOT, expected $V"; exit 1; }
          # Exported for the nextest step below: EXIFTOOL points the oracle
          # at the pinned checkout explicitly rather than relying on PATH
          # order, so a runner image shipping its own exiftool cannot
          # quietly win the lookup.
          echo "EXIFTOOL=/tmp/exiftool-src/exiftool" >> "$GITHUB_ENV"
      # Only on a miss, and only once the step above has proved the tree is
      # the right release -- default `success()` semantics are load-bearing
      # here, so a failed verify never persists a bad tree. Reuses the
      # restore step's cache-primary-key rather than recomputing it.
      - name: Save pinned ExifTool source
        if: steps.exiftool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/exiftool-src
          key: ${{ steps.exiftool-cache.outputs.cache-primary-key }}
      # ONE feature graph for the whole job. `--all-features` already implies
      # tag-comparison-binary and exiftool-comparison, so naming either again
      # is redundant -- and naming a DIFFERENT subset is expensive: every
      # distinct feature set gets its own fingerprint, so cargo rebuilds all
      # nine workspace crates for it. Measured on run 31274865213, that is
      # what the old five-invocation layout cost: 406s of which ~139s was
      # recompiling and re-running work another step had already done.
      #
      # Tests run in the (unwind) test profile: the release profile sets
      # panic = "abort", which newer cargo refuses to mix with the unwind test
      # harness. So this is a second compile by necessity -- profile, not
      # features. The release artifacts themselves are covered by the build
      # step above and by release.yml's per-platform builds on tag pushes.
      #
      # This one invocation now covers what used to be three: the unit and
      # integration suites, the C FFI test (oxidex::ffi_c_integration), and
      # the exiftool-comparison suite -- the last only because ExifTool is
      # installed ABOVE this step now. Moving that install back below here
      # would not fail the job; it would silently skip the comparison tests.
      - run: cargo nextest run --all-features
      # The doc tests, run through plain `cargo test` on purpose. This looks
      # like it duplicates the nextest step above; it does not, and the exact
      # spelling is load-bearing. Do not "simplify" it to
      # `cargo test --doc --all-features`.
      #
      # What it guards: `cargo test` compiles doc tests LAST, inside ONE
      # invocation, against whatever target/debug/deps/liboxidex.rlib the rest
      # of the suite left on disk. `[lib] crate-type = ["lib", "staticlib",
      # "cdylib"]` makes cargo emit the lib with no `-C extra-filename` hash,
      # so ONE filename is shared by every feature graph -- and
      # tests/ffi_c_integration.rs shells out to a nested `cargo build --lib`.
      # While that nested build did not match the outer feature graph it
      # replaced the rlib mid-run, and `cargo test --all-features` failed with
      # E0432 on the parsers::magika_detector examples.
      #
      # Why neither previous command saw it, and why `--doc` will not either:
      # nextest runs no doc tests at all, and a SEPARATE
      # `cargo test --doc --all-features` self-heals -- cargo re-checks
      # fingerprints at the start of every invocation, notices the artifact
      # changed, and rebuilds the lib before rustdoc runs. Measured: with the
      # defect reintroduced, the separate `--doc` invocation reports 221
      # passed, and only the single `cargo test --all-features` invocation
      # fails. Splitting this step back out would restore a green CI over a
      # broken contributor command.
      #
      # Enforcement matters as much as coverage: Build & Test is a required
      # status check, and the "Doc Tests" job this replaces was not, so a red
      # doc test never blocked a merge.
      #
      # Cost, measured on run 31339797988: 61s, against 86s for the nextest
      # step above it. Cheap because nextest has already compiled every
      # dependency in this profile -- what is added is rustdoc's own pass plus
      # a second, serial run of the suite, this runner's ExifTool-backed
      # comparison tests included. Deleting the separate Doc Tests job in the
      # same change gave a whole 4x runner back, so CI does less work overall.
      #
      # If this ever becomes the long pole, shrink what it runs only with a
      # measurement in hand -- narrowing it back to `--doc` does not shrink
      # it, it deletes it.
      - run: cargo test --all-features
      # This opt-in test executes the generated reader against native Perl.
      # Keep the same feature graph as the preceding build to reuse its cache.
      - name: Compare generated word reader with pinned native processor
        env:
          EXIFTOOL_PERL: perl
        run: |
          set -euo pipefail
          export OXIDEX_PINNED_EXIFTOOL="$(dirname "$EXIFTOOL")"
          cargo test --all-features --lib \
            exiftool_tables::keyed_engine::tests::generated_word_directory_matches_native_probe_v1 \
            -- --ignored --exact --nocapture | tee "$RUNNER_TEMP/word-native-replay.log"
          # Cargo also succeeds when a mistyped exact selector runs no tests.
          grep -F 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/word-native-replay.log"
      - name: Compare generated serial tables with pinned native processor
        env:
          EXIFTOOL_PERL: perl
        run: |
          set -euo pipefail
          export OXIDEX_PINNED_EXIFTOOL="$(dirname "$EXIFTOOL")"
          cargo test --all-features --test serial_directory_native \
            -- --ignored --nocapture | tee "$RUNNER_TEMP/serial-native-replay.log"
          # Require Real Audio and both Canon autofocus replays; an empty or
          # accidentally narrowed selection must not turn this check green.
          grep -F 'test result: ok. 3 passed; 0 failed;' "$RUNNER_TEMP/serial-native-replay.log"
      - name: Verify C header is up-to-date
        run: |
          cbindgen --config cbindgen.toml --crate oxidex --output api/oxidex.h.tmp
          diff -q api/oxidex.h api/oxidex.h.tmp || (echo "C header out of date" && exit 1)
          rm api/oxidex.h.tmp

  release-build:
    name: Release Build
    # Split out of Build & Test so the three compiles run concurrently
    # instead of serially: they share no artifacts (release-side profile,
    # test profile and rustdoc are three distinct fingerprints), so running
    # them on one runner only added their times together.
    #
    # 4x, not 8x: fixloop sets codegen-units = 16 so this parallelises, but
    # it is not the long pole -- Build & Test is. Sizing it to finish just
    # inside that job is what this is worth paying for, not raw speed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # Its own cache shared-key on purpose:
      # this job compiles a different profile from Build & Test, and a
      # shared entry was measured slower (see that job's note).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: release-build
      # If you add a step here, give it `--all-features` and nothing else.
      #
      # `fixloop`, not `release`. This step exists to prove the release-side
      # codegen path still compiles and links; release.yml does the real
      # per-platform release builds on tag pushes. [profile.release] carries
      # lto = true + codegen-units = 1, which is tuned for the shipped
      # binary's runtime, not for answering that question -- it cost ~95-100s
      # of mostly LTO link time here. [profile.fixloop] already exists in
      # Cargo.toml, inherits release (so it keeps panic = "abort", the thing
      # that forces the separate test-profile compile below) and only drops
      # lto and raises codegen-units.
      #
      # The gap this accepts: an LTO-only failure would now surface at tag
      # time in release.yml rather than here.
      - run: cargo build --profile fixloop --all-features

  # Corpus read regression gate. The parity ratchet in Lint & Audit guards the
  # COMMITTED measurements, which only move when someone regenerates them, so a
  # PR that breaks a reader passes every other check and the loss surfaces at
  # the next manual refresh. This measures the merge result itself: one
  # authenticated corpus read receipt over the pinned ExifTool's t/images, then
  # tools/ci/read_regression_gate.py requires every catalog entry the published
  # snapshot marks observed_matched_read to still be credited, naming each one
  # lost. Newly credited entries are printed as information only.
  #
  # Exit 1 is a code regression; exit 2 is a refused MEASUREMENT (a public
  # read timed out under runner load, the receipt failed its integrity replay,
  # or the oracle/corpus is not the snapshot's). Re-run on 2; read the LOST
  # lines on 1.
  #
  # Not a required check, and nothing `needs:` it: it sits beside the other
  # jobs rather than in front of them. A new check name is not required until
  # an admin adds it to branch protection.
  read-regression-gate:
    name: Corpus Read Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The receipt's build command is fixed (`cargo build --release --bin
      # oxidex`), so the profile is relaxed through env instead: fat LTO with
      # one codegen unit costs ~100s of link time (see Release Build) and
      # changes no behaviour this gate reads -- it compares values, not speed.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD^1 must exist for the change detection below.
          fetch-depth: 2
      # ci.yml carries no `paths:` filter (see the note under `on:`), so the
      # gate lives in a step, as in Benchmarks. On a pull_request the checkout
      # is the merge commit, so HEAD^1..HEAD is exactly what the PR changes.
      # The list is everything that can move a public read or the measurement:
      # the runtime inputs runtime_evidence_inputs.py hashes, the pin, the
      # receipt/gate tooling, the published snapshot, and this workflow.
      - name: Check whether anything that can move a read changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A push to the tip always runs the gate: push runs share one
          # concurrency group and cancel each other, so HEAD^1..HEAD on the run
          # that survives covers only the last merge, and a reader change in a
          # cancelled run's merge would otherwise go unmeasured.
          if [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = push ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only HEAD^1 HEAD)
          if printf '%s\n' "$CHANGED" | grep -qE '^(src/|\.cargo/|oxidex-tags[^/]*/|Cargo\.(toml|lock)$|build\.rs$|\.exiftool-version$|scripts/instrument\.py$|tools/ci/read_regression_gate\.py$|tools/exiftool-tables/(corpus_read_receipt\.py|capture_corpus_sources\.pl|catalog_corpus_reads\.py|runtime_evidence_inputs\.py|native_write_matrix\.py|verify_quicktime_userdata_reader\.py|quicktime_baseline\.py)$|docs/public/measurements/catalog-(corpus-observed|source)-[0-9.]+\.json$|\.github/(workflows/ci\.yml|actions/pinned-exiftool/))'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no reader, runtime, pin or gate change; skipping the corpus read gate"
          fi
      - id: exiftool
        if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/pinned-exiftool
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: steps.changes.outputs.run == 'true'
      # Its own shared-key: this is the release profile with the env overrides
      # above, a fingerprint no other job builds.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changes.outputs.run == 'true'
        with:
          cache-on-failure: true
          shared-key: read-regression-gate
      # build + observe refuse a dirty checkout, and re-assert the pinned
      # version, the OOXML.docx -> DOCX capability probe and canonical Perl
      # v5.38.2 (ubuntu-24.04's system perl) before recording anything.
      - name: Corpus read receipt at the merge result
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          unset PERL5LIB PERLLIB PERL5OPT
          OUT="$RUNNER_TEMP/read-gate"
          python3 tools/exiftool-tables/corpus_read_receipt.py build --output "$OUT/build"
          python3 tools/exiftool-tables/corpus_read_receipt.py observe \
            --build-proof "$OUT/build/build-proof.json" \
            --perl "$(command -v perl)" \
            --exiftool-dir "$EXIFTOOL_SOURCE" \
            --corpus "$EXIFTOOL_SOURCE/t/images" \
            --output "$OUT/observe"
      - name: Every published read is still credited
        if: steps.changes.outputs.run == 'true'
        run: python3 tools/ci/read_regression_gate.py --receipt "$RUNNER_TEMP/read-gate/observe/receipt.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.changes.outputs.run == 'true'
        with:
          name: corpus-read-receipt
          path: ${{ runner.temp }}/read-gate/observe
          retention-days: 7

  # The generated ExifTool tables are 100k+ lines that no reviewer reads in a
  # diff, so their correctness rests entirely on verify.py -- which, until this
  # job existed, nothing ever ran. A hand-edit of a binary/ table file, or a
  # regeneration against a different ExifTool, passed every other check.
  #
  # This re-parses the COMMITTED Rust and diffs it against a ground-truth dump
  # taken independently from ExifTool's Perl symbol table, so it fails on a
  # fabricated or drifted entry rather than on a mismatched formatting guess.
  # verify.py reads Rust as text; verify_subdirs.py additionally builds a
  # throwaway harness to execute the committed Start/Base forms.
  # The generated ExifTool tables are checked by five jobs that fan out from
  # one native capture, then report under the single "Verify Generated
  # Tables" name below. Serially this was ~38 min on a WarpBuild 4x runner and
  # ~70 min on a standard GitHub-hosted runner (single-threaded Perl/Python,
  # so more cores on one runner did not help); fanned out, the long pole is
  # the capture plus the slowest dependent job.
  #
  # The full dump is 1.25 GB of JSON (16 MB zstd); it is captured once and
  # passed as an artifact so every dependent job checks the same bytes.
  verify-tables-capture:
    name: Verify Generated Tables / capture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: exiftool
        uses: ./.github/actions/pinned-exiftool
      # This keeps a module-complete native writer capture: CheckExif's
      # freshness ledger records every omitted source table as well as its
      # one admitted recipe, so an Exif-only capture would silently weaken
      # coverage. The three captures are independent Perl processes, so they
      # run concurrently on this runner's cores.
      - name: Capture hydrated reader graph, full dump, processor inventory and Garmin FIT protocol
        env:
          ET_VERSION: ${{ steps.exiftool.outputs.version }}
        run: |
          set -euo pipefail
          unset PERL5LIB PERLLIB PERL5OPT
          OUT="$RUNNER_TEMP/verify-tables-capture"
          mkdir -p "$OUT"
          perl tools/exiftool-tables/dump_tables.pl --reader-only --hydrated-layouts \
            "$EXIFTOOL_SOURCE/lib" > "$OUT/hydrated-reader.json" & hydrated=$!
          perl tools/exiftool-tables/dump_tables.pl "$EXIFTOOL_SOURCE/lib" > "$OUT/catalog-writer-source.json" & full=$!
          perl tools/exiftool-tables/oracle.pl "$EXIFTOOL_SOURCE/lib" > "$OUT/native-processors-${ET_VERSION}.tsv" & processors=$!
          perl tools/exiftool-tables/capture_garmin_fit_fact.pl "$EXIFTOOL_SOURCE/lib" > "$OUT/garmin-fit-protocol.json" & garmin=$!
          wait "$hydrated"; wait "$full"; wait "$processors"; wait "$garmin"
          for file in "$OUT"/*; do test -s "$file"; done
          zstd -q -T0 --rm "$OUT"/*.json
          ls -l "$OUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-tables-capture
          path: ${{ runner.temp }}/verify-tables-capture
          retention-days: 1
          compression-level: 0

  # Checks that need only the fetched ExifTool tree, not the capture.
  verify-tables-source:
    name: Verify Generated Tables / source and tier 2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: exiftool
        uses: ./.github/actions/pinned-exiftool
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - name: Verify complete source catalog snapshot
        run: |
          python3 tools/exiftool-tables/catalog_snapshot.py \
            --exiftool-dir "$EXIFTOOL_SOURCE" --perl perl \
            --output "docs/public/measurements/catalog-source-$(cat .exiftool-version).json" --check
      - name: Verify committed tables against ExifTool
        env:
          ET_VERSION: ${{ steps.exiftool.outputs.version }}
        run: |
          python3 tools/exiftool-tables/verify.py \
            src/exiftool_tables/binary/mod.rs \
            "$EXIFTOOL_SOURCE/lib" \
            --oracle tools/exiftool-tables/oracle.pl \
            --keyed-generated src/exiftool_tables/keyed_tables.rs \
            --word-processor Image::ExifTool::CanonCustom::ProcessCanonCustom \
            --native-inventory --native-inventory-table Sony:Tag202a
          # verify.py independently checks which edges should be present;
          # this runs their actual Start/Base arithmetic against the pinned
          # ProcessBinaryData Perl eval scope (ExifTool.pm:10118-10137).
          python3 tools/exiftool-tables/verify_subdirs.py \
            src/exiftool_tables/binary/mod.rs \
            "$EXIFTOOL_SOURCE/lib" \
            --exiftool "$EXIFTOOL_SOURCE/exiftool" \
            --perl "$OXIDEX_TABLES_PERL"
      # Step 14 (tag-machinery overhaul): tier 1 above is binary/ (the split
      # binary tables);
      # tier 2 is everything downstream of it that regen.sh never touches --
      # the MakerNote sub-directory tables, the Nikon AF-point grids and the
      # six scripts/gen_*.pl one-off transcriptions. Until this step existed,
      # nothing re-ran tier 2 in CI at all, so a bump could refresh tier 1 to
      # a new ExifTool release while every tier-2 file quietly stayed on the
      # old one -- intra-repo mixed-release skew invisible from either tier
      # alone (see tools/exiftool-tables/regen-all.sh's header). Re-running
      # every tier-2 generator against the SAME fetched tree as the verify
      # step above and diffing the result against what is committed is the
      # tier-2 analogue of verify.py: it fails on a stale or hand-edited
      # generated file instead of on a formatting guess.
      # regen-all also verifies complete GeoTIFF, DICOM and lens facts against
      # loaded Perl independently of their producers before the drift check.
      - name: Regenerate tier 2, verify independent facts and check drift
        env:
          ET_VERSION: ${{ steps.exiftool.outputs.version }}
        run: |
          set -euo pipefail
          export OXIDEX_EXIFTOOL_LIB="$EXIFTOOL_SOURCE/lib"
          tools/exiftool-tables/regen-all.sh --tier2-only
          if ! python3 tools/exiftool-tables/artifacts.py diff --tier 2; then
            echo "::error::a committed tier-2 generated file does not match what its generator produces against ExifTool ${ET_VERSION}. Either the file was hand-edited, or it is stale relative to the pin -- re-run 'tools/exiftool-tables/regen-all.sh --tier2-only' and commit the result." >&2
            exit 1
          fi
      # Tag-machinery overhaul Step 16 (R5 stage 1 / R9(a)): the same
      # rerun-and-diff idea as tier 2 above, applied to hand-embedded facts
      # that have no generator at all -- three sub-checks: data-diffable
      # fixtures, the coarse enum-fingerprint drift baseline for the six
      # generator-less files plus canon.rs, and the Stage 1 formula/condition
      # anchor snapshots (see `just check-staleness`'s own header for why each
      # exists; this step is that recipe's body inlined so it does not need a
      # `just` binary on this runner). Reuses the SAME extracted tree the two
      # steps above already fetched, rather than fetching ExifTool a third
      # time in this job.
      - name: Check Perl-source anchors
        run: python3 tools/exiftool-tables/check_perl_anchors.py "$EXIFTOOL_SOURCE"

  verify-tables-catalog:
    name: Verify Generated Tables / catalog join
    needs: [verify-tables-capture]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: exiftool
        uses: ./.github/actions/pinned-exiftool
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - uses: ./.github/actions/verify-tables-capture
      - name: Audit hydrated reader table graph
        run: |
          set -euo pipefail
          export EXIFTOOL_PERL=perl OXIDEX_PINNED_EXIFTOOL="$EXIFTOOL_SOURCE"
          python3 -m unittest discover -s tools/exiftool-tables -p 'test_hydrated_layout_projection.py'
          python3 -m unittest discover -s tools/exiftool-tables -p 'test_audit_hydrated_layouts.py'
          python3 tools/exiftool-tables/audit_hydrated_layouts.py \
            --dump "$RUNNER_TEMP/hydrated-reader.json" --output "$RUNNER_TEMP/hydrated-reader-audit.json" \
            --expected-audit "docs/public/measurements/hydrated-reader-layout-audit-$(cat .exiftool-version).json" \
            --catalog "docs/public/measurements/catalog-source-$(cat .exiftool-version).json"
      - name: Reconcile every catalog entry with hydrated source
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/exiftool-tables -p 'test_join_catalog_hydrated.py'
          python3 -m unittest discover -s tools/exiftool-tables -p 'test_replay_ifd_catalog_inputs.py'
          python3 -m unittest discover -s tools/exiftool-tables -p 'test_catalog_userdata.py'
          python3 -m unittest discover -s tools/exiftool-tables -p 'test_catalog_garmin_fit.py'
          # The capture job's post-load full dump binds writer declarations to
          # the pinned native closure.  The hydrated reader dump remains the
          # catalog source coordinate authority.
          # Expression proofs and IFD identity ledgers bind the entire capture,
          # including interpreter-specific envelopes. Re-prove on this runner;
          # never relabel the committed oracle as a fresh native observation.
          python3 tools/exiftool-tables/verify_exprs.py "$RUNNER_TEMP/catalog-writer-source.json" \
            --perl perl --et-lib "$EXIFTOOL_SOURCE/lib" \
            --ledger-out "$RUNNER_TEMP/catalog-expr-oracle.json"
          python3 tools/exiftool-tables/replay_ifd_catalog_inputs.py \
            --source "$RUNNER_TEMP/catalog-writer-source.json" \
            --committed-ledger tools/exiftool-tables/ifd_identity_ledger.json \
            --committed-rust src/exiftool_tables/ifd/mod.rs \
            --committed-expr-ledger tools/exiftool-tables/expr_oracle_ledger.json \
            --fresh-expr-ledger "$RUNNER_TEMP/catalog-expr-oracle.json" \
            --output "$RUNNER_TEMP/catalog-ifd-identity.json"
          python3 tools/exiftool-tables/join_catalog_hydrated.py \
            --catalog "docs/public/measurements/catalog-source-$(cat .exiftool-version).json" \
            --hydrated "$RUNNER_TEMP/hydrated-reader.json" \
            --quicktime-bounded-source "tools/exiftool-tables/fixtures/quicktime_source_13_59.json" \
            --quicktime-itemlist-ledger "tools/exiftool-tables/quicktime_generated_itemlist_ledger.json" \
            --quicktime-source-capabilities "tools/exiftool-tables/quicktime_source_capabilities.json" \
            --quicktime-itemlist-rust "src/parsers/quicktime/generated_itemlist_specs.rs" \
            --quicktime-keys-ledger "tools/exiftool-tables/quicktime_generated_keys_ledger.json" \
            --quicktime-keys-rust "src/parsers/quicktime/generated_keys_specs.rs" \
            --quicktime-userdata-ledger "tools/exiftool-tables/quicktime_generated_userdata_ledger.json" \
            --quicktime-userdata-rust "src/parsers/quicktime/generated_userdata_specs.rs" \
            --garmin-fit-source "tools/exiftool-tables/fixtures/garmin_fit_source.json" \
            --garmin-fit-ledger "tools/exiftool-tables/garmin_fit_ledger.json" \
            --garmin-fit-rust "src/exiftool_tables/fit_tables.rs" \
            --garmin-fit-protocol-fact "$RUNNER_TEMP/garmin-fit-protocol.json" \
            --ifd-source "$RUNNER_TEMP/catalog-writer-source.json" \
            --ifd-identity-ledger "$RUNNER_TEMP/catalog-ifd-identity.json" \
            --ifd-rust "src/exiftool_tables/ifd/mod.rs" \
            --ifd-expr-ledger "$RUNNER_TEMP/catalog-expr-oracle.json" \
            --writer-source "$RUNNER_TEMP/catalog-writer-source.json" \
            --writer-final-ledger "tools/exiftool-tables/tiff_scalar_final_ledger.json" \
            --writer-final-rust "src/writers/generated_tiff_scalar_final_rules.rs" \
            --writer-public-ledger "tools/exiftool-tables/setnewvalue_public_migration_ledger.json" \
            --writer-public-rust "src/writers/generated_setnewvalue_public_migration_rules.rs" \
            --output "$RUNNER_TEMP/catalog-hydrated-join.json" \
            --report "$RUNNER_TEMP/catalog-hydrated-join.md"
          python3 - "$RUNNER_TEMP/catalog-hydrated-join.json" \
            "docs/public/measurements/catalog-hydrated-join-$(cat .exiftool-version).json" <<'PYCODE'
          import json, sys
          actual, expected = [json.load(open(path)) for path in sys.argv[1:]]
          # Full dumps may differ in serialization outside these source rows.
          # Retain exact per-row/table hashes, catalog hash and all status fields.
          for document in (actual, expected):
              document['inputs'].pop('hydrated_sha256')
              # Full native captures include runner-specific capture identity;
              # compare the replayed rows/artifact digests, not that envelope.
              document['inputs'].get('writer', {}).pop('source_sha256', None)
              # The replay step already proved exact IFD Rust, complete rows,
              # classifications, counts and expression approval inventory.
              # Retain the actual bindings in each output receipt; only this
              # cross-runner comparison excludes their differing envelopes.
              for field in ('source_sha256', 'ledger_sha256', 'expr_ledger_sha256'):
                  document['inputs'].get('ifd', {}).pop(field, None)
          if actual != expected:
              raise SystemExit('catalog/source ledger drift: regenerate and review')
          print('=== instrument: catalog/source ledger semantic check ===')
          print('All catalog identities, row/table hashes and statuses match.')
          PYCODE
      - name: Validate published observed catalog receipt, when present
        run: |
          set -euo pipefail
          found=0
          for observed in "docs/public/measurements/catalog-hydrated-observed-$(cat .exiftool-version).json" \
                          "docs/public/measurements/catalog-corpus-observed-$(cat .exiftool-version).json"; do
            [[ -f "$observed" ]] || continue
            found=1
            python3 tools/exiftool-tables/catalog_observed_snapshot.py \
              --snapshot "$observed" --verify \
              --current-source-join "docs/public/measurements/catalog-hydrated-join-$(cat .exiftool-version).json"
          done
          if [[ "$found" == 0 ]]; then
            echo '=== instrument: catalog observed receipt check ==='
            echo 'No published native receipt yet; source declaration ledger remains independent.'
          fi

  # The tools suite (~1,500 unittest cases, ~40 min serially on ubuntu-latest)
  # is split into balanced shards by tools/ci/unittest_shard.py using the
  # committed per-test timings in tools/ci/unittest_weights.json. Every test
  # id lands in exactly one shard, so the shards together run the full suite.
  # Refresh the timings with `python3 tools/ci/unittest_weights_from_run.py
  # <green-run-id>`; tools/ci/test_unittest_shard.py fails once more than a
  # handful of discovered modules have none.
  verify-tables-tools:
    name: Verify Generated Tables / tools ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: [verify-tables-capture]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: exiftool
        uses: ./.github/actions/pinned-exiftool
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - uses: ./.github/actions/verify-tables-capture
      - name: Run tools suite shard
        env:
          ET_VERSION: ${{ steps.exiftool.outputs.version }}
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          ROOT="$EXIFTOOL_SOURCE"
          LIB="$ROOT/lib"
          DUMP="$RUNNER_TEMP/catalog-writer-source.json"
          PROCESSORS="$RUNNER_TEMP/native-processors-${ET_VERSION}.tsv"
          unset PERL5LIB PERLLIB PERL5OPT
          export EXIFTOOL_PERL=perl LENS_TEST_PERL=perl
          test -s "$DUMP"
          test -s "$PROCESSORS"
          test -f "$LIB/Image/ExifTool/CanonCustom.pm"
          # Supply the native inputs explicitly: without them unittest skips
          # the source-rebinding, complete-inventory and native replay cases.
          export OXIDEX_PINNED_EXIFTOOL="$ROOT"
          export OXIDEX_TABLES_JSON="$DUMP" OXIDEX_SONY_DUMP="$DUMP"
          export OXIDEX_SERIAL_RUST="$GITHUB_WORKSPACE/src/exiftool_tables/serial_tables.rs"
          # Exercise mutations of the actual generated parent/child artifacts,
          # including a downgrade that removes both processor and validation.
          export OXIDEX_IFD_SERIAL_MUTATION_TEST=1
          export OXIDEX_IFD_GENERATED="$GITHUB_WORKSPACE/src/exiftool_tables/ifd/mod.rs"
          export OXIDEX_SERIAL_GENERATED="$OXIDEX_SERIAL_RUST"
          export OXIDEX_IFD_SERIAL_ORACLE="$PROCESSORS"
          export OXIDEX_WORD_KEYED_RUST="$GITHUB_WORKSPACE/src/exiftool_tables/keyed_tables.rs"
          export OXIDEX_PROCESSOR_INVENTORY="$PROCESSORS"
          export OXIDEX_WORD_PROCESSOR=Image::ExifTool::CanonCustom::ProcessCanonCustom
          export OXIDEX_ALLOW_DIRTY_TREE=1
          cd tools/exiftool-tables
          # --of comes from the matrix itself (`strategy.job-total`), never a
          # second literal: the sharder partitions against --of while the matrix
          # decides which partitions run, so a drift between them drops tests
          # with no failure anywhere. See tools/ci/test_unittest_shard.py.
          python3 ../ci/unittest_shard.py --weights ../ci/unittest_weights.json --shard "$SHARD" --of "$SHARD_TOTAL"

  verify-tables-drift:
    name: Verify Generated Tables / staleness and drift
    needs: [verify-tables-capture]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: exiftool
        uses: ./.github/actions/pinned-exiftool
      - uses: ./.github/actions/verify-tables-capture
      # Tag-machinery overhaul Step 16 (R5 stage 1 / R9(a)): the rerun-and-diff
      # idea applied to hand-embedded facts that have no generator at all --
      # data-diffable fixtures, the coarse enum-fingerprint drift baseline for
      # the generator-less files plus canon.rs, and the serial directory
      # descriptor (see `just check-staleness`'s header for why each exists).
      - name: Check serial directory, staleness facts and drift baselines
        env:
          ET_VERSION: ${{ steps.exiftool.outputs.version }}
        run: |
          set -euo pipefail
          DUMP="$RUNNER_TEMP/catalog-writer-source.json"
          python3 tools/exiftool-tables/verify_serial_directory.py \
            "$GITHUB_WORKSPACE/src/exiftool_tables/serial_tables.rs" "$DUMP"
          TMPFIX="$RUNNER_TEMP/staleness-fixtures"
          mkdir -p "$TMPFIX"
          python3 tools/exiftool-tables/gen_staleness_facts.py "$DUMP" "$TMPFIX"
          # The IFD sample, QuickTime source/oracle snapshots and the bounded
          # Garmin FIT source (test_garmin_fit_specs.FreshSourceTests) are
          # independently checked fixtures, not outputs of gen_staleness_facts.py.
          if ! diff -ru tools/exiftool-tables/fixtures "$TMPFIX" \
              --exclude hand_enum_drift_baseline.json \
              --exclude quicktime_source_13_59.json \
              --exclude quicktime_oracle_sources_13_59.json \
              --exclude quicktime_reader_protocol_bounded_13_59.json \
              --exclude quicktime_userdata_native_13_59.json \
              --exclude garmin_fit_source.json \
              --exclude xmp_namespaces_13_59.json \
              --exclude ifd_tables_sample.rs; then
            echo "::error::committed staleness fixtures are stale relative to ExifTool ${ET_VERSION} -- re-run 'python3 tools/exiftool-tables/gen_staleness_facts.py <dump.json> tools/exiftool-tables/fixtures', update the Rust these fixtures check, and commit both." >&2
            exit 1
          fi

          python3 tools/exiftool-tables/check_hand_enum_drift.py \
            --dump "$DUMP" \
            --baseline tools/exiftool-tables/fixtures/hand_enum_drift_baseline.json \
            "src/parsers/tiff/makernotes/sony/enciphered_tables.rs=Sony" \
            "src/parsers/tiff/makernotes/sony/plain_tables.rs=Sony" \
            "src/parsers/tiff/makernotes/sony/main_extra_tables.rs=Sony" \
            "src/parsers/tiff/makernotes/nikon/encrypted_tables.rs=Nikon,NikonCustom" \
            "src/parsers/tiff/makernotes/nikon/settings_tables.rs=NikonSettings" \
            "src/parsers/tiff/makernotes/minolta_a100_tables.rs=Minolta" \
            "src/parsers/tiff/makernotes/canon.rs=Canon"


  # The single check name reported for all of the above. Not a required
  # status check today; it fails unless every fan-out job succeeded.
  verify-tables:
    name: Verify Generated Tables
    needs: [verify-tables-capture, verify-tables-source, verify-tables-catalog, verify-tables-tools, verify-tables-drift]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Verify Generated Tables job
        env:
          ALL_SUCCEEDED: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "fan-out job results: $RESULTS"
          [ "$ALL_SUCCEEDED" = true ]

  metrics:
    name: Benchmarks
    # 8x, and DELIBERATELY the same label as deploy-docs.yml's benchmark job.
    # These two publish into the same story -- this one as a 90-day artifact,
    # the other to the docs performance page -- so they must always match on
    # runner AND on how they measure. They move together or not at all.
    #
    # This job is tuned for THROUGHPUT, not for measurement fidelity. That is
    # a deliberate, explicit trade (2026-08-08, see CHANGELOG):
    #
    #  - --quick        fewer criterion samples per benchmark. deploy-docs.yml
    #                   already ran with this and ci.yml did not, so the two
    #                   were quietly publishing different methodologies; they
    #                   now match.
    #  - lto = false    [profile.bench] ships lto = "thin". Turning it off
    #                   means these numbers describe a binary NOBODY SHIPS --
    #                   [profile.release] keeps lto = true. Do not quote them
    #                   as OxiDex's real-world performance.
    #  - codegen-units  1 is pointless once LTO is off, and it serialises
    #                   codegen on a runner with eight cores.
    #
    # Consequence: numbers from before 2026-08-08 are NOT comparable with
    # numbers after it, on hardware or methodology. If any of this changes
    # again, both jobs move together, in one commit, and the discontinuity is
    # recorded in CHANGELOG.md again.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # No `needs:` on purpose. This used to wait for Build & Test, which put
    # that job's full duration in front of a job that does not consume
    # anything it produces. A broken build now shows up as a red Build & Test
    # beside a green Benchmarks, rather than as a delay.
    env:
      CARGO_PROFILE_BENCH_LTO: false
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD~1 must exist for the change detection below.
          fetch-depth: 2
      # ci.yml deliberately carries no `paths:` filter -- Lint & Audit and
      # Build & Test are required checks and a filtered-out required check
      # never reports at all. So the gate lives here, in the one job that
      # neither gates merges nor is worth 130s on a merge that cannot have
      # moved a benchmark.
      #
      # deploy-docs.yml's publish tolerates a skipped run: it walks back
      # through recent successful ci.yml runs for one that actually carries a
      # benchmark-results artifact, and stamps the commit those numbers came
      # from.
      - name: Check whether anything benchmarkable changed
        id: changes
        run: |
          set -euo pipefail
          if git diff --name-only HEAD~1 HEAD | grep -qE '^benches/|^src/|^Cargo\.(toml|lock)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no benches/, src/ or manifest change; skipping benchmarks"
          fi
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: steps.changes.outputs.run == 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changes.outputs.run == 'true'
        with:
          cache-on-failure: true
          shared-key: metrics
      - name: Run benchmarks
        if: steps.changes.outputs.run == 'true'
        run: cargo bench --bench integration_benchmarks --bench parse_benchmarks -- --quick
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.changes.outputs.run == 'true'
        with:
          name: benchmark-results
          path: target/criterion/
          retention-days: 90
