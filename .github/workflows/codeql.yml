name: CodeQL

# Rust (the project's primary language) has no CodeQL query support, so this
# workflow only analyzes the Python tooling under scripts/ and bindings/python/.
# See CLAUDE.md: OxiDex is a Rust implementation of ExifTool with a secondary
# Python surface (build/analysis scripts + FFI bindings).

on:
  push:
    branches: ['**']
    paths:
      - 'scripts/**.py'
      - 'bindings/python/**.py'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'scripts/**.py'
      - 'bindings/python/**.py'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '17 3 * * 1'

jobs:
  analyze:
    name: Analyze (python)
    # 2x: the analysed source is only the Python under scripts/ and
    # bindings/python/ (Rust has no CodeQL support). Measured over 6 runs
    # (2026-08-03..08-08) the actual CodeQL compute on 2 threads is ~55-63s
    # (extract ~15s, run-queries ~21s, finalize ~8s, interpret+upload ~8s);
    # the rest of the job was bundle download, addressed by the cache below.
    # A larger runner could only shave part of that ~60s at 2x the $/min —
    # not cost-positive. Matches the 2 vCPU this ran on before.
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Warp runners do not pre-bake CodeQL into /opt/hostedtoolcache (GitHub-
      # hosted runners do), so init streamed the 578MB bundle from GitHub's
      # release CDN on every run: 13-61s, mean ~37s, across the 6 runs measured
      # 2026-08-03..08-08. Restoring the extracted toolcache from WarpBuild's
      # in-DC cache replaces that download and clips the 47-61s tail (3 of
      # those 6 runs).
      #
      # Scan-safety: the toolcache is version-addressed (CodeQL/<version>/x64
      # plus a <version>/x64.complete marker) and init looks up the exact
      # version it resolved, falling back to the normal download on a miss —
      # a stale or absent cache entry can never change what is scanned, only
      # how long setup takes. That version-addressing is also what makes a
      # prefix restore-key safe here (cf. the restore-keys rule in ci.yml).
      #
      # The bundle version is NOT pinned by this file or by the codeql-action
      # SHA: GitHub's backend advertises a recommended version server-side
      # (the pinned SHA's defaults.json says 2.25.5, yet these runs resolved
      # 2.26.2). The primary key below never matches an entry (saves always
      # append the version), so the newest prefix match is restored, and the
      # save step re-keys on the version init actually resolved — a
      # server-side bump heals itself in one run without editing this file.
      - name: Restore CodeQL bundle toolcache
        id: codeql-toolcache
        uses: WarpBuilds/cache/restore@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: /opt/hostedtoolcache/CodeQL
          key: codeql-toolcache-linux-x64-
          restore-keys: |
            codeql-toolcache-linux-x64-

      - uses: github/codeql-action/init@21eb7f7842f33eafc83782b56fff2a2c43e9696f # v4.37.1
        id: codeql-init
        with:
          languages: python
          source-root: .

      # Save immediately after init, not in a post step: init is what
      # populates the toolcache, and a later analyze/upload failure must not
      # discard the entry (the combined WarpBuilds/cache action saves under
      # post-if: success(), which would). Saves only when the restored entry
      # did not already contain the resolved version, and saves just that
      # version's subtree so entries never accumulate superseded bundles
      # across server-side version bumps. continue-on-error because a failed
      # save merely costs the next run a download — it must never fail a
      # security scan.
      - name: Save CodeQL bundle toolcache
        if: ${{ steps.codeql-toolcache.outputs.cache-matched-key != format('codeql-toolcache-linux-x64-{0}', steps.codeql-init.outputs.codeql-version) }}
        continue-on-error: true
        uses: WarpBuilds/cache/save@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: /opt/hostedtoolcache/CodeQL/${{ steps.codeql-init.outputs.codeql-version }}
          key: codeql-toolcache-linux-x64-${{ steps.codeql-init.outputs.codeql-version }}

      - uses: github/codeql-action/analyze@21eb7f7842f33eafc83782b56fff2a2c43e9696f # v4.37.1
        with:
          category: '/language:python'
