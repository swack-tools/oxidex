name: Docs Build

# Builds the VitePress site exactly the way a contributor does on a fresh clone:
# a clean checkout, no generated artifacts, and no `just compare-exiftool-full-update`.
#
# deploy-docs.yml cannot catch a cold-build break, because it regenerates
# docs/reference/comparison/ before it builds and only runs on push to main.
# ci.yml cannot catch it either: it carries `paths-ignore: docs/**`. So until this
# workflow existed, no PR ever built the docs and a broken build looked exactly
# like a healthy one.
# Deliberately NOT on push to main. That trigger had no path filter, so every
# main push rebuilt the site here while deploy-docs.yml built AND deployed the
# same site from the same commit -- the docs were built twice per merge.
#
# Nothing is lost by dropping it: the cold-build break this exists to catch is
# a property of the commit, and the pull request that introduced it already ran
# this job. Re-running it after the merge re-tests a question already answered.
on:
  pull_request:
    branches: ['**']
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-build:
    name: Build docs from a clean checkout (${{ matrix.channel }})
    # 2x: npm ci plus a VitePress build, ~1 minute end to end and mostly I/O
    # and single-threaded bundling. No Rust is compiled here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same sources build two sites (see DOCS_CHANNEL in
    # docs/.vitepress/config.mts): stable at '/', the live oxidex.net, and the
    # development preview under a sub-path. Only the stable one is ever built on
    # a PR otherwise, and a root-absolute link that ignores the base is correct
    # at '/' -- so a base break would ship silently and surface only as 404s on
    # the preview. The preview leg builds at the preview's real base and fails
    # on any link that escapes it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            base: /
          - channel: preview
            base: /oxidex-next/
    env:
      DOCS_CHANNEL: ${{ matrix.channel }}
      DOCS_BASE: ${{ matrix.base }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The whole point of this job is that the generated report is absent. If a
      # future change ever commits it or generates it earlier, this job would
      # quietly stop testing the cold path, so fail loudly instead.
      - name: Assert the generated comparison report is absent
        run: |
          if [ -e docs/reference/comparison/index.md ]; then
            echo "::error::docs/reference/comparison/index.md exists in a clean checkout." \
                 "This job must build WITHOUT the generated report so it reproduces a fresh clone."
            exit 1
          fi
          echo "Confirmed: docs/reference/comparison/ has no generated report (cold-clone conditions)."

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs

      - name: Build VitePress site
        run: npm run docs:build
        working-directory: docs

      - name: Verify the site actually rendered
        run: |
          test -f docs/.vitepress/dist/index.html \
            || { echo "::error::VitePress produced no index.html"; exit 1; }
          test -f docs/.vitepress/dist/reference/comparison/index.html \
            || { echo "::error::The comparison placeholder page was not rendered"; exit 1; }
          echo "Cold docs build succeeded."

      # Proves the channel switch actually took: the preview must carry the
      # banner and the stable build must not. A config refactor that drops the
      # env wiring would otherwise build two identical, green, stable sites.
      - name: Verify the channel rendered
        run: |
          if [ "$DOCS_CHANNEL" = preview ]; then
            grep -q '<div class="oxidex-preview-banner" role="note">' docs/.vitepress/dist/index.html \
              || { echo "::error::preview build has no preview banner"; exit 1; }
            grep -Fq "href=\"https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}\"" docs/.vitepress/dist/index.html \
              || { echo "::error::preview banner does not link its source commit"; exit 1; }
          elif grep -rq 'oxidex-preview-banner' docs/.vitepress/dist; then
            echo "::error::stable build carries the preview banner"; exit 1
          fi
          echo "Channel '$DOCS_CHANNEL' rendered as expected."

      # Every same-origin href/src must stay inside DOCS_BASE. Missing targets
      # that are equally broken on both channels are warnings (see the script).
      - name: Check no link escapes the base
        run: npm run docs:check-links
        working-directory: docs
