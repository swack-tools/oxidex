name: Runner benchmark

# Throwaway benchmark for choosing the IONOS node type for ci.yml's runners.
# Runs synthetic CPU, memory and disk tests and ci.yml's heaviest phases,
# cold, three times on each runner, then compares the medians in the run
# summary:
#   github-hosted          ubuntu-latest, 4 vCPU / 16 GB (free for this repo)
#   ionos-bench-vcpu       IONOS shared-vCPU node, 8 cores / 16 GB / SSD 100 GB
#   ionos-bench-dedicated  IONOS dedicated-core AMD EPYC node, same size
# Each IONOS scale set holds one whole-node pod at a time (maxRunners 1), so
# its three runs are sequential and never share the node. price_per_hour is
# the node's IONOS list price (cores + RAM + SSD), for the cost table.
#
# Lives only on bench/runner-comparison, branched from refactor/tag-machinery;
# delete the branch when done. Push-triggered on that branch alone, so only
# people with write access can put jobs on the IONOS runners.
on:
  push:
    branches: [bench/runner-comparison]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Same as Build & Test.
  CARGO_PROFILE_TEST_CODEGEN_UNITS: 16
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  bench:
    name: ${{ matrix.runner.name }} run ${{ matrix.run }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - name: github-hosted
            labels: '"ubuntu-latest"'
            price_per_hour: 'null'
          - name: ionos-bench-vcpu
            labels: '"ionos-bench-vcpu"'
            # 8 x 0.013 vCPU + 16 GB x 0.0022 + 100 GB SSD x 0.08 / 720 h
            price_per_hour: '0.1502'
          - name: ionos-bench-dedicated
            labels: '"ionos-bench-dedicated"'
            # 8 x 0.054 core (Turin) + 16 GB x 0.0071 + 100 GB SSD x 0.08 / 720 h
            price_per_hour: '0.5567'
        run: [1, 2, 3]
    runs-on: ${{ fromJSON(matrix.runner.labels) }}
    # Cold builds, and the IONOS runs queue behind each other.
    timeout-minutes: 120
    env:
      RESULTS: results/${{ matrix.runner.name }}-${{ matrix.run }}.json
      PHASES: phases.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Untimed setup, identical on both runners.
      - name: Install system packages
        run: |
          # Every runner runs jobs as `runner`; the root check is kept for other runners.
          SUDO=; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          $SUDO apt-get update -qq
          # sysbench and fio for the synthetic tests. libssl-dev (openssl-sys)
          # and Archive::Zip (ExifTool) are already in the IONOS image.
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            sysbench fio libssl-dev pkg-config libarchive-zip-perl >/dev/null
      - name: Install pinned Rust toolchain
        run: |
          # The IONOS image already carries rustup and the pinned toolchain.
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal -c rustfmt -c clippy
          cargo --version
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-nextest
      - name: Install pinned ExifTool
        run: |
          # Same source and location as Build & Test.
          V=$(tr -d '[:space:]' < .exiftool-version)
          curl -sSL "https://github.com/exiftool/exiftool/archive/refs/tags/$V.tar.gz" \
            -o /tmp/exiftool.tar.gz
          rm -rf /tmp/exiftool-src && mkdir -p /tmp/exiftool-src
          tar xzf /tmp/exiftool.tar.gz -C /tmp/exiftool-src --strip-components=1
          perl -MArchive::Zip -e 1
          [ "$(/tmp/exiftool-src/exiftool -ver)" = "$V" ]
          echo "/tmp/exiftool-src" >> "$GITHUB_PATH"
          echo "EXIFTOOL=/tmp/exiftool-src/exiftool" >> "$GITHUB_ENV"
      - name: Download crates
        run: cargo fetch --locked

      # Synthetic tests first, while the machine is otherwise idle.
      - name: Synthetic CPU, memory and disk
        run: bash .github/runner-bench/synthetic.sh "${{ matrix.runner.name }}" "${{ matrix.run }}" "$RESULTS"

      - name: Start memory sampler
        run: |
          # Highest memory use of this job's cgroup across the phases, page
          # cache included. On IONOS that cgroup is the whole runner pod.
          cg=/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup | head -1)
          echo 0 > "$RUNNER_TEMP/mem-peak"
          # $0 and $1 belong to the inner bash, hence the single quotes.
          # shellcheck disable=SC2016
          nohup bash -c 'while sleep 1; do
            c=$(cat "$0/memory.current" 2>/dev/null || echo 0)
            if [ "$c" -gt "$(cat "$1")" ]; then echo "$c" > "$1"; fi
          done' "$cg" "$RUNNER_TEMP/mem-peak" >/dev/null 2>&1 &

      # Timed phases: ci.yml's heaviest work, cold (no rust-cache), in CI
      # order. --no-fail-fast keeps the work identical if a test fails on one
      # runner; phase.sh records failures for the summary.
      - name: "Phase: nextest (Build & Test)"
        run: bash .github/runner-bench/phase.sh nextest cargo nextest run --all-features --no-fail-fast
      - name: "Phase: cargo test (Build & Test)"
        run: bash .github/runner-bench/phase.sh cargo_test cargo test --all-features --no-fail-fast
      - name: "Phase: clippy (Lint & Audit)"
        run: bash .github/runner-bench/phase.sh clippy cargo clippy --all-features -- -D warnings
      - name: "Phase: fixloop build (Release Build)"
        run: bash .github/runner-bench/phase.sh fixloop_build cargo build --profile fixloop --all-features

      - name: Collect results
        if: always()
        run: |
          mkdir -p results
          [ -f "$RESULTS" ] || echo '{}' > "$RESULTS"
          [ -f "$PHASES" ] || echo '{}' > "$PHASES"
          jq --arg runner "${{ matrix.runner.name }}" --argjson run "${{ matrix.run }}" \
            --argjson price "${{ matrix.runner.price_per_hour }}" \
            --slurpfile phases "$PHASES" \
            --arg peak "$(cat "$RUNNER_TEMP/mem-peak" 2>/dev/null || echo 0)" \
            '.runner = $runner | .run = $run | .price_per_hour = $price | .phases = $phases[0]
             | .phases_peak_mem_gib = (($peak | tonumber? // 0)
                 | if . > 0 then . / 1073741824 else null end)' \
            "$RESULTS" > "$RESULTS.tmp"
          mv "$RESULTS.tmp" "$RESULTS"
          cat "$RESULTS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-${{ matrix.runner.name }}-${{ matrix.run }}
          path: results/

  summary:
    needs: bench
    # Summarize whatever finished, so one failed run doesn't hide the rest.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bench-*
          path: results
          merge-multiple: true
      - run: python3 .github/runner-bench/summarize.py results | tee -a "$GITHUB_STEP_SUMMARY"
