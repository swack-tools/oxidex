name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gates every other job. Refuses a tag that disagrees with the crate version
  # in Cargo.toml, and classifies the tag: a SemVer pre-release (any '-' suffix,
  # e.g. v2.0.0-beta.1) publishes as a GitHub pre-release that is never marked
  # Latest and does not touch the stable docs site. tools/ci/release_version.py
  # holds the logic; tools/ci/test_release_workflow.py pins the wiring below.
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.classify.outputs.version }}
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Classify tag
        id: classify
        run: python3 tools/ci/release_version.py --tag "$GITHUB_REF_NAME" --cargo-toml Cargo.toml

      - name: Require tag commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "refusing: tag commit is not reachable from origin/main" >&2
            exit 1
          fi

  build-linux:
    name: Build Linux (${{ matrix.target }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 - native build on x64. 8x: a from-scratch
          # `cargo build --release` with no warm cache, which parallelises
          # across codegen units.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Linux ARM64 - native build on arm64. Left at 2x: unchanged by this
          # migration, and now the long pole of the release. Worth revisiting
          # separately against measured arm64 build times.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      # `key` carries the target triple: both matrix legs share a job id, so
      # without it the x64 and arm64 caches would collide on one key.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: release
          key: ${{ matrix.target }}

      - name: Install musl tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools musl-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/oxidex

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Copy binary to artifacts
        run: |
          cp target/${{ matrix.target }}/release/oxidex artifacts/oxidex-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxidex-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/oxidex-${{ matrix.target }}
          retention-days: 1

  build-windows:
    name: Build Windows (x86_64)
    needs: verify-version
    # 8x: same profile as the Linux x64 build -- a cold cross-compile of the
    # whole workspace via mingw.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: release-windows

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mingw-w64 gcc

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-gnu
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Copy binary to artifacts
        run: |
          cp target/x86_64-pc-windows-gnu/release/oxidex.exe artifacts/oxidex-x86_64-pc-windows-gnu.exe

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxidex-x86_64-pc-windows-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/oxidex-x86_64-pc-windows-gnu.exe
          retention-days: 1

  build-macos:
    name: Build and Sign macOS (universal)
    needs: verify-version
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Install dependencies
        run: |
          brew install just create-dmg

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: release-macos

      # Compile all repository-controlled code before importing any signing
      # material. Cargo build scripts must never inherit access to the key.
      - name: Build universal release binary
        run: |
          SYSROOT=$(rustc +1.97.1 --print sysroot)
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            rustup target list --installed --toolchain 1.97.1 | grep -Fx "$target"
            test -d "$SYSROOT/lib/rustlib/$target/lib"
          done
          cargo +1.97.1 build --release --target aarch64-apple-darwin
          cargo +1.97.1 build --release --target x86_64-apple-darwin
          mkdir -p artifacts
          APP_PATH="artifacts/oxidex-universal-apple-darwin"
          lipo -create -output "$APP_PATH" \
            target/aarch64-apple-darwin/release/oxidex \
            target/x86_64-apple-darwin/release/oxidex
          ARCHS=$(lipo -archs "$APP_PATH")
          NORMALIZED_ARCHS=$(printf '%s\n' "$ARCHS" | awk '{ for (i = 1; i <= NF; i++) print $i }' \
            | LC_ALL=C sort | paste -sd ' ' -)
          test "$NORMALIZED_ARCHS" = "arm64 x86_64"

      - name: Import signing certificate and sign binary
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          : "${BUILD_CERTIFICATE_BASE64:?missing BUILD_CERTIFICATE_BASE64}"
          : "${P12_PASSWORD:?missing P12_PASSWORD}"
          : "${KEYCHAIN_PASSWORD:?missing KEYCHAIN_PASSWORD}"
          : "${DEVELOPMENT_TEAM:?missing DEVELOPMENT_TEAM}"
          APP_PATH="artifacts/oxidex-universal-apple-darwin"
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          cleanup_signing_material() {
            status=$?
            rm -f -- "$CERTIFICATE_PATH"
            if [ -e "$KEYCHAIN_PATH" ]; then
              security delete-keychain "$KEYCHAIN_PATH" || status=1
            fi
            exit "$status"
          }
          trap cleanup_signing_material EXIT

          umask 077
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 300 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -x -T /usr/bin/codesign \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY_LINES=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -F 'Developer ID Application:' \
            | grep -F "($DEVELOPMENT_TEAM)" \
            | sed -n 's/^[[:space:]]*[0-9]*) \([0-9A-F]*\) "Developer ID Application:.*"$/\1/p')
          IDENTITY_COUNT=$(printf '%s\n' "$IDENTITY_LINES" | sed '/^$/d' | wc -l | tr -d '[:space:]')
          if [ "$IDENTITY_COUNT" -ne 1 ]; then
            echo "refusing: expected exactly one Developer ID Application identity" >&2
            exit 1
          fi
          IDENTITY="$IDENTITY_LINES"

          codesign --sign "$IDENTITY" \
            --timestamp \
            --options runtime \
            --verbose \
            --keychain "$KEYCHAIN_PATH" \
            "$APP_PATH"
          codesign --verify --strict --verbose=4 "$APP_PATH"
          SIGNATURE_DETAILS=$(codesign --display --verbose=4 "$APP_PATH" 2>&1)
          printf '%s\n' "$SIGNATURE_DETAILS"
          printf '%s\n' "$SIGNATURE_DETAILS" | grep -Fx "TeamIdentifier=$DEVELOPMENT_TEAM"
          printf '%s\n' "$SIGNATURE_DETAILS" | grep -F 'Runtime Version='
          printf '%s\n' "$SIGNATURE_DETAILS" | grep -F 'Timestamp='
          codesign -d --entitlements :- "$APP_PATH" > entitlements.plist 2>/dev/null || true
          test ! -s entitlements.plist

      - name: Create DMG
        run: |
          just create-dmg v${{ steps.version.outputs.version }} artifacts/oxidex-universal-apple-darwin

      - name: Notarize DMG
        env:
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          DMG_PATH="dist/oxidex-v${{ steps.version.outputs.version }}.dmg"
          : "${NOTARIZATION_APPLE_ID:?missing NOTARIZATION_APPLE_ID}"
          : "${NOTARIZATION_PASSWORD:?missing NOTARIZATION_PASSWORD}"
          : "${NOTARIZATION_TEAM_ID:?missing NOTARIZATION_TEAM_ID}"

          echo "Submitting DMG for notarization..."
          SUBMISSION_OUTPUT=$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$NOTARIZATION_APPLE_ID" \
            --password "$NOTARIZATION_PASSWORD" \
            --team-id "$NOTARIZATION_TEAM_ID" \
            --wait 2>&1)

          SUBMISSION_ID=$(printf '%s\n' "$SUBMISSION_OUTPUT" \
            | awk '!found && /^[[:space:]]+id:/ { print $2; found=1 }' \
            | tr -d '[:space:]')
          if [ -z "$SUBMISSION_ID" ]; then
            echo "refusing: notarization returned no submission id" >&2
            exit 1
          fi

          if echo "$SUBMISSION_OUTPUT" | grep -q "status: Accepted"; then
            echo "✓ Notarization accepted"
          else
            xcrun notarytool log "$SUBMISSION_ID" notarization-log.json \
              --apple-id "$NOTARIZATION_APPLE_ID" \
              --password "$NOTARIZATION_PASSWORD" \
              --team-id "$NOTARIZATION_TEAM_ID"

            exit 1
          fi

          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "$DMG_PATH"

          echo "Verifying DMG notarization..."
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Copy signed binary and notarized DMG to artifacts
        run: |
          cp dist/oxidex-v${{ steps.version.outputs.version }}.dmg artifacts/

      - name: Upload signed binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxidex-universal-apple-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/oxidex-universal-apple-darwin
          retention-days: 1

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxidex-dmg-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/oxidex-v${{ steps.version.outputs.version }}.dmg
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: [verify-version, build-linux, build-windows, build-macos]
    # 2x: downloads artifacts, copies files and calls the releases API.
    # Nothing is compiled here.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      release-id: ${{ steps.create-draft.outputs.release_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: oxidex-*-${{ github.run_id }}-${{ github.run_attempt }}
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display artifact structure
        run: ls -R artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Linux x64 (musl static binary)
          cp artifacts/oxidex-x86_64-unknown-linux-musl-${{ github.run_id }}-${{ github.run_attempt }}/oxidex-x86_64-unknown-linux-musl release-assets/
          # Linux ARM64 (musl static binary)
          cp artifacts/oxidex-aarch64-unknown-linux-musl-${{ github.run_id }}-${{ github.run_attempt }}/oxidex-aarch64-unknown-linux-musl release-assets/
          # Windows x64
          cp artifacts/oxidex-x86_64-pc-windows-gnu-${{ github.run_id }}-${{ github.run_attempt }}/oxidex-x86_64-pc-windows-gnu.exe release-assets/
          # macOS signed universal binary (aarch64 and x86_64)
          cp artifacts/oxidex-universal-apple-darwin-${{ github.run_id }}-${{ github.run_attempt }}/oxidex-universal-apple-darwin release-assets/
          # macOS DMG (signed and notarized)
          find artifacts/oxidex-dmg-${{ github.run_id }}-${{ github.run_attempt }} -maxdepth 1 -type f -name '*.dmg' -exec cp {} release-assets/ \;

      - name: Create independent release provenance
        run: |
          python3 tools/ci/release_assets.py create-provenance \
            --assets release-assets \
            --provenance release-provenance \
            --version "${{ needs.verify-version.outputs.version }}" \
            --tag "$GITHUB_REF_NAME" \
            --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-root "$GITHUB_WORKSPACE"

      # This Actions artifact is immutable run evidence and is deliberately
      # uploaded before the independently mutable GitHub Release assets.
      - name: Upload independent release provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-provenance
          if-no-files-found: error
          retention-days: 90

      - name: Extract version and create release notes
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          cat > release-notes.md << 'EOF'
          ## OxiDex v$VERSION

          ### Release Artifacts

          **Linux:**
          - `oxidex-x86_64-unknown-linux-musl` - Linux x86_64 (musl, static binary)
          - `oxidex-aarch64-unknown-linux-musl` - Linux ARM64 (musl, static binary)

          **Windows:**
          - `oxidex-x86_64-pc-windows-gnu.exe` - Windows x86_64

          **macOS:**
          - `oxidex-universal-apple-darwin` - Signed universal macOS binary (Apple Silicon and Intel)
          - `oxidex-v$VERSION.dmg` - Notarized and stapled macOS DMG containing the signed executable
          - `oxidex-v$VERSION.sbom.cdx.json` - Deterministic CycloneDX SBOM for the release source and payloads
          - `SHA256SUMS` - SHA-256 checksums for every release asset

          ### Installation

          **Linux/macOS:**
          ```bash
          # Download the appropriate binary
          chmod +x oxidex-*
          sudo mv oxidex-* /usr/local/bin/oxidex
          ```

          **Windows:**
          Download and run `oxidex-x86_64-pc-windows-gnu.exe`

          **macOS DMG:**
          1. Download and open the DMG file
          2. Drag OxiDex to Applications or desired location
          3. The executable is Developer ID signed; the DMG is notarized and stapled by Apple

          ### Note
          The macOS executable is signed with a Developer ID certificate. The DMG containing it is notarized and stapled by Apple for secure installation.
          EOF

          # Replace $VERSION in the file with actual version
          sed -i "s/\$VERSION/$VERSION/g" release-notes.md

      # A failed run may leave a draft. Inspect it manually; do not delete,
      # reuse, or overwrite it. Resolve the incident and obtain authorization
      # for a new immutable tag. A rerun intentionally fails at this POST.
      - name: Create fail-closed draft release
        id: create-draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.verify-version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then MAKE_LATEST=false; else MAKE_LATEST=true; fi
          RELEASE_BODY=$(cat release-notes.md)
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            --raw-field "tag_name=$GITHUB_REF_NAME" \
            --raw-field "target_commitish=$GITHUB_SHA" \
            --raw-field "name=Release v${{ steps.version.outputs.version }}" \
            --raw-field "body=$RELEASE_BODY" \
            --field draft=true \
            --field "prerelease=$PRERELEASE" \
            --raw-field "make_latest=$MAKE_LATEST" > created-release.json
          RELEASE_ID=$(python3 -c 'import json; print(json.load(open("created-release.json"))["id"])')
          test -n "$RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload exact release assets without replacement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY"

      - name: Bind draft to exact release ID and asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.create-draft.outputs.release_id }}
        run: |
          RESOLVED_TARGET=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > draft-release.json
          python3 tools/ci/release_assets.py verify-release \
            --release-json draft-release.json --release-id "$RELEASE_ID" \
            --version "${{ needs.verify-version.outputs.version }}" \
            --tag "$GITHUB_REF_NAME" --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --draft true --prerelease "${{ needs.verify-version.outputs.prerelease }}" \
            --resolved-target "$RESOLVED_TARGET"

  verify-release-assets:
    name: Verify downloaded release assets
    needs: [verify-version, create-release]
    runs-on: macos-15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact-run independent provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-provenance
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir downloaded-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir downloaded-assets

      - name: Verify exact-run provenance and exact draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          python3 tools/ci/release_assets.py verify-assets \
            --assets downloaded-assets --provenance release-provenance \
            --version "${{ needs.verify-version.outputs.version }}" \
            --tag "$GITHUB_REF_NAME" --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-root "$GITHUB_WORKSPACE"
          RESOLVED_TARGET=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > draft-release.json
          python3 tools/ci/release_assets.py verify-release \
            --release-json draft-release.json --release-id "$RELEASE_ID" \
            --version "${{ needs.verify-version.outputs.version }}" \
            --tag "$GITHUB_REF_NAME" --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --draft true --prerelease "${{ needs.verify-version.outputs.prerelease }}" \
            --resolved-target "$RESOLVED_TARGET"

      - name: Verify downloaded macOS release behavior
        env:
          ASSET_DIR: downloaded-assets
          VERSION: ${{ needs.verify-version.outputs.version }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: bash tools/ci/verify_macos_release.sh

  publish-release:
    name: Publish verified GitHub Release
    needs: [verify-version, create-release, verify-release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact-run independent provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-provenance
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact draft release assets again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir downloaded-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir downloaded-assets

      - name: Reverify and publish exact release ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          python3 tools/ci/release_assets.py verify-assets \
            --assets downloaded-assets --provenance release-provenance \
            --version "${{ needs.verify-version.outputs.version }}" \
            --tag "$GITHUB_REF_NAME" --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-root "$GITHUB_WORKSPACE"
          RESOLVED_TARGET=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > draft-release.json
          python3 tools/ci/release_assets.py verify-release \
            --release-json draft-release.json --release-id "$RELEASE_ID" \
            --version "${{ needs.verify-version.outputs.version }}" \
            --tag "$GITHUB_REF_NAME" --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --draft true --prerelease "${{ needs.verify-version.outputs.prerelease }}" \
            --resolved-target "$RESOLVED_TARGET"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --field draft=false > published-release.json

      - name: Poll Latest release projection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.verify-version.outputs.prerelease }}
        run: |
          LATEST_MAX_ATTEMPTS="${LATEST_MAX_ATTEMPTS:-12}"
          LATEST_POLL_DELAY="${LATEST_POLL_DELAY:-5}"
          LATEST_JSON=latest-release.json
          LATEST_HISTORY=latest-release-attempts.jsonl
          : > "$LATEST_HISTORY"
          valid=0
          all_404=1

          for attempt in $(seq 1 "$LATEST_MAX_ATTEMPTS"); do
            response_path="latest-release-response-${attempt}.json"
            error_path="latest-release-response-${attempt}.stderr"
            if gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
                --include \
                > "$response_path" 2> "$error_path"; then
              gh_status=0
            else
              gh_status=$?
            fi

            http_status=$(python3 - "$response_path" <<'PY'
          import re
          import sys

          raw = open(sys.argv[1], "rb").read()
          match = re.match(rb"HTTP/[0-9.]+\s+([0-9]{3})(?:\s|$)", raw)
          if match is None:
              raise SystemExit("GitHub API response did not contain an HTTP status line")
          print(match.group(1).decode())
          PY
            ) || {
              cat "$error_path" >&2
              exit "${gh_status:-1}"
            }

            case "$http_status" in
              200|404)
                if [ "$http_status" -ne 404 ]; then
                  all_404=0
                fi
                receipt=$(python3 - "$response_path" "$LATEST_JSON" "$attempt" "$http_status" <<'PY'
          import json
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_bytes()
          separator = b"\r\n\r\n" if b"\r\n\r\n" in raw else b"\n\n"
          body = raw.split(separator, 1)[1]
          status = int(sys.argv[4])
          try:
              response = json.loads(body)
          except json.JSONDecodeError:
              response = {"raw": body.decode("utf-8", errors="replace").strip()}
          if status == 200:
              Path(sys.argv[2]).write_bytes(body)
          else:
              Path(sys.argv[2]).write_text('{"status":404}\n')
          print(json.dumps({
              "attempt": int(sys.argv[3]), "status": status, "response": response,
          }, separators=(",", ":")))
          PY
                )
                printf '%s\n' "$receipt" >> "$LATEST_HISTORY"
                ;;
              *)
                cat "$error_path" >&2
                exit "${gh_status:-1}"
                ;;
            esac

            if python3 - "$LATEST_JSON" "$GITHUB_REF_NAME" "$PRERELEASE" "$attempt" "$LATEST_MAX_ATTEMPTS" "$all_404" <<'PY'
          import json
          import sys

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON object key: {key!r}")
                  result[key] = value
              return result

          latest = json.load(open(sys.argv[1]), object_pairs_hook=reject_duplicate_keys)
          tag = sys.argv[2]
          prerelease = sys.argv[3] == "true"
          attempt = int(sys.argv[4])
          max_attempts = int(sys.argv[5])
          all_404 = sys.argv[6] == "1"
          if latest.get("status") == 404:
              ok = prerelease and attempt == max_attempts and all_404
          elif prerelease:
              ok = (latest.get("tag_name") != tag and
                    latest.get("draft") is False and
                    latest.get("prerelease") is False)
          else:
              ok = (latest.get("tag_name") == tag and
                    latest.get("draft") is False and
                    latest.get("prerelease") is False)
          raise SystemExit(0 if ok else 1)
          PY
            then
              valid=1
              break
            fi

            if [ "$attempt" -lt "$LATEST_MAX_ATTEMPTS" ]; then
              sleep "$LATEST_POLL_DELAY"
            fi
          done

          if [ "$valid" -ne 1 ]; then
            echo "refusing: GitHub Latest did not converge within $LATEST_MAX_ATTEMPTS attempts" >&2
            exit 1
          fi

      - name: Upload Latest API polling receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-latest-poll-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            latest-release-attempts.jsonl
            latest-release-response-*.json
            latest-release-response-*.stderr
          if-no-files-found: error
          retention-days: 90

      - name: Verify published release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          PRERELEASE: ${{ needs.verify-version.outputs.prerelease }}
        run: |
          RESOLVED_TARGET=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          python3 tools/ci/release_assets.py verify-release \
            --release-json published-release.json --release-id "$RELEASE_ID" \
            --version "${{ needs.verify-version.outputs.version }}" \
            --tag "$GITHUB_REF_NAME" --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --draft false --prerelease "$PRERELEASE" \
            --resolved-target "$RESOLVED_TARGET" \
            --latest-json latest-release.json

  update-docs:
    name: Update GitHub Pages
    needs: [verify-version, publish-release]
    # Stable releases only. A pre-release must not relabel the stable docs
    # site's version dropdown, and the dropdown's sed pattern below
    # (v[0-9.]*) cannot match a pre-release label, so once written a beta
    # label would silently survive every later stable release.
    if: needs.verify-version.outputs.prerelease != 'true'
    # 2x: git operations, awk and sed against the gh-pages branch.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Fetch main branch changelog
        run: |
          git fetch origin main
          git show origin/main:CHANGELOG.md > main-changelog.md

      - name: Update gh-pages changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract the section for this version from main branch changelog
          # Look for the version heading and extract until the next version heading or end
          awk -v ver="$VERSION" '
            /^## \['"$VERSION"'\]/ { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' main-changelog.md > version-entry.md

          # Check if we found the version entry
          if [ ! -s version-entry.md ]; then
            echo "Warning: No entry found for version $VERSION in main changelog"
            echo "Creating a basic entry..."
            cat > version-entry.md << EOF
          ## [$VERSION] - $(date +%Y-%m-%d)

          See [GitHub Release](https://github.com/swack-tools/oxidex/releases/tag/v$VERSION) for details.
          EOF
          fi

          # Insert the new version entry after the ## [Unreleased] section
          awk -v entry="$(cat version-entry.md)" '
            /^## \[Unreleased\]/ {
              print
              # Print blank line, then the new entry, then another blank line
              print ""
              print entry
              print ""
              next
            }
            # Skip if this is the first occurrence of our version (avoid duplicates)
            /^## \['"$VERSION"'\]/ && !seen { seen=1; next }
            seen && /^## \[/ { seen=0 }
            !seen || !/^## \['"$VERSION"'\]/
          ' changelog.md > changelog-updated.md

          mv changelog-updated.md changelog.md

          # Clean up
          rm -f main-changelog.md version-entry.md

      - name: Update VitePress version dropdown
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Update the version in .vitepress/config.mts
          sed -i "s/text: 'v[0-9.]*',/text: 'v$VERSION',/" .vitepress/config.mts

          echo "✓ Updated version dropdown to v$VERSION"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add changelog.md .vitepress/config.mts
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update to v${{ steps.version.outputs.version }}"
            git push origin gh-pages
            echo "✓ Documentation updated on gh-pages"
          fi
