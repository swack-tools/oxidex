name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Gates every other job. Refuses a tag that disagrees with the crate version
  # in Cargo.toml, and classifies the tag: a SemVer pre-release (any '-' suffix,
  # e.g. v2.0.0-beta.1) publishes as a GitHub pre-release that is never marked
  # Latest and does not touch the stable docs site. tools/ci/release_version.py
  # holds the logic; tools/ci/test_release_workflow.py pins the wiring below.
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.classify.outputs.version }}
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Classify tag
        id: classify
        run: python3 tools/ci/release_version.py --tag "$GITHUB_REF_NAME" --cargo-toml Cargo.toml

      - name: Require tag commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "refusing: tag commit is not reachable from origin/main" >&2
            exit 1
          fi

  build-linux:
    name: Build Linux (${{ matrix.target }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 - native build on x64. 8x: a from-scratch
          # `cargo build --release` with no warm cache, which parallelises
          # across codegen units.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Linux ARM64 - native build on arm64. Left at 2x: unchanged by this
          # migration, and now the long pole of the release. Worth revisiting
          # separately against measured arm64 build times.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      # `key` carries the target triple: both matrix legs share a job id, so
      # without it the x64 and arm64 caches would collide on one key.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: release
          key: ${{ matrix.target }}

      - name: Install musl tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools musl-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/oxidex

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Copy binary to artifacts
        run: |
          cp target/${{ matrix.target }}/release/oxidex artifacts/oxidex-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxidex-${{ matrix.target }}
          path: artifacts/oxidex-${{ matrix.target }}
          retention-days: 1

  build-windows:
    name: Build Windows (x86_64)
    needs: verify-version
    # 8x: same profile as the Linux x64 build -- a cold cross-compile of the
    # whole workspace via mingw.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: release-windows

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mingw-w64 gcc

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-gnu
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Copy binary to artifacts
        run: |
          cp target/x86_64-pc-windows-gnu/release/oxidex.exe artifacts/oxidex-x86_64-pc-windows-gnu.exe

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxidex-x86_64-pc-windows-gnu
          path: artifacts/oxidex-x86_64-pc-windows-gnu.exe
          retention-days: 1

  build-macos:
    name: Build and Sign macOS (universal)
    needs: verify-version
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Install dependencies
        run: |
          brew install just create-dmg

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: release-macos

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          : "${BUILD_CERTIFICATE_BASE64:?missing BUILD_CERTIFICATE_BASE64}"
          : "${P12_PASSWORD:?missing P12_PASSWORD}"
          : "${KEYCHAIN_PASSWORD:?missing KEYCHAIN_PASSWORD}"
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build release
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          : "${DEVELOPMENT_TEAM:?missing DEVELOPMENT_TEAM}"
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p artifacts
          APP_PATH="artifacts/oxidex-universal-apple-darwin"
          lipo -create -output "$APP_PATH" \
            target/aarch64-apple-darwin/release/oxidex \
            target/x86_64-apple-darwin/release/oxidex
          test "$(lipo -archs "$APP_PATH")" = "aarch64 x86_64"

      - name: Sign binary
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          : "${KEYCHAIN_PASSWORD:?missing KEYCHAIN_PASSWORD}"
          APP_PATH="artifacts/oxidex-universal-apple-darwin"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY_LINES=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/^[[:space:]]*[0-9]*) \([0-9A-F]*\) "Developer ID Application:.*"$/\1/p')
          IDENTITY_COUNT=$(printf '%s\n' "$IDENTITY_LINES" | sed '/^$/d' | wc -l | tr -d '[:space:]')
          if [ "$IDENTITY_COUNT" -ne 1 ]; then
            echo "refusing: expected exactly one Developer ID Application identity" >&2
            exit 1
          fi
          IDENTITY="$IDENTITY_LINES"

          codesign --sign "$IDENTITY" \
            --timestamp \
            --options runtime \
            --verbose \
            --keychain "$KEYCHAIN_PATH" \
            "$APP_PATH"
          codesign --verify --strict --verbose=4 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" > entitlements.plist 2>/dev/null || true
          test ! -s entitlements.plist

      - name: Create DMG
        run: |
          just create-dmg v${{ steps.version.outputs.version }} artifacts/oxidex-universal-apple-darwin

      - name: Notarize DMG
        env:
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          DMG_PATH="dist/oxidex-v${{ steps.version.outputs.version }}.dmg"
          : "${NOTARIZATION_APPLE_ID:?missing NOTARIZATION_APPLE_ID}"
          : "${NOTARIZATION_PASSWORD:?missing NOTARIZATION_PASSWORD}"
          : "${NOTARIZATION_TEAM_ID:?missing NOTARIZATION_TEAM_ID}"

          echo "Submitting DMG for notarization..."
          SUBMISSION_OUTPUT=$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$NOTARIZATION_APPLE_ID" \
            --password "$NOTARIZATION_PASSWORD" \
            --team-id "$NOTARIZATION_TEAM_ID" \
            --wait 2>&1)

          SUBMISSION_ID=$(echo "$SUBMISSION_OUTPUT" | grep -E "^\s+id:" | head -1 | awk '{print $2}' | tr -d '[:space:]')
          if [ -z "$SUBMISSION_ID" ]; then
            echo "refusing: notarization returned no submission id" >&2
            exit 1
          fi

          if echo "$SUBMISSION_OUTPUT" | grep -q "status: Accepted"; then
            echo "✓ Notarization accepted"
          else
            xcrun notarytool log "$SUBMISSION_ID" notarization-log.json \
              --apple-id "$NOTARIZATION_APPLE_ID" \
              --password "$NOTARIZATION_PASSWORD" \
              --team-id "$NOTARIZATION_TEAM_ID"

            exit 1
          fi

          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "$DMG_PATH"

          echo "Verifying DMG notarization..."
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Copy signed binary and DMG to artifacts
        run: |
          cp dist/oxidex-v${{ steps.version.outputs.version }}.dmg artifacts/

      - name: Upload signed binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxidex-universal-apple-darwin
          path: artifacts/oxidex-universal-apple-darwin
          retention-days: 1

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxidex-dmg
          path: artifacts/oxidex-v${{ steps.version.outputs.version }}.dmg
          retention-days: 1

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  create-release:
    name: Create GitHub Release
    needs: [verify-version, build-linux, build-windows, build-macos]
    # 2x: downloads artifacts, copies files and calls the releases API.
    # Nothing is compiled here.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Display artifact structure
        run: ls -R artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Linux x64 (musl static binary)
          cp artifacts/oxidex-x86_64-unknown-linux-musl/oxidex-x86_64-unknown-linux-musl release-assets/
          # Linux ARM64 (musl static binary)
          cp artifacts/oxidex-aarch64-unknown-linux-musl/oxidex-aarch64-unknown-linux-musl release-assets/
          # Windows x64
          cp artifacts/oxidex-x86_64-pc-windows-gnu/oxidex-x86_64-pc-windows-gnu.exe release-assets/
          # macOS signed universal binary (aarch64 and x86_64)
          cp artifacts/oxidex-universal-apple-darwin/oxidex-universal-apple-darwin release-assets/
          # macOS DMG (signed and notarized)
          find artifacts/oxidex-dmg -maxdepth 1 -type f -name '*.dmg' -exec cp {} release-assets/ \;

      - name: Create checksums
        run: |
          (cd release-assets && shasum -a 256 ./* > SHA256SUMS)

      - name: Extract version and create release notes
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          cat > release-notes.md << 'EOF'
          ## OxiDex v$VERSION

          ### Release Artifacts

          **Linux:**
          - `oxidex-x86_64-unknown-linux-musl` - Linux x86_64 (musl, static binary)
          - `oxidex-aarch64-unknown-linux-musl` - Linux ARM64 (musl, static binary)

          **Windows:**
          - `oxidex-x86_64-pc-windows-gnu.exe` - Windows x86_64

          **macOS:**
          - `oxidex-universal-apple-darwin` - Signed universal macOS binary (Apple Silicon and Intel)
          - `oxidex-v$VERSION.dmg` - Signed and notarized macOS DMG installer
          - `SHA256SUMS` - SHA-256 checksums for every release asset

          ### Installation

          **Linux/macOS:**
          ```bash
          # Download the appropriate binary
          chmod +x oxidex-*
          sudo mv oxidex-* /usr/local/bin/oxidex
          ```

          **Windows:**
          Download and run `oxidex-x86_64-pc-windows-gnu.exe`

          **macOS DMG:**
          1. Download and open the DMG file
          2. Drag OxiDex to Applications or desired location
          3. No security warnings - fully signed and notarized by Apple

          ### Note
          The macOS artifacts are signed with a Developer ID certificate and the DMG is notarized by Apple for secure installation.
          EOF

          # Replace $VERSION in the file with actual version
          sed -i "s/\$VERSION/$VERSION/g" release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Release v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          # Keep the release private until the downloaded GitHub assets pass
          # the same checksum and macOS acceptance checks as a user download.
          draft: true
          # A '-' in the tag (v2.0.0-beta.1) is a SemVer pre-release: publish it
          # as a GitHub pre-release and never let it take the Latest badge, so
          # /releases/latest and anything that follows it stay on the last
          # stable release.
          prerelease: ${{ needs.verify-version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.verify-version.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-release-assets:
    name: Verify downloaded release assets
    needs: [verify-version, create-release]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir downloaded-assets
          gh release download "$GITHUB_REF_NAME" --dir downloaded-assets

      - name: Verify checksums and macOS acceptance
        run: |
          cd downloaded-assets
          shasum -a 256 -c SHA256SUMS
          test "$(lipo -archs oxidex-universal-apple-darwin)" = "aarch64 x86_64"
          codesign --verify --strict --verbose=4 oxidex-universal-apple-darwin
          codesign -d --entitlements :- oxidex-universal-apple-darwin > entitlements.plist 2>/dev/null || true
          test ! -s entitlements.plist
          DMG_PATH="oxidex-v${{ needs.verify-version.outputs.version }}.dmg"
          test -s "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"
          MOUNT_DIR=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_DIR" "$DMG_PATH"
          PAYLOAD_PATH="$MOUNT_DIR/oxidex"
          test -f "$PAYLOAD_PATH"
          cmp -s "$PAYLOAD_PATH" oxidex-universal-apple-darwin
          PAYLOAD_HASH=$(shasum -a 256 "$PAYLOAD_PATH" | awk '{print $1}')
          STANDALONE_HASH=$(shasum -a 256 oxidex-universal-apple-darwin | awk '{print $1}')
          test "$PAYLOAD_HASH" = "$STANDALONE_HASH"
          test "$(lipo -archs "$PAYLOAD_PATH")" = "aarch64 x86_64"
          codesign --verify --strict --verbose=4 "$PAYLOAD_PATH"
          hdiutil detach "$MOUNT_DIR"

  publish-release:
    name: Publish verified GitHub Release
    needs: [verify-version, verify-release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  update-docs:
    name: Update GitHub Pages
    needs: [verify-version, publish-release]
    # Stable releases only. A pre-release must not relabel the stable docs
    # site's version dropdown, and the dropdown's sed pattern below
    # (v[0-9.]*) cannot match a pre-release label, so once written a beta
    # label would silently survive every later stable release.
    if: needs.verify-version.outputs.prerelease != 'true'
    # 2x: git operations, awk and sed against the gh-pages branch.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Fetch main branch changelog
        run: |
          git fetch origin main
          git show origin/main:CHANGELOG.md > main-changelog.md

      - name: Update gh-pages changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract the section for this version from main branch changelog
          # Look for the version heading and extract until the next version heading or end
          awk -v ver="$VERSION" '
            /^## \['"$VERSION"'\]/ { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' main-changelog.md > version-entry.md

          # Check if we found the version entry
          if [ ! -s version-entry.md ]; then
            echo "Warning: No entry found for version $VERSION in main changelog"
            echo "Creating a basic entry..."
            cat > version-entry.md << EOF
          ## [$VERSION] - $(date +%Y-%m-%d)

          See [GitHub Release](https://github.com/swack-tools/oxidex/releases/tag/v$VERSION) for details.
          EOF
          fi

          # Insert the new version entry after the ## [Unreleased] section
          awk -v entry="$(cat version-entry.md)" '
            /^## \[Unreleased\]/ {
              print
              # Print blank line, then the new entry, then another blank line
              print ""
              print entry
              print ""
              next
            }
            # Skip if this is the first occurrence of our version (avoid duplicates)
            /^## \['"$VERSION"'\]/ && !seen { seen=1; next }
            seen && /^## \[/ { seen=0 }
            !seen || !/^## \['"$VERSION"'\]/
          ' changelog.md > changelog-updated.md

          mv changelog-updated.md changelog.md

          # Clean up
          rm -f main-changelog.md version-entry.md

      - name: Update VitePress version dropdown
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Update the version in .vitepress/config.mts
          sed -i "s/text: 'v[0-9.]*',/text: 'v$VERSION',/" .vitepress/config.mts

          echo "✓ Updated version dropdown to v$VERSION"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add changelog.md .vitepress/config.mts
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update to v${{ steps.version.outputs.version }}"
            git push origin gh-pages
            echo "✓ Documentation updated on gh-pages"
          fi
