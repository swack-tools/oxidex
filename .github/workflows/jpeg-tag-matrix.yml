name: JPEG Tag Matrix

# Empirical exiftool <-> oxidex JPEG tag comparison:
#  - builds oxidex, writes every ExifTool-writable JPEG tag with exiftool and
#    verifies oxidex reads it; writes via the oxidex CLI and verifies both
#    readers see it (jpeg-tag-matrix binary)
#  - regenerates docs/reference/jpeg-tag-support.md + jpeg-tag-matrix.md
#  - fails on regression vs docs/reference/jpeg-tag-baseline.json (ratchet:
#    improvements auto-raise the baseline)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'oxidex-tags-*/src/**'
      - 'tests/fixtures/jpeg/tag_matrix_base.jpg'
      - '.github/workflows/jpeg-tag-matrix.yml'
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: jpeg-tag-matrix
  cancel-in-progress: true

# No EXIFTOOL_VERSION literal here. A pin in this file is a second source
# of truth, and when it drifted from .exiftool-version the matrix would grade
# against one release while the transcriptions came from another -- which is
# how sixteen correct Canon tags got reported as regressions. Resolved from
# .exiftool-version at run time instead.

jobs:
  tag-matrix:
    name: ExifTool comparison matrix
    # 8x -- the heaviest job in the repo, and it sits at the project's chosen
    # ceiling rather than above it. This is roughly 2.5x faster than the
    # 2-vCPU runner it replaces (~5m09 vs ~12m58), mostly because
    # `run --workers N` builds a rayon pool of N threads
    # (src/bin/jpeg-tag-matrix/matrix.rs), each spawning an exiftool process
    # per tag -- and that pool used to run 4x oversubscribed on 2 cores.
    #
    # Measured across sizes on a throwaway benchmark workflow (removed once it
    # had served its purpose; see PR #305). Seconds per phase, cold cache,
    # mean of the runs taken:
    #
    #        build   manifest   run    total
    #   4x     173       18     327      518
    #   8x     131       15     163      309
    #  16x     126       15      85      226
    #  32x     150       15      33      198
    #
    # (The build column predates collapsing the two cargo invocations below
    # into one, which used to compile the root crate twice; treat those
    # absolute build numbers as an upper bound, not a current baseline.)
    #
    # 8x is well clear of 4x (1.68x), so it earns the ceiling rather than
    # merely sitting at it.
    #
    # 16x and 32x are genuinely faster here -- this is the one job in the repo
    # where they would have bought something real. They are not used anyway:
    # 8x is the standing ceiling for this repo, chosen so no single job can
    # quietly become the dominant line on the CI bill. Note also that 32x is a
    # poor deal even ignoring the ceiling, since its build phase is ~19%
    # SLOWER than 16x; that is a property of the machine, not of cargo
    # (capping CARGO_BUILD_JOBS to 16 and 8 reproduced it exactly), most
    # likely a 32-vCPU VM spanning two NUMA nodes.
    #
    # Raising the ceiling is a cost decision, not a technical one. Re-run the
    # benchmark before changing this; do not adjust it by intuition.
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 90
    # Read-only. This job no longer pushes to main -- see the "Report docs
    # changes" step below for why -- so it needs nothing more than checkout.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The `runner` context (runner.temp) is only available inside a step,
      # not in any `env:` block (workflow- or job-level) -- referencing it
      # there fails to parse ("This run likely failed because of a workflow
      # file issue", zero jobs scheduled). Route it through $GITHUB_ENV from
      # a shell step instead, using the plain $RUNNER_TEMP env var GitHub
      # Actions provides (no expression syntax needed).
      # https://docs.github.com/actions/learn-github-actions/contexts#context-availability
      - name: Set TAGMATRIX_WORK
        run: echo "TAGMATRIX_WORK=$RUNNER_TEMP/oxidex-tagmap" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07)
        with:
          toolchain: stable

      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          cache-on-failure: true
          cache-provider: warpbuild
          shared-key: jpeg-tag-matrix

      - name: Resolve pinned ExifTool version
        id: exiftool-version
        run: |
          set -euo pipefail
          V=$(tr -d '[:space:]' < .exiftool-version)
          case "$V" in
            *[!0-9.]* | "" | .* | *.)
              echo "::error::refusing non-numeric ExifTool pin '$V'"; exit 1 ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Caches only the cloned checkout, not the Archive::Zip install: that
      # one lands in system perl dirs via sudo, and a half-restored perl tree
      # degrades ExifTool silently rather than failing. The clone is the
      # network cost worth skipping; the cpan install stays unconditional.
      # No restore-keys -- a fuzzy key here would serve a stale ExifTool.
      # restore + save as separate steps rather than the combined action,
      # whose post-step save is declared `post-if: success()` -- a later
      # failure in this long job would otherwise discard a good clone.
      - name: Restore pinned ExifTool source
        id: exiftool-cache
        uses: WarpBuilds/cache/restore@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: /tmp/exiftool
          key: exiftool-clone-${{ steps.exiftool-version.outputs.version }}-${{ runner.os }}

      - name: Clone pinned ExifTool
        if: steps.exiftool-cache.outputs.cache-hit != 'true'
        env:
          V: ${{ steps.exiftool-version.outputs.version }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$V" \
            https://github.com/exiftool/exiftool /tmp/exiftool

      # Archive::Zip gates every ZIP-container format; without it a .docx
      # reports FileType: ZIP while -ver still prints the right release.
      # Runs even on a cache hit, as do the assertions: a corrupted or
      # wrong-version cache entry must fail the job, not sail through.
      - name: Install Archive::Zip and verify ExifTool
        env:
          V: ${{ steps.exiftool-version.outputs.version }}
        run: |
          set -euo pipefail
          sudo cpanm --notest Archive::Zip 2>/dev/null || sudo cpan -T Archive::Zip
          perl -MArchive::Zip -e 1
          echo "/tmp/exiftool" >> "$GITHUB_PATH"
          GOT=$(/tmp/exiftool/exiftool -ver)
          [ "$GOT" = "$V" ] || { echo "::error::installed ExifTool $GOT, expected $V"; exit 1; }
          echo "EXIFTOOL=/tmp/exiftool/exiftool" >> "$GITHUB_ENV"

      # Only on a miss, and only after the verify above passed -- default
      # `success()` semantics keep a bad tree from being persisted. Reuses
      # the restore step's cache-primary-key rather than recomputing it.
      - name: Save pinned ExifTool source
        if: steps.exiftool-cache.outputs.cache-hit != 'true'
        uses: WarpBuilds/cache/save@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: /tmp/exiftool
          key: ${{ steps.exiftool-cache.outputs.cache-primary-key }}

      # One invocation, one feature graph. This used to be two builds
      # (`--bin oxidex`, then `--features jpeg-tag-matrix-binary --bin
      # jpeg-tag-matrix`), and cargo fingerprints a crate by its feature set,
      # so the second build recompiled the root crate -- the workspace's
      # largest compile unit by far (~360k lines; the tag crates stay fresh
      # because their features don't change). rust-cache never restores
      # workspace-member artifacts, so that duplicate compile was paid on
      # every run, warm or cold.
      #
      # Safe because `jpeg-tag-matrix-binary` exists only to satisfy the
      # bin's `required-features`: it is an empty feature ([features] in
      # Cargo.toml) and no source anywhere gates on it, so the oxidex binary
      # this produces is behaviorally identical to a no-feature build.
      # Deliberately NOT `--all-features`: that would switch on `magika`
      # (cfg-gated file detection in src/core/operations.rs, plus the ort
      # runtime dependency) and change the behavior of the very binary this
      # matrix grades.
      - name: Build oxidex and jpeg-tag-matrix (release)
        run: >
          cargo build --release --features jpeg-tag-matrix-binary
          --bin oxidex --bin jpeg-tag-matrix

      - name: Generate ExifTool tag manifest
        run: ./target/release/jpeg-tag-matrix manifest --flag-noops

      # Workers track the runner's vCPU count rather than a literal, so
      # resizing the runner above cannot silently leave the box idle -- the
      # old hardcoded `--workers 8` ran 4x oversubscribed on the 2-core
      # runner, and a hardcoded 16 would under-use anything larger. Each
      # worker alternates between Rust work and a blocking exiftool
      # subprocess, so one worker per core is the right ratio.
      - name: Run tag matrix (read + write round-trips)
        run: ./target/release/jpeg-tag-matrix run --workers "$(nproc)"

      - name: Generate reports and check baseline
        run: ./target/release/jpeg-tag-matrix report --check-baseline

      - name: Ratchet baseline on improvement
        run: ./target/release/jpeg-tag-matrix report --update-baseline

      - name: Upload raw results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jpeg-tag-matrix-results
          path: |
            ${{ env.TAGMATRIX_WORK }}/results.json
            ${{ env.TAGMATRIX_WORK }}/exiftool_jpeg_tags.json
            ${{ env.TAGMATRIX_WORK }}/exiftool_jpeg_readonly_tags.json
          retention-days: 90

      - name: Check for docs changes
        id: changes
        run: |
          git diff --quiet docs/reference/jpeg-tag-support.md \
            docs/reference/jpeg-tag-matrix.md \
            docs/reference/jpeg-tag-baseline.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      # This used to push straight to main, then (briefly) to open an
      # auto-merging PR. Both are closed off now: a repository ruleset on
      # main requires every change to land through a pull request with a
      # verified signature, and a separate ENTERPRISE policy forbids GitHub
      # Actions from creating pull requests at all ("GitHub Actions is not
      # permitted to create or approve pull requests"), which no repo or org
      # setting can override. There is no unattended path left from this
      # token to main, so the job stops trying and instead hands the diff to
      # a human: a job summary for a quick look, and a patch artifact for
      # `git apply` if someone wants to land it via a normal PR.
      #
      # Note the patch carries jpeg-tag-baseline.json, which is not a doc but
      # the regression ratchet `report --check-baseline` reads on the next
      # run. Until someone applies the patch, the gate stops tightening (it
      # still enforces the last-landed baseline -- it just doesn't ratchet
      # further on new improvements).
      - name: Report docs changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git diff -u -- docs/reference/jpeg-tag-support.md \
            docs/reference/jpeg-tag-matrix.md \
            docs/reference/jpeg-tag-baseline.json > "$RUNNER_TEMP/jpeg-tag-matrix.patch"
          {
            echo "## JPEG tag matrix docs changed"
            echo
            echo "This job can no longer push to main directly (main requires"
            echo "pull requests with verified signatures, and Actions cannot"
            echo "open PRs here). Download the \`jpeg-tag-matrix-patch\` artifact"
            echo "and apply it via a normal PR:"
            echo
            echo '```'
            git diff --stat -- docs/reference/jpeg-tag-support.md \
              docs/reference/jpeg-tag-matrix.md \
              docs/reference/jpeg-tag-baseline.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload docs patch
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jpeg-tag-matrix-patch
          path: ${{ runner.temp }}/jpeg-tag-matrix.patch
          retention-days: 90
