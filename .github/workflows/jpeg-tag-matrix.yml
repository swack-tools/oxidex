name: JPEG Tag Matrix

# Empirical exiftool <-> oxidex JPEG tag comparison:
#  - builds oxidex, writes every ExifTool-writable JPEG tag with exiftool and
#    verifies oxidex reads it; writes via the oxidex CLI and verifies both
#    readers see it (jpeg-tag-matrix binary)
#  - regenerates docs/reference/jpeg-tag-support.md + jpeg-tag-matrix.md
#  - fails on regression vs docs/reference/jpeg-tag-baseline.json (ratchet:
#    improvements auto-raise the baseline)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'oxidex-tags-*/src/**'
      - 'tests/fixtures/jpeg/tag_matrix_base.jpg'
      - '.github/workflows/jpeg-tag-matrix.yml'
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: jpeg-tag-matrix
  cancel-in-progress: true

env:
  EXIFTOOL_VERSION: '13.55'

jobs:
  tag-matrix:
    name: ExifTool comparison matrix
    # 8x -- the heaviest job in the repo, and it sits at the project's chosen
    # ceiling rather than above it. This is roughly 2.5x faster than the
    # 2-vCPU runner it replaces (~5m09 vs ~12m58), mostly because
    # `run --workers N` builds a rayon pool of N threads
    # (src/bin/jpeg-tag-matrix/matrix.rs), each spawning an exiftool process
    # per tag -- and that pool used to run 4x oversubscribed on 2 cores.
    #
    # Measured across sizes on a throwaway benchmark workflow (removed once it
    # had served its purpose; see PR #305). Seconds per phase, cold cache,
    # mean of the runs taken:
    #
    #        build   manifest   run    total
    #   4x     173       18     327      518
    #   8x     131       15     163      309
    #  16x     126       15      85      226
    #  32x     150       15      33      198
    #
    # 8x is well clear of 4x (1.68x), so it earns the ceiling rather than
    # merely sitting at it.
    #
    # 16x and 32x are genuinely faster here -- this is the one job in the repo
    # where they would have bought something real. They are not used anyway:
    # 8x is the standing ceiling for this repo, chosen so no single job can
    # quietly become the dominant line on the CI bill. Note also that 32x is a
    # poor deal even ignoring the ceiling, since its build phase is ~19%
    # SLOWER than 16x; that is a property of the machine, not of cargo
    # (capping CARGO_BUILD_JOBS to 16 and 8 reproduced it exactly), most
    # likely a 32-vCPU VM spanning two NUMA nodes.
    #
    # Raising the ceiling is a cost decision, not a technical one. Re-run the
    # benchmark before changing this; do not adjust it by intuition.
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The `runner` context (runner.temp) is only available inside a step,
      # not in any `env:` block (workflow- or job-level) -- referencing it
      # there fails to parse ("This run likely failed because of a workflow
      # file issue", zero jobs scheduled). Route it through $GITHUB_ENV from
      # a shell step instead, using the plain $RUNNER_TEMP env var GitHub
      # Actions provides (no expression syntax needed).
      # https://docs.github.com/actions/learn-github-actions/contexts#context-availability
      - name: Set TAGMATRIX_WORK
        run: echo "TAGMATRIX_WORK=$RUNNER_TEMP/oxidex-tagmap" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.9.1
        with:
          shared-key: jpeg-tag-matrix

      - name: Install pinned ExifTool
        run: |
          git clone -q --depth 1 --branch "${EXIFTOOL_VERSION}" \
            https://github.com/exiftool/exiftool /tmp/exiftool
          echo "/tmp/exiftool" >> "$GITHUB_PATH"
          /tmp/exiftool/exiftool -ver

      - name: Build oxidex and jpeg-tag-matrix (release)
        run: |
          cargo build --release --bin oxidex
          cargo build --release --features jpeg-tag-matrix-binary --bin jpeg-tag-matrix

      - name: Generate ExifTool tag manifest
        run: ./target/release/jpeg-tag-matrix manifest --flag-noops

      # Workers track the runner's vCPU count rather than a literal, so
      # resizing the runner above cannot silently leave the box idle -- the
      # old hardcoded `--workers 8` ran 4x oversubscribed on the 2-core
      # runner, and a hardcoded 16 would under-use anything larger. Each
      # worker alternates between Rust work and a blocking exiftool
      # subprocess, so one worker per core is the right ratio.
      - name: Run tag matrix (read + write round-trips)
        run: ./target/release/jpeg-tag-matrix run --workers "$(nproc)"

      - name: Generate reports and check baseline
        run: ./target/release/jpeg-tag-matrix report --check-baseline

      - name: Ratchet baseline on improvement
        run: ./target/release/jpeg-tag-matrix report --update-baseline

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: jpeg-tag-matrix-results
          path: |
            ${{ env.TAGMATRIX_WORK }}/results.json
            ${{ env.TAGMATRIX_WORK }}/exiftool_jpeg_tags.json
            ${{ env.TAGMATRIX_WORK }}/exiftool_jpeg_readonly_tags.json
          retention-days: 90

      - name: Check for docs changes
        id: changes
        if: github.ref == 'refs/heads/main'
        run: |
          git diff --quiet docs/reference/jpeg-tag-support.md \
            docs/reference/jpeg-tag-matrix.md \
            docs/reference/jpeg-tag-baseline.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      # Opens an auto-merging PR rather than pushing straight to main. main now
      # requires the "Lint & Audit"/"Build & Test" checks, which blocks direct
      # pushes — including this bot's. Going through a PR keeps the automation
      # working AND means these commits are verified; previously they carried
      # "[skip ci]" and landed on main entirely unchecked.
      - name: Open auto-merging PR for docs updates
        if: github.ref == 'refs/heads/main' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch="bot/jpeg-tag-matrix-${SRC_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/reference/jpeg-tag-support.md \
            docs/reference/jpeg-tag-matrix.md \
            docs/reference/jpeg-tag-baseline.json
          # NOTE: no "[skip ci]" — a required status check that never runs
          # leaves the PR unmergeable forever.
          git commit -m "docs: auto-update JPEG tag matrix (exiftool ${EXIFTOOL_VERSION})" \
                     -m "Generated from commit ${SRC_SHA}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs: auto-update JPEG tag matrix (exiftool ${EXIFTOOL_VERSION})" \
            --body "Regenerated from ${SRC_SHA} by the JPEG Tag Matrix workflow."
          # Events triggered by GITHUB_TOKEN do not start workflow runs, so
          # this PR gets no `pull_request` CI run and its required checks would
          # never report -- leaving it open forever. workflow_dispatch is the
          # documented exception to that rule, so ask for the run explicitly.
          gh workflow run ci.yml --ref "$branch"
          gh pr merge "$branch" --squash --auto --delete-branch
