name: Docker

on:
  push:
    tags: ['v*']
  # Dry run. The layer cache and the build itself are only otherwise
  # exercised by a real release, which is a bad place to discover that the
  # cache backend is misconfigured. A dispatch builds both architectures
  # exactly as a release does but PUBLISHES NOTHING: no registry push, no
  # digest artifacts, no manifest list, no tag moved. See the `dry_run`
  # expression on the build step's outputs.
  workflow_dispatch:

concurrency:
  # The workflow only accepts tag pushes. Include both the tag and target SHA
  # so repeated tag pushes dedupe without colliding with another release.
  group: ${{ github.workflow }}-${{ github.ref }}@${{ github.sha }}
  cancel-in-progress: true

env:
  IMAGE: swackhamer/oxidex

permissions:
  contents: read

jobs:
  verify-tag-on-main:
    name: Verify tag is reachable from main
    # 2x: a full-depth clone and one `git merge-base` call. On Warp to skip
    # the GitHub-hosted queue -- this job gates the whole workflow, so its
    # queue wait is on the critical path for every release.
    runs-on: warp-ubuntu-latest-x64-2x
    outputs:
      allowed: ${{ steps.ancestry.outputs.allowed }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify main ancestry
        id: ancestry
        run: |
          set -euo pipefail
          # A dispatch publishes nothing, so there is no tag to vouch for and
          # nothing for this gate to protect. Allow it through explicitly
          # rather than by accident: the gate exists to stop an unreviewed
          # commit reaching Docker Hub, and a dry run cannot.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Tag ${GITHUB_REF_NAME} is not reachable from origin/main; Docker image publication is skipped."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: [verify-tag-on-main]
    if: needs.verify-tag-on-main.outputs.allowed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON('[{"arch":"amd64","platform":"linux/amd64","runner":"warp-ubuntu-latest-x64-8x"},{"arch":"arm64","platform":"linux/arm64","runner":"warp-ubuntu-latest-arm64-8x"}]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-qemu-action anywhere: each architecture builds natively on its
      # own runner. Emulating an arm64 Rust build of this workspace would take
      # 5-10x longer.
      # network=host: required for WarpBuild's Docker layer cache, which
      # proxies the GHA cache backend through a localhost listener buildx
      # can only reach with the host network driver.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: |
            network=host

      - name: Log in to Docker Hub
        if: github.event_name != 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push events publish an image that NO tag points at. That is what makes
      # publishing atomic: the smoke test below runs before the manifest list
      # exists, so a failure here means no tag ever moves.
      #
      # cache-from/cache-to point at WarpBuild's local cache proxy
      # (https://www.warpbuild.com/docs/ci/features/caching#docker-layer-caching)
      # rather than the real GitHub Actions cache -- WarpBuild's runners cache
      # layers on their own faster backend behind a gha-compatible localhost
      # listener. Cache versions differ per runner OS/arch, so amd64 and
      # arm64 (different runner types in this matrix) never share entries
      # even without the explicit scope, but the scope is kept for clarity.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          # push=false on a dispatch. Everything above this line is identical
          # between a dry run and a release, so the dry run measures the real
          # build and populates the real cache.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'workflow_dispatch' }}
          cache-from: type=gha,url=http://127.0.0.1:49160/,scope=oxidex-${{ matrix.arch }},version=1
          cache-to: type=gha,url=http://127.0.0.1:49160/,scope=oxidex-${{ matrix.arch }},mode=max,version=1

      # Runs on the native runner for this architecture, so each image is
      # exercised on the hardware it targets. This cannot live in the merge
      # job: that runs on ubuntu-latest and could not execute the arm64 image
      # without the emulation this design avoids.
      - name: Smoke test
        if: github.event_name != 'workflow_dispatch'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="${IMAGE}@${DIGEST}"
          echo "Testing $ref"

          version=$(docker run --rm "$ref" --version)
          echo "version: $version"
          case "$version" in
            oxidex\ *) ;;
            *) echo "::error::unexpected --version output: $version"; exit 1 ;;
          esac

          out=$(docker run --rm -v "$PWD/tests/fixtures/jpeg:/data:ro" "$ref" sample_with_exif.jpg)
          echo "$out"
          if ! printf '%s\n' "$out" | grep -qx 'IFD0:Make: TestCamera'; then
            echo "::error::image did not parse EXIF from sample_with_exif.jpg"
            exit 1
          fi
          echo "Smoke test passed for $ref"

      - name: Export digest
        if: github.event_name != 'workflow_dispatch'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest list
    needs: [verify-tag-on-main, build]
    if: github.event_name != 'workflow_dispatch' && needs.verify-tag-on-main.outputs.allowed == 'true' && needs.build.result == 'success'
    # 2x: no image build happens here -- this downloads two digest stubs and
    # calls `buildx imagetools create`, which is registry I/O end to end. It
    # is on a Warp runner rather than ubuntu-latest to avoid the GitHub-hosted
    # queue (measured at 8 minutes in deploy-docs.yml's notes, against ~5
    # seconds to start a Warp runner), not for the cores.
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags have already passed the main-ancestry check, so each accepted
      # release advances :latest together with its versioned image tags.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          ls -l
          # Deliberately unquoted: each -t flag and each digest must reach
          # imagetools create as a separate argument. Quoting would collapse
          # them into one argument and break the manifest list.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect published image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
