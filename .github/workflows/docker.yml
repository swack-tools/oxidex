name: Docker

on:
  push:
    tags: ['v*']

concurrency:
  # The workflow only accepts tag pushes. Include both the tag and target SHA
  # so repeated tag pushes dedupe without colliding with another release.
  group: ${{ github.workflow }}-${{ github.ref }}@${{ github.sha }}
  cancel-in-progress: true

env:
  IMAGE: swackhamer/oxidex

permissions:
  contents: read

jobs:
  verify-tag-on-main:
    name: Verify tag is reachable from main
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.ancestry.outputs.allowed }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Verify main ancestry
        id: ancestry
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Tag ${GITHUB_REF_NAME} is not reachable from origin/main; Docker image publication is skipped."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: [verify-tag-on-main]
    if: needs.verify-tag-on-main.outputs.allowed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON('[{"arch":"amd64","platform":"linux/amd64","runner":"warp-ubuntu-latest-x64-8x"},{"arch":"arm64","platform":"linux/arm64","runner":"warp-ubuntu-latest-arm64-8x"}]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # No setup-qemu-action anywhere: each architecture builds natively on its
      # own runner. Emulating an arm64 Rust build of this workspace would take
      # 5-10x longer.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push events publish an image that NO tag points at. That is what makes
      # publishing atomic: the smoke test below runs before the manifest list
      # exists, so a failure here means no tag ever moves.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=oxidex-${{ matrix.arch }}
          cache-to: type=gha,scope=oxidex-${{ matrix.arch }},mode=max

      # Runs on the native runner for this architecture, so each image is
      # exercised on the hardware it targets. This cannot live in the merge
      # job: that runs on ubuntu-latest and could not execute the arm64 image
      # without the emulation this design avoids.
      - name: Smoke test
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="${IMAGE}@${DIGEST}"
          echo "Testing $ref"

          version=$(docker run --rm "$ref" --version)
          echo "version: $version"
          case "$version" in
            oxidex\ *) ;;
            *) echo "::error::unexpected --version output: $version"; exit 1 ;;
          esac

          out=$(docker run --rm -v "$PWD/tests/fixtures/jpeg:/data:ro" "$ref" sample_with_exif.jpg)
          echo "$out"
          if ! printf '%s\n' "$out" | grep -qx 'IFD0:Make: TestCamera'; then
            echo "::error::image did not parse EXIF from sample_with_exif.jpg"
            exit 1
          fi
          echo "Smoke test passed for $ref"

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest list
    needs: [verify-tag-on-main, build]
    if: needs.verify-tag-on-main.outputs.allowed == 'true' && needs.build.result == 'success'
    # No build work happens here, so no Warp runner is consumed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags have already passed the main-ancestry check, so each accepted
      # release advances :latest together with its versioned image tags.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          ls -l
          # Deliberately unquoted: each -t flag and each digest must reach
          # imagetools create as a separate argument. Quoting would collapse
          # them into one argument and break the manifest list.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect published image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
