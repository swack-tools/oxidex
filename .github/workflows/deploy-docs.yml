name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'benches/**'
      - 'src/parsers/**'
      - 'src/bin/tag-comparison/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# There is no value in publishing coverage and benchmark data for an obsolete
# main commit. A newer main push supersedes the whole deployment run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This was one ~11-minute job that compiled Rust, ran benchmarks, built the
# VitePress site and deployed to Pages on a single runner. It is now two:
#
#  1. The phases have unrelated compute profiles. Generating the ExifTool
#     comparison report is a cold Rust build (~3m47s, parallel); the site
#     build is ~45s of Node. Sizing one runner for both means overpaying for
#     one of them.
#  2. `pages: write` and `id-token: write` live only on `publish`, a job that
#     runs no project code -- it downloads artifacts and builds the site.
#     Previously the deploy credentials were present on a runner that had just
#     executed a full Rust build and benchmark suite.
#
# There is NO benchmarks job here any more. It ran the same `cargo bench` as
# ci.yml's Benchmarks job, and this workflow's path filter (src/parsers/**,
# benches/**) meant a typical main push measured the same commit twice on two
# 8x runners. `publish` now downloads ci.yml's benchmark artifact instead --
# measured once, consumed twice. If you are tempted to re-add a benchmark
# step here, note that it would also have to match ci.yml's runner label AND
# its --quick/lto/codegen-units settings or the two would publish
# incomparable numbers.
jobs:
  comparison-report:
    name: Generate ExifTool comparison report
    # 8x: `just compare-exiftool-full-update` builds the tag-comparison binary
    # from cold and then runs it across the ExifTool sample corpus (restored
    # from the corpus cache below; downloaded only on the first run after an
    # .exiftool-version bump).
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust dependencies
        uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          cache-on-failure: true
          cache-provider: warpbuild
          shared-key: report

      # Archive::Zip is not in core perl, and ExifTool needs it to look inside
      # ZIP containers. Without it OOXML.docx reads as plain ZIP and every
      # container format is silently misidentified -- a full-corpus sweep
      # returns 109,261 tags over 832 files instead of 507,295 over 4,230,
      # with no error and perfectly well-formed output.
      #
      # The pinned oracle refuses to report a number from an interpreter that
      # cannot load it, so omitting this package fails the job outright rather
      # than publishing degraded coverage figures. That refusal is what caught
      # this: "Degraded ExifTool oracle: ... cannot load Archive::Zip".
      - name: Install Perl (for ExifTool)
        run: sudo apt-get update -qq && sudo apt-get install -y perl libarchive-zip-perl

      # taiki-e/install-action, not extractions/setup-just: the latter was
      # measured at 77s to install one small binary, which was a third of
      # this job. install-action fetches a prebuilt binary and is what the
      # rest of the repo already uses (ci.yml, for nextest and cbindgen).
      - name: Install just
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just

      # The corpus cache key below needs the pin before the recipe runs. Same
      # strict validation as ci.yml's resolve step: the value is file content,
      # so it never reaches shell or a cache key unvalidated.
      - name: Resolve pinned ExifTool version
        id: exiftool-version
        run: |
          set -euo pipefail
          V=$(tr -d '[:space:]' < .exiftool-version)
          case "$V" in
            *[!0-9.]* | "" | .* | *.)
              echo "::error::refusing non-numeric ExifTool pin '$V'"; exit 1 ;;
          esac
          echo "Pinned ExifTool: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # The recipe's whole working set: the pinned ExifTool source tree plus
      # the 13 manufacturer sample tarballs (~84MB total, sizes measured
      # 2026-08-08 against the GCS mirror). Uncached, every run re-fetched all
      # of it with exiftool.org -- a small, throttle-happy server -- as the
      # PRIMARY source and no transfer timeout (the recipe's --connect-timeout
      # bounds only the connect phase), so the download step had an unbounded
      # tail and an external availability dependency on every main push.
      # Cached, it is a seconds-long restore, and the corpus is bit-identical
      # between version bumps -- the published coverage numbers cannot shrink
      # because one mirror hiccuped mid-run.
      #
      #  - Keyed on the pin with NO restore-keys: a fuzzy match on a
      #    version-pinned ExifTool cache serves a stale release (the standing
      #    rule; see ci.yml's ExifTool cache).
      #  - 'exiftool-corpus-' is deliberately a DIFFERENT key family from the
      #    'exiftool-<ver>-<os>' keys other workflows use: those hold
      #    source-only trees at other paths, and a key shared across layouts
      #    restores whichever layout happened to save first.
      #  - restore + save are separate steps because the combined action saves
      #    from a post step declared `post-if: success()`: a comparison
      #    failure -- the case cache-on-failure exists for -- would throw away
      #    a perfectly good corpus download.
      - name: Restore ExifTool corpus cache
        id: corpus-cache
        uses: WarpBuilds/cache/restore@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: /tmp/oxidex-exiftool-cache
          key: exiftool-corpus-${{ steps.exiftool-version.outputs.version }}-${{ runner.os }}

      # The recipe trusts what it finds in the cache dir: a tarball that
      # exists is extracted with `|| true`, so a truncated one silently
      # SHRINKS the corpus instead of failing, and the source tree is trusted
      # on the word of a marker file. Heal both here, before the recipe runs:
      # anything corrupt is deleted so the recipe re-downloads it fresh (the
      # heal path IS the normal cold path). The warning annotation keeps a
      # repeatedly-healing -- i.e. poisoned -- cache entry visible.
      - name: Verify restored corpus
        if: steps.corpus-cache.outputs.cache-hit == 'true'
        env:
          V: ${{ steps.exiftool-version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DIR=/tmp/oxidex-exiftool-cache
          for f in "$DIR"/samples-*.tar.gz; do
            if ! gzip -t "$f" 2>/dev/null; then
              echo "::warning::corrupt $(basename "$f") in corpus cache; deleted for re-download"
              rm -f "$f"
            fi
          done
          GOT=$("$DIR/exiftool/exiftool" -ver 2>/dev/null || true)
          if [ "$GOT" != "$V" ]; then
            echo "::warning::cached ExifTool reports '${GOT:-nothing}', expected $V; deleted for re-download"
            rm -rf "$DIR/exiftool" "$DIR/.exiftool-version"
          fi

      - name: Generate ExifTool comparison report
        run: just compare-exiftool-full-update
        env:
          # Same literal path as the corpus cache steps above. The recipe's
          # default happens to match, but the coupling should be explicit
          # rather than a coincidence. (The GITHUB_TOKEN that used to be
          # passed here was dead weight: nothing under this recipe reads it
          # -- checked the justfile and src/bin/tag-comparison -- and it only
          # curls public endpoints.)
          EXIFTOOL_CACHE_DIR: /tmp/oxidex-exiftool-cache

      # Save only a corpus that is provably complete: the pinned source tree
      # answering `-ver` correctly, plus every manufacturer tarball present
      # and gzip-valid. The key is immutable once saved, so persisting a
      # partial set (say, one manufacturer unavailable mid-run) would pin
      # that gap until the next .exiftool-version bump. Skipping the save
      # instead costs one more download attempt next run and corrupts
      # nothing.
      #
      # The list mirrors MANUFACTURERS in the justfile's
      # compare-exiftool-full-update recipe. If the two drift, the failure
      # mode is a skipped save with the culprit named in the log -- never
      # wrong data.
      - name: Check corpus is complete before save
        id: corpus-check
        if: always() && steps.corpus-cache.outputs.cache-hit != 'true'
        env:
          V: ${{ steps.exiftool-version.outputs.version }}
        run: |
          set -euo pipefail
          DIR=/tmp/oxidex-exiftool-cache
          complete=true
          if [ -z "$V" ]; then
            echo "no resolved ExifTool version"
            complete=false
          fi
          GOT=$("$DIR/exiftool/exiftool" -ver 2>/dev/null || true)
          if [ "$GOT" != "$V" ]; then
            echo "source tree bad or missing (got '${GOT:-nothing}', want $V)"
            complete=false
          fi
          for m in Canon Nikon Sony FujiFilm Panasonic Apple Google Samsung Olympus Pentax Leica DJI GoPro; do
            if ! gzip -t "$DIR/samples-$m.tar.gz" 2>/dev/null; then
              echo "samples-$m.tar.gz missing or corrupt"
              complete=false
            fi
          done
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          [ "$complete" = true ] || echo "corpus incomplete; the save step below will be skipped"

      # always(): a failed comparison still downloaded a good corpus, and
      # persisting it is the point -- same reasoning as cache-on-failure on
      # rust-cache above. Reuses the restore step's cache-primary-key rather
      # than recomputing it.
      - name: Save ExifTool corpus cache
        if: always() && steps.corpus-cache.outputs.cache-hit != 'true' && steps.corpus-check.outputs.complete == 'true'
        uses: WarpBuilds/cache/save@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: /tmp/oxidex-exiftool-cache
          key: ${{ steps.corpus-cache.outputs.cache-primary-key }}

      # docs/reference/comparison/ is gitignored and generated at deploy time,
      # so it only exists inside this job. `publish` needs it to render the
      # real comparison pages instead of the placeholder, so hand it over as
      # an artifact. if-no-files-found: error keeps a silently empty report
      # from reaching the site looking like a successful build.
      - name: Upload generated comparison report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comparison-report
          path: docs/reference/comparison
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Build site and deploy to Pages
    needs: [comparison-report]
    # 2x: npm ci plus a VitePress build (~45s). This job compiles no Rust --
    # it consumes what comparison-report produced and what ci.yml measured.
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
      # actions: read is for downloading the benchmark artifact out of a
      # DIFFERENT workflow run (ci.yml's). Without it that download 404s.
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download generated comparison report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: comparison-report
          path: docs/reference/comparison

      # Benchmarks are measured ONCE, by ci.yml's Benchmarks job, and consumed
      # here. This workflow used to run `cargo bench` itself, which meant any
      # main push touching src/parsers/** or benches/** measured the same
      # commit twice, on two 8x runners, for ~600s each.
      #
      # Same-SHA is preferred but NOT required, and that is the whole subtlety
      # of this step: ci.yml and this workflow start from the same push, so by
      # the time publish runs, ci.yml's Benchmarks job is usually still
      # measuring. Insisting on this commit's numbers would mean the
      # performance page almost never updated. So it falls back to the most
      # recent successful run on main, and the stamp below reports the commit
      # the numbers ACTUALLY came from rather than assuming it is this one.
      - name: Locate a benchmark run
        id: benchrun
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Walk candidates newest-first and take the first that actually
          # CARRIES the artifact. "Latest successful run" is not enough: since
          # ci.yml's Benchmarks job skips on a push that touched neither
          # benches/ nor src/, a perfectly green run can have no artifact at
          # all, and a docs-only merge is exactly when this workflow runs.
          # Same reason artifact expiry cannot strand the page.
          pick() {
            gh run list --workflow=ci.yml "$@" --status=success --limit=20 \
              --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"' 2>/dev/null || true
          }
          ID=""; SHA=""
          # Same-SHA first, then recent main history.
          while read -r CAND CSHA; do
            [ -z "${CAND:-}" ] && continue
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAND/artifacts" \
                 --jq '.artifacts[] | select(.name=="benchmark-results" and .expired==false) | .name' \
                 2>/dev/null | grep -q .; then
              ID="$CAND"; SHA="$CSHA"; break
            fi
          done <<<"$(printf '%s\n%s\n' "$(pick --commit="$GITHUB_SHA")" "$(pick --branch=main)")"
          if [ -z "$ID" ]; then
            echo "::warning::no ci.yml run carries a benchmark-results artifact; performance page keeps its existing numbers"
          elif [ "$SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::no benchmarks for $GITHUB_SHA; using run $ID from $SHA"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Download criterion results
        if: steps.benchrun.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-results
          path: target/criterion
          run-id: ${{ steps.benchrun.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Gate everything downstream on the files actually being here, not on
      # the lookup having succeeded -- the download is continue-on-error, so
      # a 404 on an expired artifact must not publish an empty benchmarks dir.
      - name: Check benchmark results are present
        id: bench
        run: |
          set -euo pipefail
          if [ -d target/criterion ] && [ -n "$(ls -A target/criterion 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no criterion results; performance page keeps its existing numbers"
          fi

      # The commit stamped is the one the NUMBERS came from, which is not
      # necessarily HEAD -- see the fallback in "Locate a benchmark run".
      # Stamping HEAD unconditionally would attribute another commit's
      # measurements to this one.
      - name: Update benchmark metadata in docs
        if: steps.bench.outputs.present == 'true'
        env:
          BENCH_SHA: ${{ steps.benchrun.outputs.sha }}
        run: |
          set -euo pipefail
          DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          COMMIT=$(git rev-parse --short "$BENCH_SHA" 2>/dev/null || echo "${BENCH_SHA:0:7}")
          sed -i "s/- \*\*Date:\*\* .*/- **Date:** $DATE/" docs/performance/index.md
          sed -i "s/- \*\*Commit:\*\* .*/- **Commit:** [\`$COMMIT\`](https:\/\/github.com\/swack-tools\/oxidex\/commit\/$COMMIT)/" docs/performance/index.md

      # WarpBuild-native fork: routes the npm cache through WarpBuild's cache
      # backend on this warp-ubuntu-* runner instead of the GitHub one.
      - name: Setup Node.js
        uses: WarpBuilds/setup-node@2867cf8f859d73439e1ad18b542617e5a29f0f10 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      # setup-node's `cache: npm` above only caches npm's DOWNLOAD cache;
      # `npm ci` still deletes and re-extracts node_modules on every run.
      # Cache the installed tree itself, content-addressed by the lockfile,
      # and skip npm ci entirely on a hit. No restore-keys: a near-miss
      # node_modules with npm ci skipped is a broken build, so only an exact
      # lockfile match may hit. The 'node24' literal moves with node-version
      # above. The combined action (post-step save, `post-if: success()`) is
      # fine here, unlike the corpus cache: a failed run merely re-pays a
      # short npm ci next time.
      #
      # The tree is safe to reuse: the only install script that runs on Linux
      # is esbuild's, which writes inside node_modules only (fsevents is
      # darwin-only and never installed here), and nothing in it is keyed to
      # a node minor version.
      - name: Cache docs/node_modules
        id: node-modules-cache
        uses: WarpBuilds/cache@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: docs/node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('docs/package-lock.json') }}

      - name: Install docs dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: docs

      - name: Build VitePress site
        run: npm run docs:build
        working-directory: docs

      - name: Copy benchmark reports to site
        if: steps.bench.outputs.present == 'true'
        run: |
          mkdir -p docs/.vitepress/dist/benchmarks
          cp -r target/criterion/* docs/.vitepress/dist/benchmarks/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
