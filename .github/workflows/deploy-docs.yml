name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'benches/**'
      - 'src/parsers/**'
      - 'src/bin/tag-comparison/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# There is no value in publishing coverage and benchmark data for an obsolete
# main commit. A newer main push supersedes the whole deployment run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This was one ~11-minute job that compiled Rust, ran benchmarks, built the
# VitePress site and deployed to Pages on a single runner. It is now three
# jobs, for three reasons:
#
#  1. The three phases have unrelated compute profiles. Generating the
#     ExifTool comparison report is a cold Rust build (~3m47s, parallel);
#     benchmarking is a single-threaded criterion measurement (~6m09s); the
#     site build is ~45s of Node. Sizing one runner for all three means
#     overpaying for two of them.
#  2. `comparison-report` and `benchmarks` have no dependency on each other,
#     so splitting lets them run concurrently: the serial ~11m15s becomes
#     roughly the length of the longest branch.
#
#     Historical note: while `benchmarks` was on ubuntu-latest it once sat in
#     the GitHub-hosted runner queue for 8 minutes while the warp runner for
#     `comparison-report` started in 5 seconds -- an 8-minute queue wait was
#     the standing cost of keeping benchmarks on GitHub-hosted hardware for
#     measurement comparability. As of 2026-08-08 both benchmark jobs run on
#     warp-ubuntu-latest-x64-2x, so that queue is gone and the concurrency
#     win is no longer hostage to a queue outside our control.
#  3. `pages: write` and `id-token: write` now live only on `publish`, a job
#     that runs no project code -- it downloads artifacts and builds the site.
#     Previously the deploy credentials were present on a runner that had just
#     executed a full Rust build and benchmark suite.
jobs:
  comparison-report:
    name: Generate ExifTool comparison report
    # 8x: `just compare-exiftool-full-update` builds the tag-comparison binary
    # from cold and then runs it across the downloaded ExifTool sample corpus.
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust dependencies
        uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          cache-on-failure: true
          cache-provider: warpbuild
          shared-key: report

      # Archive::Zip is not in core perl, and ExifTool needs it to look inside
      # ZIP containers. Without it OOXML.docx reads as plain ZIP and every
      # container format is silently misidentified -- a full-corpus sweep
      # returns 109,261 tags over 832 files instead of 507,295 over 4,230,
      # with no error and perfectly well-formed output.
      #
      # The pinned oracle refuses to report a number from an interpreter that
      # cannot load it, so omitting this package fails the job outright rather
      # than publishing degraded coverage figures. That refusal is what caught
      # this: "Degraded ExifTool oracle: ... cannot load Archive::Zip".
      - name: Install Perl (for ExifTool)
        run: sudo apt-get update -qq && sudo apt-get install -y perl libarchive-zip-perl

      - name: Install just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0

      - name: Generate ExifTool comparison report
        run: just compare-exiftool-full-update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # docs/reference/comparison/ is gitignored and generated at deploy time,
      # so it only exists inside this job. `publish` needs it to render the
      # real comparison pages instead of the placeholder, so hand it over as
      # an artifact. if-no-files-found: error keeps a silently empty report
      # from reaching the site looking like a successful build.
      - name: Upload generated comparison report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comparison-report
          path: docs/reference/comparison
          if-no-files-found: error
          retention-days: 1

  benchmarks:
    name: Run benchmarks
    # 2x, and DELIBERATELY the same label as ci.yml's Benchmarks job.
    #
    # These two jobs publish comparable numbers -- these go to the docs
    # performance page, ci.yml's go to a 90-day artifact -- so they must
    # always name the SAME runner. Criterion's measurement loop is
    # single-threaded, so cores buy nothing beyond the preceding build.
    #
    # These moved off ubuntu-latest on 2026-08-08 (CHANGELOG: benchmark
    # baseline discontinuity). Numbers from before that date were measured on
    # GitHub-hosted hardware and are NOT comparable with numbers after it. If
    # these ever move again, both must move together, in one commit, and the
    # discontinuity must be recorded in CHANGELOG.md again.
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      benchmarks_changed: ${{ steps.changes.outputs.benchmarks_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD~1 must exist for the change detection below.
          fetch-depth: 2

      - name: Check if benchmarks changed
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^benches/|^src/'; then
            echo "benchmarks_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "benchmarks_changed=false" >> "$GITHUB_OUTPUT"
          fi
          # Always run benchmarks on workflow_dispatch or workflow file changes
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "benchmarks_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust toolchain
        if: steps.changes.outputs.benchmarks_changed == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust dependencies
        if: steps.changes.outputs.benchmarks_changed == 'true'
        uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          cache-on-failure: true
          cache-provider: warpbuild
          shared-key: bench

      - name: Run benchmarks
        if: steps.changes.outputs.benchmarks_changed == 'true'
        run: cargo bench --bench integration_benchmarks --bench parse_benchmarks -- --quick

      - name: Upload criterion results
        if: steps.changes.outputs.benchmarks_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-results
          path: target/criterion
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Build site and deploy to Pages
    needs: [comparison-report, benchmarks]
    # 2x: npm ci plus a VitePress build (~45s). This job compiles no Rust --
    # it consumes what the two jobs above produced.
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download generated comparison report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: comparison-report
          path: docs/reference/comparison

      - name: Download criterion results
        if: needs.benchmarks.outputs.benchmarks_changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: criterion-results
          path: target/criterion

      # Stamped here rather than in the benchmarks job so that job's only
      # output is target/criterion. The commit is identical either way, and
      # the timestamp differs only by the few minutes between the two jobs.
      - name: Update benchmark metadata in docs
        if: needs.benchmarks.outputs.benchmarks_changed == 'true'
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          COMMIT=$(git rev-parse --short HEAD)
          sed -i "s/- \*\*Date:\*\* .*/- **Date:** $DATE/" docs/performance/index.md
          sed -i "s/- \*\*Commit:\*\* .*/- **Commit:** [\`$COMMIT\`](https:\/\/github.com\/swack-tools\/oxidex\/commit\/$COMMIT)/" docs/performance/index.md

      # WarpBuild-native fork: routes the npm cache through WarpBuild's cache
      # backend on this warp-ubuntu-* runner instead of the GitHub one.
      - name: Setup Node.js
        uses: WarpBuilds/setup-node@2867cf8f859d73439e1ad18b542617e5a29f0f10 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs

      - name: Build VitePress site
        run: npm run docs:build
        working-directory: docs

      - name: Copy benchmark reports to site
        if: needs.benchmarks.outputs.benchmarks_changed == 'true'
        run: |
          mkdir -p docs/.vitepress/dist/benchmarks
          cp -r target/criterion/* docs/.vitepress/dist/benchmarks/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
