name: Select M4 Air runner when idle
description: Use the M4 Air runner only when its registered runner(s) are online and idle.
inputs:
  runner-status-token:
    description: Fine-grained token with organization Self-hosted runners read permission.
    required: false
outputs:
  runs_on:
    description: JSON value for a job's runs-on field.
    value: ${{ steps.select.outputs.runs_on }}
runs:
  using: composite
  steps:
    - id: select
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.runner-status-token }}
      run: |
        set -euo pipefail

        fallback() {
          echo 'runs_on="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          echo "::notice::M4 Air runner is busy or unavailable; using ubuntu-latest"
        }

        if [[ -z "$GH_TOKEN" ]]; then
          echo "::notice::RUNNER_STATUS_TOKEN is not configured; using ubuntu-latest"
          fallback
          exit 0
        fi

        org="${GITHUB_REPOSITORY%%/*}"
        if ! groups="$(gh api --paginate --slurp \
          "orgs/${org}/actions/runner-groups?per_page=100" 2>/dev/null)"; then
          echo "::warning::Could not query organization runner groups; RUNNER_STATUS_TOKEN needs Self-hosted runners read access; using ubuntu-latest"
          fallback
          exit 0
        fi

        group_id="$(jq -r '[.[].runner_groups[] | select(.name == "oxidex-m4air") | .id][0] // empty' <<<"$groups")"
        if [[ -z "$group_id" ]]; then
          echo "::warning::Could not find the oxidex-m4air runner group; using ubuntu-latest"
          fallback
          exit 0
        fi

        if ! runners="$(gh api --paginate --slurp \
          "orgs/${org}/actions/runner-groups/${group_id}/runners?per_page=100" 2>/dev/null)"; then
          echo "::warning::Could not query the oxidex-m4air runners; using ubuntu-latest"
          fallback
          exit 0
        fi

        if jq -e '
          [.[].runners[]
            | select(any(.labels[]; .name == "oxidex-m4air"))
            | select(.status == "online")] as $online
          | (($online | length) > 0)
            and all($online[]; .busy == false)
        ' <<<"$runners" >/dev/null; then
          echo 'runs_on=["self-hosted","Linux","ARM64","oxidex-m4air"]' >> "$GITHUB_OUTPUT"
          echo "::notice::M4 Air runner is online and idle; selecting oxidex-m4air"
        else
          fallback
        fi
