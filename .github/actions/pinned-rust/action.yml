name: Pinned Rust toolchain
description: Install the repository toolchain before invoking build or test commands.
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYTHON'
        import os
        import re
        import tomllib
        from pathlib import Path
        pin = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]
        channel = pin["channel"]
        components = pin.get("components", [])
        if not isinstance(channel, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", channel):
            raise SystemExit("Rust channel must be an exact version")
        if not isinstance(components, list) or any(not isinstance(c, str) or not re.fullmatch(r"[a-z0-9-]+", c) for c in components):
            raise SystemExit("Invalid Rust component list")
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write(f"channel={channel}\ncomponents={','.join(components)}\n")
        PYTHON
    - name: Bootstrap rustup if missing on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        if command -v rustup >/dev/null 2>&1; then
          exit 0
        fi
        export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
        if [ -x "$CARGO_HOME/bin/rustup" ]; then
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          exit 0
        fi
        case "$(uname -m)" in
          x86_64) target=x86_64-unknown-linux-gnu ;;
          aarch64) target=aarch64-unknown-linux-gnu ;;
          *) echo "Unsupported Linux architecture for rustup bootstrap" >&2; exit 1 ;;
        esac
        temp_dir=$(mktemp -d "${RUNNER_TEMP:?}/oxidex-rustup.XXXXXXXX")
        trap 'rm -rf -- "$temp_dir"' EXIT
        base="https://static.rust-lang.org/rustup/dist/$target/rustup-init"
        retry_download() {
          local url=$1 dest=$2 attempt status
          for attempt in 1 2 3; do
            rm -f -- "$dest"
            if curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
                --location --silent --show-error --fail --retry 2 --retry-connrefused \
                --connect-timeout 10 --max-time 60 --output "$dest" "$url"; then
              return 0
            else
              status=$?
            fi
            case "$status" in
              5|6|7|18|28|35|52|55|56)
                if [ "$attempt" -lt 3 ]; then
                  echo "Rustup bootstrap download transport failure ($status); retrying $url" >&2
                  sleep "$attempt"
                  continue
                fi ;;
            esac
            echo "Rustup bootstrap download failed ($status): $url" >&2
            return 1
          done
        }
        retry_download "$base" "$temp_dir/rustup-init"
        retry_download "$base.sha256" "$temp_dir/rustup-init.sha256"
        checksum=$(cat "$temp_dir/rustup-init.sha256")
        checksum_pattern='^[a-f0-9]{64} \*\./rustup-init$'
        if [[ ! $checksum =~ $checksum_pattern ]]; then
          echo "Invalid rustup-init checksum format" >&2
          exit 1
        fi
        (cd "$temp_dir" && sha256sum --check --status rustup-init.sha256)
        chmod +x "$temp_dir/rustup-init"
        "$temp_dir/rustup-init" --default-toolchain none --no-modify-path -y
        test -x "$CARGO_HOME/bin/rustup"
        echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action, explicit repo version
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        components: ${{ steps.pin.outputs.components }}
    - name: Verify tools are ready before tests
      shell: bash
      env:
        PINNED_RUST: ${{ steps.pin.outputs.channel }}
      run: |
        set -euo pipefail
        test "$(rustup show active-toolchain | cut -d ' ' -f 1)" = "$(rustup run "$PINNED_RUST" rustc -vV | sed -n 's/^host: //p' | sed "s/^/$PINNED_RUST-/")"
        pinned_rustc=$(rustup which --toolchain "$PINNED_RUST" rustc)
        pinned_identity=$("$pinned_rustc" -vV)
        test "$(printf '%s\n' "$pinned_identity" | sed -n 's/^release: //p')" = "$PINNED_RUST"
        test -n "$(printf '%s\n' "$pinned_identity" | sed -n 's/^commit-hash: //p')"
        for compiler in rustc "${RUSTC:-rustc}"; do
          if [ "$("$compiler" -vV)" != "$pinned_identity" ]; then
            echo "Compiler $compiler differs from the rustup-resolved repository pin" >&2
            exit 1
          fi
        done
        pinned_cargo=$(rustup which --toolchain "$PINNED_RUST" cargo)
        if [ "$(cargo -vV)" != "$("$pinned_cargo" -vV)" ]; then
          echo "Cargo build identity differs from the rustup-resolved repository pin" >&2
          exit 1
        fi
        for tool in cargo rustfmt; do
          pinned_tool=$(rustup which --toolchain "$PINNED_RUST" "$tool")
          if [ "$("$tool" --version)" != "$("$pinned_tool" --version)" ]; then
            echo "PATH-resolved $tool differs from the rustup-resolved repository pin" >&2
            exit 1
          fi
        done
        rustc --version
        cargo --version
        rustfmt --version
