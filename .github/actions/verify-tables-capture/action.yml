name: Verify Generated Tables capture
description: >-
  Download the verify-tables-capture artifact and restore
  $RUNNER_TEMP/{hydrated-reader.json,catalog-writer-source.json,native-processors-*.tsv,garmin-fit-protocol.json}.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: verify-tables-capture
        path: ${{ runner.temp }}/verify-tables-capture
    - name: Decompress capture
      shell: bash
      run: |
        set -euo pipefail
        IN="$RUNNER_TEMP/verify-tables-capture"
        zstd -q -d "$IN/hydrated-reader.json.zst" -o "$RUNNER_TEMP/hydrated-reader.json"
        zstd -q -d "$IN/catalog-writer-source.json.zst" -o "$RUNNER_TEMP/catalog-writer-source.json"
        zstd -q -d "$IN/garmin-fit-protocol.json.zst" -o "$RUNNER_TEMP/garmin-fit-protocol.json"
        cp "$IN"/native-processors-*.tsv "$RUNNER_TEMP/"
        ls -l "$RUNNER_TEMP"/hydrated-reader.json "$RUNNER_TEMP"/catalog-writer-source.json "$RUNNER_TEMP"/native-processors-*.tsv
