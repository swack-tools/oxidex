# ARC runner scale set "ionos-bench-dedicated" (gha-runner-scale-set chart).
githubConfigUrl: https://github.com/swack-tools
githubConfigSecret: arc-github
runnerScaleSetName: ionos-bench-dedicated
minRunners: 0
maxRunners: 1
listenerTemplate:
  spec:
    nodeSelector:
      workload: ci-runners
    containers:
      - name: listener
template:
  metadata:
    annotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
  spec:
    nodeSelector:
      pool: bench-dedicated
    imagePullSecrets:
      - name: ghcr-pull
    containers:
      - name: runner
        image: ghcr.io/swack-tools/ci-runner:2.337.0-1
        imagePullPolicy: IfNotPresent
        command: ["/home/runner/run.sh"]
        # CPU is a request only, never a limit, so a job can use idle cores.
        # Memory limit = request, so one job can't starve its neighbours.
        resources:
          requests:
            cpu: "14"
            memory: 13Gi
          limits:
            memory: 13Gi
