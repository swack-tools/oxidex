# actionlint cannot know about runner labels that are not GitHub-hosted, so
# without this file every `runs-on:` in this repo is reported as an unknown
# label and the real findings are buried.
#
# This lists the labels that are *valid*, not the ones that are appropriate.
# Which size a given job should use is a separate judgement, argued at each
# `runs-on:` -- see the comments there. Linux x64 jobs use `spot` or the
# proposed `spot-heavy32` lane; ARM64 and macOS use GitHub-hosted runners.
self-hosted-runner:
  labels:
    # Ubicloud (GitHub App): standard-N = N vCPU x64. Kept for workflows
    # outside ci.yml and historical runner measurements.
    - ubicloud-standard-4
    - ubicloud-standard-8
    # Organization runner group `oxidex-m4air`; spot x64 pool labels.
    - oxidex-spot-7x27
    - oxidex
    - spot
    # Proposed single reserved 8-vCPU/32-GiB Linux x64 runner; not installed yet.
    - spot-heavy32
    # Docker-capable runners with the host Docker socket mounted.
    - docker
