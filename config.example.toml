# Copy this file to config.toml (gitignored) and fill in real values.
# scripts/model_fix_loop.py and scripts/parallel_model_fix_loop.py both read
# config.toml by default (override the path with --config).
#
# Each [[worker.models]]/[[reviewer.models]] entry is one pool member. One
# is picked at random for every individual model call (each fixer attempt,
# each reviewer verdict), so a run rotates across the whole pool instead of
# pinning to one model. A single-entry pool behaves exactly like the old
# fixed-model setup.
#
# An entry needs only "name" -- it inherits base_url/api_key from its
# [worker]/[reviewer] table. Add base_url/api_key directly on an entry to
# pull that one model from a different provider (see the Fireworks example
# below), so a single pool can mix providers.

[worker]
base_url = "https://pass.wafer.ai/v1"
api_key = "your-api-key-here"
max_tokens = 4096
# max_prompt_tokens: section 6 raised the default 4096 -> 8192 (not the
# critiqued 12288 -- TPM economics), paired with graduated per-section
# truncation (assemble_prompt_sections) so the extra room reaches the
# learning block instead of just more parser-file text.
max_prompt_tokens = 8192
reasoning_effort = "low"
# stream = true is the default; the reply (and, when the provider sends a
# final usage chunk via stream_options.include_usage, its cache/token
# accounting) is reassembled exactly as a non-streamed call would return.
stream = true
# prompt_cache: "auto" (default) sends plain messages and relies on the
# provider's automatic prefix caching -- build_prompt orders sections
# static-first so that prefix is maximal. "explicit" additionally wraps the
# static prefix in an Anthropic-style cache_control breakpoint (only helps
# providers that accept it; opt-in since it changes the request shape).
# "off" disables both. Either way, cached-token counts the provider reports
# are logged to manifest.log as cached_tokens=<hit>/<total>.
prompt_cache = "auto"
thinking = false
temperature = 0.7
max_prompt_tags = 40
max_prompt_file_bytes = 60000
timeout = 600
# deadline_seconds (default 120): wall-clock ceiling on ONE model call,
# checked as stream chunks arrive and NOT reset by arriving data. This is
# the knob that actually bounds a call -- `timeout` above is urlopen's
# SOCKET read timeout, which every arriving SSE chunk resets, so under
# stream = true it cannot bound a slow-drip response at all (measured on
# one provider: a single request ran 2118s against timeout=1200). On
# expiry the connection is closed and the request is replayed, counting
# against max_retries.
deadline_seconds = 120
# Reading files is FREE and UNLIMITED: the fixer may send as many
# "REQUEST: <path>" turns as it likes and productive ones cost nothing.
# max_request_turns bounds only the UNPRODUCTIVE ones -- a path that does
# not resolve, a range starting past the end, or a re-ask of content
# still VISIBLE in the conversation (byte-identical payloads are re-asks
# whatever the request string looked like; content compaction has elided
# is re-served free). The key kept its old name so existing configs keep
# working; what changed is what it counts.
max_request_turns = 20
# Runaway backstop on TOTAL requests per attempt, free ones included.
# Only a looping model ever reaches it; the model hears about it only at
# the moment it fires, via a forced-diff demand that names the ceiling
# rather than blaming a wasted-request allowance it never spent.
max_request_turns_ceiling = 250
max_request_repeats = 3
max_verify_turns = 10
# Repair rounds. max_repair_rounds is the base budget every candidate
# gets; max_review_rounds is EXTRA rounds that only a SUBSTANTIVE
# reviewer rejection unlocks, one per rejection. So a patch the reviewer
# keeps pushing back on gets 5 + 5 = 10 rounds of fixer/reviewer
# back-and-forth, while one that simply will not compile still gets 5 --
# the argument is worth having more than once only when every mechanical
# gate already passed. A reviewer that could not be reached, or whose
# reply carried no verdict, has judged nothing and unlocks nothing.
max_repair_rounds = 5
max_review_rounds = 5
compaction_trigger_tokens = 150000
compaction_keep_recent_turns = 10
# compaction_min_elide_tokens: once compaction triggers, only served user
# payloads whose own estimated size exceeds this floor are stubbed (default
# 3000); smaller turns are left intact.
compaction_min_elide_tokens = 3000
# The governor is a steady-state rpm BUDGET shared by the fleet through one
# flock-guarded token bucket -- how fast everyone is collectively allowed to
# go. It does not react to failure: the fleet-wide cooldown it used to
# impose on a 429 (governor_cooldown_seconds / governor_max_cooldown_seconds)
# is gone, because one worker's rejection pausing every worker phase-locks
# the fleet into a synchronised burst -- exactly the shape a rate limiter
# rejects. Rate-limit reactions are per-worker (jittered backoff, honouring
# Retry-After) and per-endpoint (a process-local park on a spent cost
# budget). Both live in call_model. Setting the two removed keys here is
# harmless and has no effect.
governor_calls_per_minute = 30
governor_burst = 5
max_cluster_tags = 6
use_sccache = true
# claim_stale_seconds: a tag claim in the shared tag-state older than this
# is treated as abandoned (owner dead) and re-claimable. Generous because a
# live owner's heartbeat thread re-stamps its claim every heartbeat_seconds
# while an attempt is in flight -- stale means dead, not slow.
claim_stale_seconds = 7200
heartbeat_seconds = 60
max_retries = 1000
retry_backoff_seconds = 2
max_retry_backoff_seconds = 120
# build_semaphore: spec section 5's cross-process cargo build/test slot
# ceiling (find_tag_gaps.build_semaphore) -- the max number of concurrent
# cargo build/check/test invocations across every worker+merger sharing
# this host, so a full round of workers all rechecking gaps at once can't
# oversubscribe the host's cores by linking concurrently. 5 is the spec's
# own default for a 10-core host; raise only with measured disk/CPU
# headroom (see scripts/check_scale_gate.py).
build_semaphore = 5

# --- Phase 1 knowledge layer / section 6 knobs (spec K1-K5) ---------------
# learning_budget_tokens: flat, reserved token budget for build_prompt's
# learning block (GLOBAL-PITFALLS.md excerpt + module playbook + sweep
# reviews + lessons tail) -- never squeezed further by the graduated
# per-section truncation, and never dropped entirely.
learning_budget_tokens = 1200
# parser_floor_tokens: the parser-files section is elastic under overflow
# but never shrinks below this -- "elastic with a floor", never squeezed
# to zero (the inverted-starvation critique this resolves).
parser_floor_tokens = 2000
# lessons_tail_kb: how far back build_prompt seeks into the tail of
# logs/lessons.jsonl (bounded, no full scan of a ledger that only grows)
# when rendering the learning block's "recent lessons" entries.
lessons_tail_kb = 256

# Tiered routing: explore-phase turns (investigation, REQUEST/VERIFY
# round-trips) use the cheap fast model; patch-phase turns (final diffs,
# repairs, retries) use the strongest model. Omit "phase" on an entry to
# use it for both.
#
# Model ids below were verified against a live GET /v1/models on
# api.theclawbay.com on 2026-08-02 (42 models). Do NOT hardcode availability
# from memory or from this file -- re-enumerate before pinning, because the
# gateway's catalogue moves. Reasoning-capable OpenAI tier as of that date:
# gpt-5.6, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, gpt-5.5, gpt-5.4,
# gpt-5.4-mini. Cross-vendor options for reviewer independence on the SAME
# key and the SAME OpenAI-compatible route: claude-opus-4-8,
# claude-sonnet-4-6, claude-haiku-4-5, gemini-3.1-pro-preview,
# gemini-3-flash-preview, glm-5.2, kimi-k2.7-code, deepseek-v4-pro.
[[worker.models]]
name = "gpt-5.6-terra"
phase = "explore"
reasoning_effort = "medium"

[[worker.models]]
name = "gpt-5.6-sol"
phase = "patch"
reasoning_effort = "max"

# Mixed-provider example: an entry with its own base_url/api_key pulls that
# one model from a different provider (see the header comment above).
# [[worker.models]]
# name = "accounts/fireworks/routers/kimi-k2p7-code-fast"
# base_url = "https://api.fireworks.ai/inference/v1"
# api_key = "your-fireworks-api-key-here"

# Optional: omit this table entirely to have the reviewer reuse [worker]'s
# pool/config exactly. Add it to review with a different model pool and/or
# provider than the fixer.
#
# Reviewer INDEPENDENCE is the point (see docs/AI_HARNESS.md): a reviewer
# drawn from the same pool as the fixer can end up grading its own patch.
# The example below points at a second provider, so its model names are that
# provider's, not the Claw Bay catalogue's -- they will NOT resolve against
# api.theclawbay.com. If you route the reviewer through Claw Bay instead,
# use a cross-vendor id from the list above (e.g. claude-sonnet-4-6) so the
# reviewer is still a different vendor from the fixer on the same key.
[reviewer]
base_url = "https://pass.wafer.ai/v1"
api_key = "your-api-key-here"
max_tokens = 256
reasoning_effort = "max"
stream = true
thinking = true
temperature = 0
timeout = 600
# deadline_seconds (default 120): wall-clock ceiling on ONE model call,
# checked as stream chunks arrive and NOT reset by arriving data. This is
# the knob that actually bounds a call -- `timeout` above is urlopen's
# SOCKET read timeout, which every arriving SSE chunk resets, so under
# stream = true it cannot bound a slow-drip response at all (measured on
# one provider: a single request ran 2118s against timeout=1200). On
# expiry the connection is closed and the request is replayed, counting
# against max_retries.
deadline_seconds = 120
max_retries = 1000
retry_backoff_seconds = 2
max_retry_backoff_seconds = 120
# reviewer_max_prompt_tokens: independent of the fixer's max_prompt_tokens
# -- the reviewer prompt now carries the Perl reference, live post-fix
# evidence, and a scoped emission scan (spec K5) alongside the C1-C5
# checklist, so it gets its own generous budget.
reviewer_max_prompt_tokens = 8192

[[reviewer.models]]
name = "glm5.2-fast"

[[reviewer.models]]
name = "MiniMax-M3"

[[reviewer.models]]
name = "Kimi-K2.6"

[[reviewer.models]]
name = "accounts/fireworks/routers/kimi-k2p7-code-fast"
base_url = "https://api.fireworks.ai/inference/v1"
api_key = "your-fireworks-api-key-here"

# Optional: configures scripts/parallel_tag_fix_loop.py. Omit entirely to
# use its own defaults (workers = 4, max_tags_per_process = 1).
[parallel]
workers = 4
max_tags_per_process = 1

# Optional: spec S3's T3 TABLE-PORT / T4 FOUNDATION-UNLOCK job knobs --
# scripts/model_fix_loop.py's attempt_table_port/attempt_foundation_job.
# Omit entirely to use the spec's own defaults (16384 / 8). These tiers
# are opt-in (no job runs unless explicitly dispatched); this table only
# tunes them when they do.
[table_job]
max_prompt_tokens = 16384
max_repair_rounds = 8
# model: the strongest configured model, per spec S3 -- tag the
# strongest [[worker.models]]/[[reviewer.models]] entry(ies) with
# phase = "table" (alongside the existing "explore"/"patch" tags) rather
# than repeating a model name here; attempt_table_port/
# attempt_foundation_job select via models_for_phase(pool, "table").

# Optional: which GitHub account the auto-publisher pushes and opens PRs
# as. Omit the table entirely and publishing uses whichever account
# `gh auth switch` last made active -- which is account-global machine
# state that no config file records, and which nothing in a sweep's log
# distinguishes from success until the push itself returns 403.
#
# This is a USERNAME, not a secret: the token is read from the keyring
# via `gh auth token --user <name>` at dispatcher startup, so config.toml
# never carries a second credential. Authenticate the account once with
# `gh auth login --user <name>`.
#
# The name is resolved only when auto-publish is on, and a name gh has no
# token for exits 1 at startup rather than failing mid-sweep.
[publish]
github_user = "your-github-username"

# Optional: scripts/fleet_up.sh knobs. Omit the table (or the key) entirely
# to keep every existing default.
[fleet]
# mergers: cap on how many of the squads below get their own merger tier.
# 0 or absent means "all of them" -- unchanged behaviour for every existing
# installation. A positive N takes the first N squads in the order they
# appear below; the rest simply get no merger this run. Precedence:
# fleet_up.sh's --mergers CLI flag, then its FLEET_MAX_MERGERS env var,
# then this key, then 0. See fleet_up.sh's FLEET_MAX_MERGERS comment for
# the full reasoning.
mergers = 0

# Squad manifest -- spec S2 of
# docs/plans/specs/2026-07-24-fleet-knowledge-and-scaling-design.md.
#
# Squads own ExifTool .pm modules, and therefore ALL container formats those
# modules serve.  The shared Rust emitter files (canon.rs, nikon.rs, registry
# const blocks, ...) get exactly one owning squad each, which is what keeps
# squad merges structurally conflict-free.
#
# This table snapshot was taken from the gap census on 2026-07-24. Gap
# counts are deliberately NOT stored anywhere here -- they are derived live,
# every round, by attribute_gaps.py (see the "squads" summary in
# gap-attribution.json). The S2 "Gaps" / "of which JPEG" columns are
# snapshot values for that date, not config.
#
# Fields per squad:
#   modules         ExifTool .pm module names (basename, no .pm suffix) the
#                   squad owns.  attribute_gaps.py routes every attributed gap
#                   module -> squad through this table; a module listed in no
#                   squad falls through to "tail".
#   formats         Container formats from the S2 table.  Informational /
#                   advisory -- live per-squad format lists are re-derived
#                   from actual gap attribution every round.
#   ownership_globs Rust source globs the squad owns.  Deliberately empty for
#                   now: ownership enforcement is warn-only and arrives in a
#                   later phase (see spec YAGNI notes); nothing may treat
#                   these as a gate.
#
# NOTE: this table used to live in a separate, git-tracked scripts/squads.toml
# so every installation shared one copy. It now lives here, in the
# gitignored, per-installation config.toml, so there is exactly one fleet
# config file -- which means it is NO LONGER version-tracked. If you edit
# squad ownership, the change is local to this machine (and to `server`, or
# wherever else you copy config.toml) until someone manually applies the same
# edit everywhere config.toml lives.

[squads.canon]
# "CR3-QuickTime" in the S2 table: CR3 metadata boxes live in QuickTime.pm.
modules = ["Canon", "CanonCustom", "CanonRaw", "CanonVRD", "QuickTime"]
formats = ["JPEG", "CR2", "CR3", "DNG"]
ownership_globs = []

[squads.nikon]
modules = ["Nikon", "NikonCustom", "NikonSettings", "NikonCapture"]
formats = ["JPEG", "NEF"]
ownership_globs = []

[squads."sony-minolta"]
modules = ["Sony", "Minolta", "MinoltaRaw"]
formats = ["JPEG", "MRW"]
ownership_globs = []

[squads.xmp]
# XMP.pm and XMP2.pl both define %Image::ExifTool::XMP::* tables, so the
# single module name "XMP" covers both files.
modules = ["XMP"]
formats = ["JPEG", "XMP", "DNG", "PDF", "PSD", "CR2"]
ownership_globs = []

[squads."exif-core"]
# "Exif.pm IFD wiring" in the S2 table.  The S2 formats column says
# "9 formats" without enumerating; these are the nine containers whose
# IFD wiring routes through Exif.pm in the census.
modules = ["Exif"]
formats = ["JPEG", "TIFF", "NEF", "CR2", "CR3", "DNG", "RW2", "MRW", "X3F"]
ownership_globs = []

[squads.olympus]
modules = ["Olympus"]
formats = ["JPEG"]
ownership_globs = []

[squads."pentax-samsung"]
modules = ["Pentax", "Samsung"]
formats = ["JPEG"]
ownership_globs = []

[squads."panasonic-leica"]
modules = ["Panasonic", "PanasonicRaw"]
formats = ["JPEG", "RW2"]
ownership_globs = []

[squads.mobile]
modules = ["Google", "GoPro", "Apple", "DJI", "Qualcomm"]
formats = ["JPEG"]
ownership_globs = []

[squads.thermal]
modules = ["FLIR", "InfiRay"]
formats = ["JPEG"]
ownership_globs = []

[squads."sigma-c2pa"]
# "Jpeg2000/JUMBF" in the S2 table: JUMBF/C2PA boxes are parsed by
# Jpeg2000.pm (family "JUMBF" in comparison reports).
modules = ["Sigma", "SigmaRaw", "Jpeg2000"]
formats = ["X3F", "JPEG"]
ownership_globs = []

[squads."ps-docs"]
modules = ["Photoshop", "IPTC", "PhotoMechanic", "FotoStation", "PDF"]
formats = ["PSD", "PDF", "JPEG"]
ownership_globs = []

[squads."standards-appn"]
# "JPEG.pm APPn" -> module JPEG.  "Meta" is the Kodak Meta APP3 family
# (no Meta.pm exists; attribution routes the family name here directly).
modules = ["ICC_Profile", "JPEG", "APP12", "Meta", "MPF"]
formats = ["JPEG", "NEF"]
ownership_globs = []

[squads.tail]
# Catch-all squad: "FlashPix/OLE, Kodak/Sanyo/Ricoh/Casio, FujiFilm, small
# formats" per S2.  OLE parsing lives inside FlashPix.pm.  Formats column in
# S2 reads "rest" -- every format not owned above -- so no fixed list here.
# Any attributed module listed in no squad (including module "unknown")
# also rolls up to tail.
modules = ["FlashPix", "Kodak", "Sanyo", "Ricoh", "Casio", "FujiFilm"]
formats = []
ownership_globs = []
