[package]
name = "oxidex-tags-camera"
version = "2.0.0-beta.1"
edition = "2024"
authors = ["OxiDex Contributors"]
description = "Camera-specific tag definitions for OxiDex"
license = "GPL-3.0"
publish = false

[lib]
name = "oxidex_tags_camera"
path = "src/lib.rs"

[dependencies]
bincode = { version = "2.0", features = ["serde"] }
oxidex-tags-core = { path = "../oxidex-tags-core", version = "=2.0.0-beta.1" }
oxidex-tags-shared = { path = "../oxidex-tags-shared", version = "0.1.0" }

[build-dependencies]
bincode = { version = "2.0", features = ["serde"] }
serde_yaml = "0.9"
oxidex-tags-shared = { path = "../oxidex-tags-shared", version = "0.1.0" }
